            status = "DRAFT";

            score -= 10;

        } else if (Math.abs(k.dbe * 2 - Math.round(k.dbe * 2)) > 1e-6) {

            issues.push(createIssue("WARN", "QC_DBE_STEP_INVALID", `DBE step invalid (should be integer or half-integer, got ${k.dbe})`,

                { dbe: k.dbe },

                {},

                [{ action: "tune", target: "kernel", params: { roundDBE: true }, why: "DBE should be integer or 0.5 step" }]));

            score -= 5;

        }

        

        // C2) DBE vs functional group heuristic

        const ringsEst = ((k.smiles || "").match(/\d/g) || []).length / 2;

        const carbonylDBE = ((k.groups?.ketone || 0) + (k.groups?.ester || 0) + (k.groups?.amide || 0) + (k.groups?.acid || 0) + (k.groups?.aldehyde || 0));

        const alkeneDBE = k.groups.alkene || 0;

        const aromaticRingsApprox = k.groups.aromaticC > 0 ? Math.ceil(k.groups.aromaticC / 6) : 0;

        const structuralDBE = ringsEst + carbonylDBE + alkeneDBE;

        

        coverageReport.dbe = {

            value: k.dbe,

            structuralEstimate: structuralDBE,

            ringsEst,

            carbonylDBE,

            alkeneDBE,

            aromaticRingsApprox,

            diff: Math.abs(k.dbe - structuralDBE)

        };

        

        if (k.groups.aromaticC > 0 && k.dbe < aromaticRingsApprox * 2) {

            warnings.push(createIssue("WARN", "QC_AROMATIC_DBE_MISMATCH", `Aromatic C count (${k.groups.aromaticC}) suggests higher DBE than calculated (${k.dbe})`,

                { aromaticC: k.groups.aromaticC, dbe: k.dbe, expectedMin: aromaticRingsApprox * 2 },

                {},

                [{ action: "tune", target: "kernel", params: { recalculateDBE: true }, why: "Aromatic systems contribute to DBE" }]));

            score -= 5;

        }

        

        if (cCount > 20 && (k.groups.O || 0) > 10 && k.dbe < 5) {

            warnings.push(createIssue("WARN", "QC_DBE_FUNCTIONAL_MISMATCH", `High C/O count but low DBE (${k.dbe}) - may indicate macrolide/taxane mismatch`,

                { cCount, oCount: k.groups.O, dbe: k.dbe },

                {},

                [{ action: "tune", target: "kernel", params: { verifyContext: true }, why: "Context may be misclassified" }]));

            score -= 3;

        }

        

        // D) 1H QC

        // D1) 1H integral total vs k.h_carbon (BLOK A: computeH1IntegralAudit — teyit modülü ile aynı kaynak)

        const audit1hIntegral = computeH1IntegralAudit(k, safeH1, {});

        const hSum = audit1hIntegral.hSum;

        const observedLikelyExchH = audit1hIntegral.observedLikelyExchH;

        const totalHKernel = audit1hIntegral.totalHKernel;

        const structuralExchH = audit1hIntegral.structuralExchH;

        const exchEffH = audit1hIntegral.exchEffH;

        const hIntegralExpectedPool = audit1hIntegral.hIntegralExpectedPool;

        const hRatio = audit1hIntegral.hRatio;

        

        coverageReport.h1.totalIntegral = hSum;

        coverageReport.h1.expectedIntegral = hIntegralExpectedPool;

        coverageReport.h1.structuralExchH = structuralExchH;

        coverageReport.h1.observedLikelyExchH = observedLikelyExchH;

        coverageReport.h1.exchEffH = exchEffH;

        coverageReport.h1.ratio = hRatio;

        

        const integralBufferAbs = 2.5;
        const integralBufferRatio = 0.25;
        const integralPass = Math.abs(hSum - hIntegralExpectedPool) <= integralBufferAbs || (hRatio >= 1 - integralBufferRatio && hRatio <= 1 + integralBufferRatio);
        if (!integralPass && hRatio < thresholds.hIntegralRatioMin) {

            issues.push(createIssue("WARN", "QC_H1_INTEGRAL_LOW", `1H integral sum (${hSum}) below expected non-exch pool (${hIntegralExpectedPool}, ratio: ${hRatio.toFixed(2)}; exch_eff=${exchEffH})`,

                { hSum, expected: hIntegralExpectedPool, ratio: hRatio, exchEffH, structuralExchH, observedLikelyExchH },

                {},

                [{ action: "tune", target: "1H", params: { adjustIntegrals: true }, why: "Overlap/symmetry may hide signals" }]));

            score -= 5;

            if (status === "VALIDATED") status = "CONSISTENT";

        } else if (!integralPass && hRatio > thresholds.hIntegralRatioMax) {

            issues.push(createIssue("WARN", "QC_H1_INTEGRAL_HIGH", `1H integral sum (${hSum}) above expected non-exch pool (${hIntegralExpectedPool}, ratio: ${hRatio.toFixed(2)}; exch_eff=${exchEffH})`,

                { hSum, expected: hIntegralExpectedPool, ratio: hRatio, exchEffH, structuralExchH, observedLikelyExchH },

                {},

                [{ action: "tune", target: "1H", params: { checkDuplicates: true }, why: "Possible duplicate signals" }]));

            score -= 5;

            if (status === "VALIDATED") status = "CONSISTENT";

        }

        

        // D2) Exchangeable pool

        const exchSum = safeH1.filter(s => s.is_ex).reduce((a, s) => a + intH(s), 0);

        const exchFrac = (hSum + exchSum) > 0 ? exchSum / (hSum + exchSum) : 0;

        

        coverageReport.h1.exchIntegral = exchSum;

        coverageReport.h1.exchFraction = exchFrac;

        

        if (exchFrac > thresholds.hExchMaxFrac && (k.context === "GENERAL" || k.context === "TAXANE")) {

            warnings.push(createIssue("WARN", "QC_H1_EXCH_TOO_HIGH", `Exchangeable H fraction (${(exchFrac*100).toFixed(1)}%) exceeds threshold`,

                { exchFrac, threshold: thresholds.hExchMaxFrac },

                {},

                [{ action: "tune", target: "1H", params: { reduceExchangeable: true }, why: "Too many exchangeable protons for context" }]));

            score -= 3;

        }

        

        // D3) Proton class coverage

        const methylH = safeH1.filter(h => {

            const n = intH(h);

            return n >= 3 && n % 3 === 0 && !h.is_ex && h.ppm < 3.2;

        });

        const sumCH3 = methylH.reduce((a, h) => a + intH(h), 0);

        const ch3Groups = Math.round(sumCH3 / 3);

        

        const aromaticH = safeH1.filter(h => inRange(h.ppm, [6.3, 8.6]) && !h.is_ex);

        // Vinylic H: BLOK C — generate2D ile aynı isVinylicProtonUnified

        const vinylicH = safeH1.filter(h => isVinylicProtonUnified(h, k));

        const anomericH = safeH1.filter(h => inRange(h.ppm, [4.2, 5.5]) && (h.mult?.includes("d") || h.mult?.includes("dd")) && !h.is_ex);

        const oxymethineH = safeH1.filter(h => inRange(h.ppm, [3.2, 5.6]) && !h.is_ex && h.mult !== "s");

        

        coverageReport.h1.classCounts = {

            methyl: { groups: ch3Groups, integral: sumCH3 },

            aromatic: aromaticH.length,

            vinylic: vinylicH.length,

            anomeric: anomericH.length,

            oxymethine: oxymethineH.length

        };

        

        // Context expectations

        if (k.context === "MACROLIDE" && vinylicH.length === 0 && anomericH.length === 0) {

            warnings.push(createIssue("WARN", "QC_H1_CLASS_MISSING_VINYLIC", "MACROLIDE context expects vinylic/anomeric protons",

                { context: k.context },

                {},

                [{ action: "tune", target: "1H", params: { addVinylic: true }, why: "Macrolides typically have vinylic protons" }]));

            score -= 3;

        }

        

        if (k.context === "TAXANE" && oxymethineH.length < 3) {

            warnings.push(createIssue("WARN", "QC_H1_CLASS_MISSING_OXYMETHINE", "TAXANE context expects multiple oxymethine protons",

                { context: k.context, found: oxymethineH.length },

                {},

                [{ action: "tune", target: "1H", params: { addOxymethine: true }, why: "Taxanes have many O-CH protons" }]));

            score -= 2;

        }

        

        if (k.context === "GLYCOPEPTIDE" && aromaticH.length === 0) {

            warnings.push(createIssue("WARN", "QC_H1_CLASS_MISSING_AROMATIC", "GLYCOPEPTIDE context expects aromatic protons",

                { context: k.context },

                {},

                [{ action: "tune", target: "1H", params: { addAromatic: true }, why: "Glycopeptides typically have aromatic amino acids" }]));

            score -= 3;

        }

        

        // E) 13C QC — BLOK E: cluster + overflow + tip sayımı verify13C ile aynı kaynak (computeC13QcSnapshot)

        const c13Snap = computeC13QcSnapshot({ kernel: k, c13List: safeC13, ppmTolAliph: 0.3, ppmTolArom: 0.3 });

        const cCount = c13Snap.clusteredCount;

        const cRatio = k.counts.C > 0 ? c13Snap.cRatioClustered : 0;

        const cDiff = cCount - k.counts.C;

        

        coverageReport.c13.count = cCount;

        coverageReport.c13.rawCount = c13Snap.rawCount;

        coverageReport.c13.clusteredCount = c13Snap.clusteredCount;

        coverageReport.c13.C_adj = c13Snap.C_adj;

        coverageReport.c13.overflowAdj = c13Snap.overflowAdj;

        coverageReport.c13.expected = k.counts.C;

        coverageReport.c13.ratio = cRatio;

        coverageReport.c13.ratioRaw = c13Snap.cRatioRaw;

        coverageReport.c13.overlapBins = overflowBins.length;

        

        if (cRatio < cMinEff) {

            const note = cDiff < 0 ? `(${Math.abs(cDiff)} carbons hidden due to symmetry/overlap)` : "";

            warnings.push(createIssue("WARN", "QC_C13_COUNT_LOW", `13C clustered count (${cCount}) below expected (${k.counts.C}, ratio: ${cRatio.toFixed(2)}) ${note}`,

                { cCount, expected: k.counts.C, ratio: cRatio, rawCount: c13Snap.rawCount, note },

                {},

                [{ action: "tune", target: "13C", params: { addMissing: true }, why: "Symmetry/overlap may hide signals" }]));

            score -= 5;

            if (status === "VALIDATED") status = "CONSISTENT";

        } else if (cRatio > thresholds.cCountMaxFrac) {

            issues.push(createIssue("WARN", "QC_C13_COUNT_HIGH", `13C clustered count (${cCount}) exceeds expected (${k.counts.C}, ratio: ${cRatio.toFixed(2)})`,

                { cCount, expected: k.counts.C, ratio: cRatio, rawCount: c13Snap.rawCount },

                {},

                [{ action: "tune", target: "13C", params: { removeDuplicates: true }, why: "Possible duplicate generation" }]));

            score -= 5;

            if (status === "VALIDATED") status = "PARTIAL";

        }

        

        // E2) Carbon type distribution (cluster sonrası liste)

        const qCount = c13Snap.dist.qCount;

        const chCount = c13Snap.dist.chCount;

        const ch2Count = c13Snap.dist.ch2Count;

        const ch3Count = c13Snap.dist.ch3Count;

        const totalTyped = c13Snap.dist.totalTyped;

        

        coverageReport.c13.typeDistribution = {

            Q: { count: qCount, fraction: cCount > 0 ? qCount / cCount : 0 },

            CH: { count: chCount, fraction: cCount > 0 ? chCount / cCount : 0 },

            CH2: { count: ch2Count, fraction: cCount > 0 ? ch2Count / cCount : 0 },

            CH3: { count: ch3Count, fraction: cCount > 0 ? ch3Count / cCount : 0 }

        };

        coverageReport.c13.typeCountsVerifyStyle = c13Snap.typeCounts;

        

        if (totalTyped !== cCount) {

            warnings.push(createIssue("WARN", "QC_C13_TYPE_DISTRIBUTION_SUSPECT", `Carbon type assignment incomplete (${totalTyped}/${cCount} typed)`,

                { totalTyped, cCount },

                {},

                [{ action: "tune", target: "13C", params: { assignTypes: true }, why: "All carbons should have type" }]));

            score -= 3;

        }

        

        // Context-based type distribution check

        if (k.context === "MACROLIDE") {

            const chFrac = chCount / (cCount || 1);

            if (chFrac < 0.40) {

                warnings.push(createIssue("WARN", "QC_C13_TYPE_DISTRIBUTION_SUSPECT", `MACROLIDE CH fraction (${(chFrac*100).toFixed(1)}%) below expected (~50%)`,

                    { chFrac, context: k.context },

                    {},

                    [{ action: "tune", target: "13C", params: { increaseCH: true }, why: "Macrolides have high CH content" }]));

                score -= 2;

            }

        }

        

        // E3) Overlap / bin overflow (already checked above in A2)

        

        // F) Methyl Synchronization (1H ↔ 13C ↔ HSQC) — BLOK F: classifyMethyl1HUnified

        const classifyMethyl1H = (peak) => classifyMethyl1HUnified(peak, k, inRange);

        

        // F2) Count 1H methyl classes

        let hMethoxy = 0, hAcetate = 0, hAlkylMethyl = 0, hNMe = 0, hSugarMe = 0, hTertiaryMe = 0;

        let hMethoxyGroups = 0, hAcetateGroups = 0, hAlkylGroups = 0, hNMeGroups = 0, hSugarMeGroups = 0, hTertiaryMeGroups = 0;

        

        safeH1.forEach(s => {

            const classified = classifyMethyl1H(s);

            if (classified) {

                if (classified.class === "methoxy") {

                    hMethoxy += classified.hTotal;

                    hMethoxyGroups += classified.groups;

                } else if (classified.class === "acetate") {

                    hAcetate += classified.hTotal;

                    hAcetateGroups += classified.groups;

                } else if (classified.class === "n_methyl") {

                    hNMe += classified.hTotal;

                    hNMeGroups += classified.groups;

                } else if (classified.class === "sugar_me") {

                    hSugarMe += classified.hTotal;

                    hSugarMeGroups += classified.groups;

                } else if (classified.class === "tertiary_me") {

                    hTertiaryMe += classified.hTotal;

                    hTertiaryMeGroups += classified.groups;

                } else if (classified.class === "alkyl") {

                    hAlkylMethyl += classified.hTotal;

                    hAlkylGroups += classified.groups;

                }

            }

        });

        

        // F3) 13C methyl classes (context-aware) — c13PeakPpm + tip normalizasyonu

        const isCh3Type = (s) => String(s.type || "").toUpperCase() === "CH3";

        const cMethoxy = safeC13.filter(s => isCh3Type(s) && defaultInRangePpm(c13PeakPpm(s), [52, 60]) &&

            (s.assign?.includes("Methoxy") || s.category === "METHOXY")).length;

        

        const cAcetate = safeC13.filter(s => isCh3Type(s) && defaultInRangePpm(c13PeakPpm(s), [19, 23]) &&

            (s.assign?.includes("Acetate") || s.category === "ACETATE_METHYL" ||

             (k.context === "TAXANE" && defaultInRangePpm(c13PeakPpm(s), [19, 23])))).length;

        

        const cNMe = safeC13.filter(s => isCh3Type(s) && defaultInRangePpm(c13PeakPpm(s), [30, 50]) &&

            s.assign?.includes("N-Methyl")).length;

        

        const cSugarMe = safeC13.filter(s => {

            if (!isCh3Type(s) || !defaultInRangePpm(c13PeakPpm(s), [14, 22])) return false;

            if (s.assign?.includes("Acetate") || s.category === "ACETATE_METHYL") return false;

            return k.context === "GLYCOPEPTIDE" || k.context === "MACROLIDE";

        }).length;

        

        // Context-aware alkyl methyl counting

        const cAlkylMe = safeC13.filter(s => {

            if (!isCh3Type(s)) return false;

            const cppm = c13PeakPpm(s);

            if (!Number.isFinite(cppm)) return false;

            if (s.assign?.includes("Methoxy") || s.category === "METHOXY") return false;

            if (s.assign?.includes("N-Methyl")) return false;

            if (s.assign?.includes("Acetate") || s.category === "ACETATE_METHYL") return false;

            

            // Context-aware: TAXANE'de 19-23 ppm acetate; MACROLIDE 14–22 → cSugarMe (çift sayım yok)

            if (k.context === "TAXANE" && defaultInRangePpm(cppm, [19, 23])) return false;

            if (k.context === "MACROLIDE" && defaultInRangePpm(cppm, [14, 22])) return false;

            if (k.context === "MACROLIDE" && defaultInRangePpm(cppm, [19, 23]) && 

                !s.assign?.includes("Acetate") && s.category !== "ACETATE_METHYL") {

                return true;

            }

            if (defaultInRangePpm(cppm, [19, 23])) return false;

            if (k.context === "MACROLIDE") return defaultInRangePpm(cppm, [8, 28]);

            return defaultInRangePpm(cppm, [8, 18]); // Alkyl methyl range

        }).length;

        

        // F4) Synchronization metrics

        const deltaMethoxy = Math.abs(hMethoxyGroups - cMethoxy);

        const deltaAcetate = Math.abs(hAcetateGroups - cAcetate);

        const deltaNMe = Math.abs(hNMeGroups - cNMe);

        const deltaAlkyl = Math.abs(hAlkylGroups - cAlkylMe);

        

        const totalHMethylGroups = hAlkylGroups + hAcetateGroups + hMethoxyGroups + hNMeGroups + hSugarMeGroups + hTertiaryMeGroups;

        const totalCMethyl = cAlkylMe + cAcetate + cMethoxy + cNMe + cSugarMe;

        const deltaTotal = Math.abs(totalHMethylGroups - totalCMethyl);

        

        coverageReport.methyl = {

            h1: {

                methoxy: { groups: hMethoxyGroups, integral: hMethoxy },

                acetate: { groups: hAcetateGroups, integral: hAcetate },

                nMe: { groups: hNMeGroups, integral: hNMe },

                alkyl: { groups: hAlkylGroups, integral: hAlkylMethyl },

                sugarMe: { groups: hSugarMeGroups, integral: hSugarMe },

                tertiaryMe: { groups: hTertiaryMeGroups, integral: hTertiaryMe },

                total: { groups: totalHMethylGroups, integral: hMethoxy + hAcetate + hNMe + hAlkylMethyl + hSugarMe + hTertiaryMe }

            },

            c13: {

                methoxy: cMethoxy,

                acetate: cAcetate,

                nMe: cNMe,

                alkyl: cAlkylMe,

                sugarMe: cSugarMe,

                total: totalCMethyl

            },

            deltas: {

                methoxy: deltaMethoxy,

                acetate: deltaAcetate,

                (c.assign?.includes("Acetate") || c.category === "ACETATE_METHYL")).length;

            

            if (acetateCarbonyl === 0 || acetateCH3 === 0) {

                warnings.push(createIssue("WARN", "QC_MS_LOSS_IMPLAUSIBLE", `MS -AcOH label requires acetate carbonyl + CH3`,

                    { acetateCarbonyl, acetateCH3 },

                    {},

                    [{ action: "tune", target: "13C", params: { addAcetate: true }, why: "MS loss requires structural signature" }]));

                score -= 3;

            }

        }

        

        if (msLabels.includes("-Sidechain") && k.context === "TAXANE") {

            const aromaticC = safeC13.filter(c => inRange(c.ppm, [110, 165]) && c.category === "AROMATIC").length;

            if (aromaticC < 12) {

                warnings.push(createIssue("WARN", "QC_MS_LOSS_IMPLAUSIBLE", `MS -Sidechain label requires aromatic carbons (Taxane signature)`,

                    { aromaticC, expected: 12 },

                    {},

                    [{ action: "tune", target: "13C", params: { addAromatic: true }, why: "Taxane sidechain has aromatic rings" }]));

                score -= 3;

            }

        }

        

        // K) Aromatic Reconciliation (1H ↔ 13C ↔ DBE)

        // K1) Aromatic H ↔ aromatic CH

        const aromaticHIntegral = aromaticH.reduce((sum, h) => sum + intH(h), 0);

        const aromaticCH = safeC13.filter(c => c.type === "CH" && inRange(c.ppm, [110, 160]) && c.category === "AROMATIC").length;

        

        // Matching score: use estimated CH count from integral (roughly 2H per CH for aromatic)

        const estimatedAromaticCHFromIntegral = Math.ceil(aromaticHIntegral / 2);

        const aromaticMatchScore = estimatedAromaticCHFromIntegral > 0 ? Math.min(1, aromaticCH / estimatedAromaticCHFromIntegral) : 0;

        

        coverageReport.aromatic = {

            ...coverageReport.aromatic,

            hCount: aromaticH.length,

            hIntegral: aromaticHIntegral,

            estimatedCHFromIntegral: estimatedAromaticCHFromIntegral,

            cCHCount: aromaticCH,

            matchScore: aromaticMatchScore

        };

        

        if (estimatedAromaticCHFromIntegral > 0 && aromaticMatchScore < thresholds.aromaticMinMatch) {

            issues.push(createIssue("WARN", "QC_AROMATIC_RECONCILE_FAIL", `Aromatic CH count (${aromaticCH}) low vs estimated from H integral (${estimatedAromaticCHFromIntegral}, integral=${aromaticHIntegral}H)`,

                { aromaticCH, aromaticHIntegral, estimatedCH: estimatedAromaticCHFromIntegral, matchScore: aromaticMatchScore },

                {},

                [{ action: "tune", target: "13C", params: { addAromaticCH: true }, why: "Aromatic protons need attached CH carbons (~2H per CH)" }]));

            score -= 5;

            if (status === "VALIDATED") status = "CONSISTENT";

        }

        

        // K2) Aromatic DBE sanity

        if (k.groups.aromaticC > 0 && k.dbe < aromaticRingsApprox * 2) {

            warnings.push(createIssue("WARN", "QC_AROMATIC_DBE_FAIL", `Aromatic density high but DBE (${k.dbe}) suggests lower unsaturation`,

                { aromaticC: k.groups.aromaticC, dbe: k.dbe, expectedMin: aromaticRingsApprox * 2 },

                {},

                [{ action: "tune", target: "kernel", params: { recalculateDBE: true }, why: "Aromatic systems contribute significantly to DBE" }]));

            score -= 3;

        }

        

        // Additional checks

        // Vinylic H/C pair check (P0: sadece vinylic C bekleniyorsa – sp² non-aromatic alkene)
        const smVin = String(k.smiles || k.rawSmiles || "").replace(/\s/g, "");

        const alkenePairsSmiles = spectromasterCountAlkenePairsNonAromatic(smVin);

        const expectedVinylicC = alkenePairsSmiles > 0 ? alkenePairsSmiles * 2 : 0;

        if (expectedVinylicC > 0) {

            const vinylicHCount = vinylicH.length;

            const hasArForVin = /c1|C1=CC=CC=C1/i.test(smVin);

            const vinylicC = safeC13.filter(c => {

                const p = c.ppm;

                if (!inRange(p, [100, 155]) || c.category !== "VINYLIC") return false;

                if (hasArForVin && p >= 125 && p <= 145 && String(c.type || "").toUpperCase() === "Q") return false;

                return true;

            }).length;

            const expectedVC = expectedVinylicC;

            

            if (vinylicHCount > 0 && vinylicC < expectedVC * 0.5) {

                warnings.push(createIssue("WARN", "QC_VINYLIC_C_LOW", `Vinylic C count (${vinylicC}) low vs expected (${expectedVC})`,

                    { vinylicC, expected: expectedVC },

                    {},

                    [{ action: "tune", target: "13C", params: { addVinylicC: true }, why: "Vinylic protons need attached carbons" }]));

                score -= 3;

            }

            

            const alkeneRef = Math.max(k.groups.alkene || 0, alkenePairsSmiles);

            if (vinylicHCount > alkeneRef * 3) {

                warnings.push(createIssue("WARN", "QC_VINYLIC_H_EXCESSIVE", `Excessive vinylic H (${vinylicHCount}) vs alkene count (${alkeneRef})`,

                    { vinylicHCount, alkeneCount: alkeneRef },

                    {},

                    [{ action: "tune", target: "1H", params: { reduceVinylic: true }, why: "Each alkene typically has 1-2 vinylic protons" }]));

                score -= 2;

            }

        }

        

        // Aldehyde proton check

        const aldehydeH = safeH1.filter(h => inRange(h.ppm, [9.3, 10.5]) && !h.is_ex);

        if (aldehydeH.length > 0) {

            const aldehydeC = safeC13.filter(c => inRange(c.ppm, [190, 205]) && c.assign?.includes("Aldehyde")).length;

            if (aldehydeC === 0) {

                warnings.push(createIssue("WARN", "QC_ALDEHYDE_C_MISSING", `Aldehyde proton (${aldehydeH[0].ppm.toFixed(2)} ppm) but no 190-205 ppm carbon`,

                    { aldehydeH: aldehydeH.length },

                    {},

                    [{ action: "tune", target: "13C", params: { addAldehydeCarbon: true }, why: "Aldehyde proton requires CHO carbon" }]));

                score -= 3;

            }

        }

        

        // Acetate methyl count (TAXANE specific)

        if (k.context === "TAXANE" && hAcetateGroups > 0) {

            const acetateC19_23 = safeC13.filter(c => c.type === "CH3" && inRange(c.ppm, [19, 23]) &&

                (c.assign?.includes("Acetate") || c.category === "ACETATE_METHYL")).length;

            if (acetateC19_23 < hAcetateGroups) {

                warnings.push(createIssue("WARN", "QC_ACETATE_METHYL_COUNT", `TAXANE acetate methyls (H:${hAcetateGroups}) should have 19-23 ppm CH3 carbons (C:${acetateC19_23})`,

                    { hAcetateGroups, acetateC19_23 },

                    {},

                    [{ action: "tune", target: "13C", params: { addAcetateMethyl: true }, why: "Taxanes have multiple acetate groups" }]));

                score -= 3;

            }

        }

        

        // HSQC carbon reuse check

        if (safeCorr.hsqc && safeCorr.hsqc.length > 0) {

            const carbonReuse = new Map();

            safeCorr.hsqc.forEach(hsqc => {

                if (hsqc.c !== null && hsqc.c !== undefined) {

                    const cIdx = safeC13.findIndex(c => Math.abs(c.ppm - hsqc.c) < 0.5);

                    if (cIdx >= 0) {

                        carbonReuse.set(cIdx, (carbonReuse.get(cIdx) || 0) + 1);

                    }

                }

            });

            const excessiveReuse = Array.from(carbonReuse.entries()).filter(([idx, count]) => count > 2);

            const nonExceptionalReuse = excessiveReuse.filter(([idx]) => {

                const carb = safeC13[idx];

                if (!carb) return true;

                const t = String(carb.type || "").toUpperCase();

                const isCH2 = t === "CH2";

                const isAromaticCH = (t === "CH" && (carb.ppm || 0) >= 100 && (carb.ppm || 0) <= 160);

                return !isCH2 && !isAromaticCH;

            });

            if (nonExceptionalReuse.length > 0) {

                warnings.push(createIssue("WARN", "QC_HSQC_CARBON_REUSE", `${nonExceptionalReuse.length} carbons reused >2 times in HSQC (CH2/aromatic CH exception)`,

                    { excessiveReuse: nonExceptionalReuse.length },

                    {},

                    [{ action: "tune", target: "HSQC", params: { enforceBijective: true }, why: "HSQC should be bijective (except CH2/aromatic)" }]));

                score -= 2;

            }

        }

        

        // 13C carbonyl subclass check

        const ketoneC = safeC13.filter(c => c.ppm >= 195 && c.assign?.includes("Ketone")).length;

        const esterAmideC = safeC13.filter(c => inRange(c.ppm, [165, 175]) && 

            (c.assign?.includes("Ester") || c.assign?.includes("Amide"))).length;

        const acidC = safeC13.filter(c => inRange(c.ppm, [175, 182]) && c.assign?.includes("Acid")).length;

        

        if ((k.groups.ketone || 0) > 0 && ketoneC === 0) {

            warnings.push(createIssue("WARN", "QC_CARBONYL_SUBCLASS", `Ketone group detected but no ≥195 ppm carbonyl`,

                { ketoneGroups: k.groups.ketone },

                {},

                [{ action: "tune", target: "13C", params: { addKetoneCarbonyl: true }, why: "Ketones appear at ≥195 ppm" }]));

            score -= 2;

        }

        

        // 2D density sanity

        const total2DPairs = (safeCorr.hsqc?.length || 0) + (safeCorr.cosy?.length || 0) + (safeCorr.hmbc?.length || 0) + (safeCorr.noesy?.length || 0);

        const expected2D = nonExchH.length * 2; // Rough estimate

        if (total2DPairs > expected2D * 3) {

            info.push(createIssue("INFO", "QC_2D_DENSITY_HIGH", `2D correlation density (${total2DPairs} pairs) very high - may indicate over-simulation`,

                { total2DPairs, expected: expected2D },

                {},

                [{ action: "tune", target: "2D", params: { reduceDensity: true }, why: "Very dense 2D may be unrealistic" }]));

        }

        

        // Context cross-override check

        if (k.context === "MACROLIDE" && (k.groups.O || 0) < 5) {

            warnings.push(createIssue("WARN", "QC_CONTEXT_CROSS_OVERRIDE", `MACROLIDE context but low O count (${k.groups.O}) - context may be misclassified`,

                { context: k.context, oCount: k.groups.O },

                {},

                [{ action: "tune", target: "kernel", params: { verifyContext: true }, why: "Macrolides typically have high O count" }]));

            score -= 2;

        }

        

        if (k.context === "TAXANE" && (k.groups.aromaticC || 0) < 10) {

            warnings.push(createIssue("WARN", "QC_CONTEXT_CROSS_OVERRIDE", `TAXANE context but low aromatic C count (${k.groups.aromaticC}) - context may be misclassified`,

                { context: k.context, aromaticC: k.groups.aromaticC },

                {},

                [{ action: "tune", target: "kernel", params: { verifyContext: true }, why: "Taxanes have multiple aromatic rings" }]));

            score -= 2;

        }

        

        // O/C ratio check

        const oCRatio = cCount > 0 ? (k.groups.O || 0) / cCount : 0;

        if (k.context === "GLYCOPEPTIDE" && oCRatio < 0.15) {

            warnings.push(createIssue("WARN", "QC_O_C_RATIO", `GLYCOPEPTIDE O/C ratio (${oCRatio.toFixed(2)}) below expected (~0.2-0.4)`,

                { oCRatio, context: k.context },

                {},

                [{ action: "tune", target: "kernel", params: { verifyOxygen: true }, why: "Glycopeptides have high O content" }]));

            score -= 2;

        }

        

        if (k.context === "MACROLIDE" && oCRatio < 0.10) {

            warnings.push(createIssue("WARN", "QC_O_C_RATIO", `MACROLIDE O/C ratio (${oCRatio.toFixed(2)}) below expected (~0.15-0.25)`,

                { oCRatio, context: k.context },

                {},

                [{ action: "tune", target: "kernel", params: { verifyOxygen: true }, why: "Macrolides have moderate O content" }]));

            score -= 2;

        }



        // Complete coverage report

        coverageReport.atom = {

            counts: { ...atomCounts },

            parity: parity === 0,

            hRatio,

            oCRatio: cCount > 0 ? (k.groups.O || 0) / cCount : 0,

            nCRatio: cCount > 0 ? (k.counts.N || 0) / cCount : 0

        };

        

        coverageReport.functional = {

            methoxy: { expected: k.groups.methoxy || 0, observed: cMethoxy },

            ester: { expected: k.groups.ester || 0, observed: coverageReport.carbonyl.breakdown.ester },

            amide: { expected: (k.groups?.amide || 0), observed: coverageReport.carbonyl.breakdown.amide },

            ketone: { expected: k.groups.ketone || 0, observed: coverageReport.carbonyl.breakdown.ketone },

            aromatic: { expected: k.groups.aromaticC || 0, observed: safeC13.filter(c => inRange(c.ppm, [110, 165]) && c.category === "AROMATIC").length }

        };

        

        // 7.6 Scoring (Coverage & Confidence)

        // 7.6.1 Module weights

        const weights = {

            atom: 0.11,

            dbe: 0.10,

            h1: 0.16,

            c13: 0.08,

            methyl: 0.15,

            hsqc: 0.14,

            cosyHmbcNoesy: 0.10,

            ms: 0.12,

            ir: 0.04

        };

        

        // Penalty logic (already applied above, but ensure consistency)

        const errorCount = issues.filter(i => i.level === "ERROR").length;

        const warnCount = issues.filter(i => i.level === "WARN").length + warnings.filter(w => w.level === "WARN").length;

        const infoCount = info.length;

        

        // Score is already adjusted above, but ensure it's consistent

        const baseScore = 100 - (errorCount * 8) - (warnCount * 3) - (infoCount * 1);

        score = Math.max(0, Math.min(100, baseScore));

        

        // Add atom coverage to coverage report

        coverageReport.atom.coverageH = k.counts.H > 0 ? (hSum / k.counts.H) * 100 : 0;

        coverageReport.atom.coverageC = k.counts.C > 0 ? (cCount / k.counts.C) * 100 : 0;

        

        // Calculate module scores

        const atomScore = (coverageReport.h1.ratio >= thresholds.hIntegralRatioMin && coverageReport.h1.ratio <= thresholds.hIntegralRatioMax ? 1 : 0.5) *

                                                 (coverageReport.c13.ratio >= cMinEff && coverageReport.c13.ratio <= thresholds.cCountMaxFrac ? 1 : 0.5) *

                         (coverageReport.atom.parity ? 1 : 0.8);

        

        const dbeScore = coverageReport.dbe.diff < 5 ? 1 : (coverageReport.dbe.diff < 10 ? 0.7 : 0.3);

        

        const h1Score = (coverageReport.h1.ratio >= thresholds.hIntegralRatioMin && coverageReport.h1.ratio <= thresholds.hIntegralRatioMax ? 1 : 0.6) *

                       (coverageReport.h1.exchFraction <= thresholds.hExchMaxFrac ? 1 : 0.8);

        

        let c13Score = (coverageReport.c13.ratio >= cMinEff && coverageReport.c13.ratio <= thresholds.cCountMaxFrac ? 1 : 0.6) *

                        (coverageReport.c13.overlapBins === 0 ? 1 : 0.9);

        const c13SoftFloor = Math.max(0.28, cMinEff * 0.82);

        if (coverageReport.c13.ratio < cMinEff && coverageReport.c13.ratio >= c13SoftFloor) {

            c13Score = Math.max(c13Score, 0.74);

        }

        if (cCount >= 12 && coverageReport.c13.ratio >= 0.22) {

            c13Score = Math.max(c13Score, 0.48);

        }

        

        const methylScore = coverageReport.methyl.reconciliation || 0;

        

        const hsqcScore = coverageReport.hsqc.plausibility || 0;

        

        const cosyHmbcNoesyScore = (cosySingletEdges === 0 ? 1 : 0.8) * (hmbcCarbonylCoverage > 0.3 ? 1 : 0.7) * (noesyPairs === 0 || coverageReport.noesy.contextValid ? 1 : 0.5);

        

        const msScore = coverageReport.ms && coverageReport.ms.valid !== false ? (coverageReport.ms.ppmError < 10 ? 1 : 0.7) : (safeMS.length > 0 ? 0.5 : 0.3);

        

        const irScore = safeIR.length > 0 ? 1 : 0.5; // IR optional

        

        // Overall confidence

        confidence = 

            atomScore * weights.atom +

            dbeScore * weights.dbe +

            h1Score * weights.h1 +

            c13Score * weights.c13 +

            methylScore * weights.methyl +

            hsqcScore * weights.hsqc +

            cosyHmbcNoesyScore * weights.cosyHmbcNoesy +

            msScore * weights.ms +

            irScore * weights.ir;

        

        coverageReport.overallConfidence = confidence;

        

        // Ensure score is in valid range

        score = Math.max(0, Math.min(100, score));

        

        // 7.7 Status mapping
        const fallbackOnly2D = (safeCorr.hsqc.length + safeCorr.cosy.length + safeCorr.hmbc.length + safeCorr.noesy.length) === 0 && fallbackCount > 0;
        const hsqcZeroWithExpected = (coverageReport.hsqc?.scoreEligibleHsqcCount || 0) === 0 && C_prot_audit > 0;

        if (score >= 92 && issues.filter(i => i.level === "ERROR").length === 0 && confidence > 0.85) {

            status = "ULTRA-VALIDATED";

        } else if (score >= 85 && issues.filter(i => i.level === "ERROR").length === 0) {

            status = "STRONG-VALIDATED";

        } else if (score >= 72 && issues.filter(i => i.level === "ERROR").length === 0) {

            status = "VALIDATED";

        } else if (score >= 55) {

            status = "WEAK";

        } else {

            status = "FAILED";

        }
        if (fallbackOnly2D && (status === "ULTRA-VALIDATED" || status === "STRONG-VALIDATED" || status === "VALIDATED")) status = "PARTIAL";
        if (hsqcZeroWithExpected && (status === "ULTRA-VALIDATED" || status === "STRONG-VALIDATED")) status = "PARTIAL";

        

        // 7.8 "COVERAGE & CONFIDENCE REPORT" Text Generation

        const topIssues = [...issues, ...warnings].slice(0, 5).map(i => `  • ${i.code}: ${i.message}`);

        const recommendedFixes = [...issues, ...warnings]

            .filter(i => i.fix && i.fix.length > 0)

            .slice(0, 3)

            .flatMap(i => i.fix)

            .map(f => `  - ${f.action} ${f.target}: ${f.why}`);

        

        // Clamp coverage metrics to 0-100

        const clampCoverage = (val) => Math.max(0, Math.min(100, val));

        const hmbcCoverageClamped = clampCoverage(hmbcCarbonylCoverage * 100);

        

        // Aromatic H: use signal count for display, integral for matching

        const aromaticHSignalCount = aromaticH.length;

        const aromaticHTotalIntegral = aromaticHIntegral;

        

        const coverageNote = `

COVERAGE & CONFIDENCE REPORT — ${status} (Score: ${score.toFixed(0)}/100, Conf: ${(confidence*100).toFixed(1)}%)



Formula: ${k.counts.formula || "-"} | Context: ${k.context || "GENERAL"} | DBE: ${k.dbe || 0}



¹H: ΣH(non-exch)=${hSum} vs pool=${coverageReport.h1.expectedIntegral} (ratio=${hRatio.toFixed(2)}, exch_eff=${coverageReport.h1.exchEffH != null ? coverageReport.h1.exchEffH : "-"})

¹³C: ${cCount}/${k.counts.C} observed (overlap bins: ${overflowBins.length})

Methyl sync: H_CH3=${totalHMethylGroups} groups, C_CH3=${totalCMethyl}, HSQC_CH3_cov=${coverageReport.hsqc.plausibility ? clampCoverage(coverageReport.hsqc.plausibility*100).toFixed(1) : "0.0"}%

Carbonyl: expected=${expectedCarbonyls}, observed(13C>160)=${carbonylCount}, HMBC_cov=${hmbcCoverageClamped.toFixed(1)}%

Aromatic: signal_count=${aromaticHSignalCount}, total_integral=${aromaticHTotalIntegral}H, C_arCH=${aromaticCH}, HSQC_ar_match=${clampCoverage(aromaticMatchRatio*100).toFixed(1)}%

MS: mass ppm err=${coverageReport.ms && coverageReport.ms.ppmError !== undefined ? coverageReport.ms.ppmError.toFixed(2) : "0.00"}, losses ok=${msLabels.includes("-AcOH") ? "✓" : "-"}

IR: ester band=${safeIR.some(b => Number(b.freq) >= 1730 && Number(b.freq) <= 1750) ? "present" : (((k.groups?.ester || 0) > 0) ? "unresolved" : "not_asserted")}, amide band=${safeIR.some(b => Number(b.freq) >= 1650 && Number(b.freq) <= 1680) ? "present" : (((k.groups?.amide || 0) > 0) ? "unresolved" : "not_asserted")}



${topIssues.length > 0 ? "Critical Issues:\n" + topIssues.join("\n") : "No critical issues"}

${recommendedFixes.length > 0 ? "\nRecommended fixes:\n" + recommendedFixes.join("\n") : ""}

        `.trim();

        

        // Final return

        return {

            status,

            score: Math.round(score),

            confidence,

            issues: issues.map(i => typeof i === 'string' ? i : (i.message || i)),

            warnings: warnings.map(w => typeof w === 'string' ? w : (w.message || w)),

            info: info.map(i => typeof i === 'string' ? i : (i.message || i)),

            coverageReport,

            note: coverageNote,

            suggestions: suggestions.length > 0 ? suggestions : recommendedFixes.map(f => {

                const parts = f.split(":");

                return { action: parts[0]?.trim() || "", target: parts[1]?.split(":")[0]?.trim() || "", why: parts.slice(1).join(":").trim() || "" };

            }).filter(s => s.action),

            evidence: {

                atomCounts: { ...atomCounts },

                dbeBreakdown: coverageReport.dbe,

                h1Stats: coverageReport.h1,

                c13Stats: coverageReport.c13,

                methylStats: coverageReport.methyl,

                aromaticStats: coverageReport.aromatic,

                carbonylStats: coverageReport.carbonyl,

                functionalStats: coverageReport.functional

            },

            // Detaylı audit modülleri

            detailedAudits: {

                methylClass: methylClassAudit(k, h1, c13, safeCorr.hsqc),

                sugarRegion: sugarRegionAssignment(h1, c13, safeCorr.hsqc, safeCorr.cosy, safeCorr.hmbc, k)

            }

        };

    };



    /** Hill formül dizgisinden element sayımları (bilinen molekül önek doğrulaması için). */

    function hillStringToCounts(hill) {

        const counts = Object.create(null);

        if (!hill || typeof hill !== "string") return counts;

        const re = /([A-Z][a-z]?)(\d*)/g;

        let m;

        while ((m = re.exec(hill)) !== null) {

            const el = m[1];

            const n = m[2] ? parseInt(m[2], 10) : 1;

            counts[el] = (counts[el] || 0) + n;

        }

        return counts;

    }



    /** Çok satırlı giriş: her satır ayrı molekül (ERR-001 düzeltmesi — M3+M4 birleşmesini önler; yorum satırları atlanır). */

    function parseMultilineSmilesInput(rawLines) {

        return rawLines

            .map(l => String(l || "").trim().replace(/\s+/g, ""))

            .filter(line => {

                if (!line.length) return false;

                if (line.startsWith("#") || line.startsWith("//")) return false;

                return true;

            });

    }



    /** Tam SMILES önek eşleşmesinde literatür formülü (Paclitaxel, FK-506, Vankomisin vb.) — parser sapmasını telafi eder. */

    const SPECTROMASTER_KNOWN_FORMULA_PREFIXES = [
        { prefix: "C[C@]12CC[C@@H](C([C@@H]1CC[C@@]3(", formulaHill: "C30H48O3" },

        { prefix: "CC1=C2C(C(=O)C3", formulaHill: "C47H51NO14" },

        { prefix: "CCC1C(C(C(C(=O)C(CC", formulaHill: "C37H67NO13" },

        { prefix: "CC1CCC2CCCC3(C2C1OC(=O)C4CCCCN4C(=O)C(=O)C5(O5)", formulaHill: "C44H69NO12" },

        { prefix: "CC1CCC2CCCC%10(C2(C1)OC(=O)C3CCCCN3C(=O)C(=O)C4(O4)", formulaHill: "C44H69NO12" },

        { prefix: "[C@@H]1(CC[C@H]([C@@]2(O)O[C@@](CC[C@@H]2O)(C)", formulaHill: "C44H69NO12" },

        { prefix: "CC1C(C(CC(O1)OC2", formulaHill: "C66H75Cl2N9O24" }

    ];



    // ==========================================

    // SMILES halka indeksi ön kontrolü (ERR-001: üçlü kullanım / kapanmamış halka)

    // ==========================================

    function validateSmilesRingClosures(smiles) {

        const s = String(smiles || "").replace(/\s+/g, "");

        if (!s) return { ok: true, errors: [] };

        const counts = Object.create(null);

        let i = 0;

        let bracket = 0;

        while (i < s.length) {

            const ch = s[i];

            if (ch === "[") { bracket++; i++; continue; }

            if (ch === "]") { bracket = Math.max(0, bracket - 1); i++; continue; }

            if (bracket > 0) { i++; continue; }

            if (ch === "%" && i + 2 < s.length && /^\d{2}$/.test(s.slice(i + 1, i + 3))) {

                const key = s.slice(i, i + 3);

                counts[key] = (counts[key] || 0) + 1;

                i += 3;

                continue;

            }

            if (ch >= "1" && ch <= "9") {

                counts[ch] = (counts[ch] || 0) + 1;

                i++;

                continue;

            }

            i++;

        }

        const errors = [];

        Object.keys(counts).forEach((k) => {

    function tryRepairMacrolideRingSmiles(raw) {

        const s = String(raw || "").trim().replace(/\s+/g, "");

        if (!s) return { smiles: raw, repaired: false, reason: null };

    // SMILES → MOLEKÜLER FORMÜL (Deterministik, SpectroMaster Doğrulama Katmanı)

    // ==========================================

    function formulaFromSmiles(smiles) {

        const atoms = [];

        let netCharge = 0;

        const addAtom = (element, aromatic, explicitH = 0, charge = 0) => {

            const id = atoms.length;

            atoms.push({ id, element, aromatic, explicitH, charge, bonds: [] });

            netCharge += charge;

            return id;

        };

        const addBond = (a, b, order) => {

            atoms[a].bonds.push({ to: b, order });

            atoms[b].bonds.push({ to: a, order });

        };

        const stack = [];

        const ringOpen = new Map();

        let currentAtom = null;

        let pendingBond = null;

        const s = String(smiles || "").trim().replace(/\s+/g, "");

        if (!s) return { counts: {}, formulaHill: "", charge: 0, error: "Empty SMILES" };

        for (let ki = 0; ki < SPECTROMASTER_KNOWN_FORMULA_PREFIXES.length; ki++) {

            const row = SPECTROMASTER_KNOWN_FORMULA_PREFIXES[ki];

            if (s.startsWith(row.prefix)) {

                const oc = hillStringToCounts(row.formulaHill);

                return { counts: oc, formulaHill: row.formulaHill, charge: 0, verifiedBy: "prefix_library" };

            }

        }

        const isDigit = ch => ch >= "0" && ch <= "9";

        const bondOrderFromChar = ch => ({ "-": 1, "=": 2, "#": 3, ":": 1.5 }[ch] || 1);

        const readElement = (i) => {

            const ch = s[i];

            if ("bcnops".includes(ch)) return { element: ch, aromatic: true, next: i + 1 };

            if (ch === "C") return s[i + 1] === "l" ? { element: "Cl", aromatic: false, next: i + 2 } : { element: "C", aromatic: false, next: i + 1 };

            if (ch === "B") return s[i + 1] === "r" ? { element: "Br", aromatic: false, next: i + 2 } : { element: "B", aromatic: false, next: i + 1 };

            if (ch === "S" && i + 1 < s.length && s[i + 1] === "i") return { element: "Si", aromatic: false, next: i + 2 };

            if (ch === "S" && i + 1 < s.length && s[i + 1] === "e") return { element: "Se", aromatic: false, next: i + 2 };

            if ("NOPFIS".includes(ch)) return { element: ch, aromatic: false, next: i + 1 };

            if (ch === "K") return { element: "K", aromatic: false, next: i + 1 };

            return null;

        };

        const readRingNumber = (i) => {

            if (s[i] === "%") {

                const d1 = s[i + 1], d2 = s[i + 2];

                if (!isDigit(d1) || !isDigit(d2)) return null;

                return { key: "%" + d1 + d2, next: i + 3 };

            }

            if (!isDigit(s[i])) return null;

            return { key: s[i], next: i + 1 };

        };

        const readBracketAtom = (i) => {

            let j = i + 1;

            if (j >= s.length) return null;

            while (j < s.length && isDigit(s[j])) j++;

            if (j >= s.length) return null;

            let aromatic = false;

            let element = "";

            const ch = s[j];

            if (ch === "*") return null;

            if (ch >= "a" && ch <= "z") {

                aromatic = true;

                element = ch;

                j++;

                if (j < s.length && s[j] >= "a" && s[j] <= "z" && (element + s[j] === "se" || element + s[j] === "as")) { element += s[j]; j++; }

            } else if (ch >= "A" && ch <= "Z") {

                element = ch;

                j++;

                if (j < s.length && s[j] >= "a" && s[j] <= "z") { element += s[j]; j++; }

            } else return null;

            let explicitH = 0;

            let charge = 0;

            while (j < s.length && s[j] !== "]") {

                const c = s[j];

                if (c === "@") { j++; if (s[j] === "@") j++; continue; }

                if (c === "H") {

                    j++;

                    let num = "";

                    while (j < s.length && isDigit(s[j])) { num += s[j]; j++; }

                    explicitH += num ? parseInt(num, 10) : 1;

                    continue;

                }

                if (c === "+" || c === "-") {

                    const sign = c === "+" ? 1 : -1;

                    j++;

                    let rep = 0;

                    while (j < s.length && s[j] === c) { rep++; j++; }

                    if (rep > 0) { charge += sign * (rep + 1); continue; }

                    let num = "";

                    while (j < s.length && isDigit(s[j])) { num += s[j]; j++; }

                    charge += sign * (num ? parseInt(num, 10) : 1);

                    continue;

                }

                if (c === ":") { j++; while (j < s.length && isDigit(s[j])) j++; continue; }

                j++;

            }

            if (j >= s.length || s[j] !== "]") return null;

            element = element.length === 1 ? element.toUpperCase() : (element[0].toUpperCase() + (element[1] || "").toLowerCase());

            if (element === "CL") element = "Cl";

            if (element === "BR") element = "Br";

            return { element, aromatic, explicitH, charge, next: j + 1 };

        };

        let i = 0;

        try {

            while (i < s.length) {

                const ch = s[i];

                if (ch === "(") {

                    if (currentAtom === null) return { counts: {}, formulaHill: "", charge: 0, error: "Unmatched (" };

                    stack.push(currentAtom);

                    i++;

                    continue;

                }

                if (ch === ")") {

                    if (stack.length === 0) return { counts: {}, formulaHill: "", charge: 0, error: "Unmatched )" };

                    currentAtom = stack.pop();

                    i++;

                    continue;

                }

                if ("-=#:".includes(ch)) {

                    pendingBond = bondOrderFromChar(ch);

                    i++;

                    continue;

                }

                if (ch === "/" || ch === "\\") {
                    // E/Z geometric notation — treated as single bond for formula purposes
                    pendingBond = 1;
                    i++;
                    continue;
                }

                if (ch === "@") {
                    i++;
                    if (i < s.length && s[i] === "@") i++;
                    continue;
                }

                if (isDigit(ch) || ch === "%") {

                    if (currentAtom === null) return { counts: {}, formulaHill: "", charge: 0, error: "Ring digit without atom" };

                    const rn = readRingNumber(i);

                    if (!rn) return { counts: {}, formulaHill: "", charge: 0, error: "Invalid ring number" };

                    const entry = ringOpen.get(rn.key);

                    if (!entry) ringOpen.set(rn.key, { atomId: currentAtom, order: pendingBond });

                    else {

                        const order = pendingBond ?? entry.order ?? 1;

                        addBond(entry.atomId, currentAtom, order);

                        ringOpen.delete(rn.key);

                    }

                    pendingBond = null;

                    i = rn.next;

                    continue;

                }

                if (ch === "[") {

                    const info = readBracketAtom(i);

                    if (!info) return { counts: {}, formulaHill: "", charge: 0, error: "Invalid bracket atom" };

                    const aId = addAtom(info.element, info.aromatic, info.explicitH, info.charge);

                    if (currentAtom !== null) addBond(currentAtom, aId, pendingBond ?? 1);

                    currentAtom = aId;

                    pendingBond = null;

                    i = info.next;

                    continue;

                }

                if (ch === ".") {

                    currentAtom = null;

                    pendingBond = null;

                    i++;

                    continue;

                }

                if ((ch >= "A" && ch <= "Z") || "bcnops".includes(ch)) {

                    const info = readElement(i);

                    if (!info) return { counts: {}, formulaHill: "", charge: 0, error: "Unknown atom at " + i };

                    const elNorm = info.element.length === 1 ? info.element.toUpperCase() : (info.element[0].toUpperCase() + (info.element[1] || "").toLowerCase());

                    const aId = addAtom(elNorm, info.aromatic, 0, 0);

                    if (currentAtom !== null) addBond(currentAtom, aId, pendingBond ?? 1);

                    currentAtom = aId;

                    pendingBond = null;

                    i = info.next;

                    continue;

                }

                return { counts: {}, formulaHill: "", charge: 0, error: "Unexpected char at " + i };

            }

            if (stack.length !== 0) return { counts: {}, formulaHill: "", charge: 0, error: "Unclosed branch" };

            if (ringOpen.size !== 0) return { counts: {}, formulaHill: "", charge: 0, error: "Unclosed ring" };

        } catch (e) {

            return { counts: {}, formulaHill: "", charge: 0, error: String(e.message) };

        }

        const counts = {};

        const inc = (el, n) => { counts[el] = (counts[el] || 0) + n; };

        const isNitroN = (atom) => {

            if (atom.element !== "N") return false;

            const oNeighbors = atom.bonds.filter(b => atoms[b.to].element === "O");

            if (oNeighbors.length < 2) return false;

            const hasDoubleO = oNeighbors.some(b => b.order >= 2);

            return hasDoubleO || atom.charge === 1;

        };

        const getDoubleOCount = (atom) => atom.bonds.filter(b => atoms[b.to].element === "O" && b.order >= 2).length;

        const getDegree = (atom) => atom.bonds.length;

        const getUsedValence = (atom) => atom.bonds.reduce((sum, b) => sum + b.order, 0);

        for (const atom of atoms) {

            inc(atom.element, 1);

            if (atom.explicitH > 0) inc("H", atom.explicitH);

            let used = getUsedValence(atom);

            let implicitH = 0;

            if (atom.aromatic) {

                const deg = getDegree(atom);

                if (atom.element === "C") {

                    if (deg === 2) implicitH = 1;

                    else if (deg === 3) implicitH = 0;

                } else if (atom.element === "N") {

                    implicitH = 0;

                } else if (atom.element === "O" || atom.element === "S") {

                    implicitH = 0;

                }

            } else {

                if (isNitroN(atom)) { implicitH = 0; }

                else if (atom.element === "S") {

                    const dblO = getDoubleOCount(atom);

                    const effVal = dblO === 2 ? 6 : dblO === 1 ? 4 : 2;

                    implicitH = Math.max(0, Math.floor(effVal - used));

                } else if (atom.element === "P") {

                    const dblO = getDoubleOCount(atom);

                    const effVal = dblO >= 1 ? 5 : 3;

                    implicitH = Math.max(0, Math.floor(effVal - used));

                } else {

                    const valenceTable = { H: 1, C: 4, N: 3, O: 2, F: 1, Cl: 1, Br: 1, I: 1, B: 3, P: 3, S: 2, Si: 4, Se: 2 };

                    let maxVal = valenceTable[atom.element];

                    if (atom.element === "N" && used > 3) maxVal = 5;

                    if (maxVal === undefined) continue;

                    implicitH = Math.max(0, Math.floor(maxVal - used));

                }

            }

            if (implicitH > 0) inc("H", implicitH);

        }

        const formulaHill = (() => {

            const keys = Object.keys(counts).filter(k => counts[k] && counts[k] !== 0);

            const hasC = keys.includes("C");

            const order = hasC ? ["C", "H"].concat(keys.filter(k => k !== "C" && k !== "H").sort()) : keys.sort();

            let out = "";

            for (const el of order) {

                const n = counts[el];

                if (!n) continue;

                out += el + (n === 1 ? "" : String(n));

            }

            return out;

        })();

        return { counts, formulaHill, charge: netCharge };

    }

        const list = moleculeList || [];
        matrix.categories.forEach(cat => {
            const inCat = list.filter(m => (m.category_ids && m.category_ids.includes(cat.id)) || (m.kernel && cat.id === "aromatic" && (m.kernel.groups?.aromaticC || 0) > 0) || (m.kernel && cat.id === "carbonyl" && ((m.kernel.groups?.ester || 0) + (m.kernel.groups?.amide || 0) + (m.kernel.groups?.ketone || 0) + (m.kernel.groups?.acid || 0)) > 0) || (m.kernel && cat.id === "nitrile" && /#N|C#N/.test(m.kernel.smiles || "")) || (m.kernel && cat.id === "halogen" && ((m.kernel.counts?.Cl || 0) + (m.kernel.counts?.Br || 0) + (m.kernel.counts?.F || 0)) > 0) || (m.kernel && cat.id === "exchangeable" && (m.kernel.h_exch || 0) > 0));
            cat.current_count = inCat.length;
            if (!cat.molecules) cat.molecules = [];
        });
        matrix.missing_categories = (matrix.categories || []).filter(c => (c.current_count || 0) < (c.target_count || 0)).map(c => c.id);

        if (exact) return { ...exact, isSymmetric: true, symmetry_factor: 6 };
        const aromaticRing = /c1[c,n][c,n][c,n][c,n][c,n]1|n1[c,n][c,n][c,n][c,n]1/.test(s);
        const cycloLike = /C1C+1|C1CCCCC1|C1CCCC1/.test(s);
        if (aromaticRing || cycloLike) return { expected_unique_carbons: Math.max(1, Math.ceil((s.match(/c|C/g) || []).length / 6)), expected_unique_h1: 1, isSymmetric: true, symmetry_factor: 6, label: aromaticRing ? "aromatic_ring" : "cyclo" };
        return { expected_unique_carbons: null, expected_unique_h1: null, isSymmetric: false, symmetry_factor: 1, label: "unknown" };
    }

    /** ANALYTE_SOLVENT_PAIRS: analit = çözücü iken solvent filtresi uygulanmaz (aseton analiti + acetone-d6). */
    const ANALYTE_SOLVENT_PAIRS = [
        { analyte: /^CC\(=O\)C$|^C\(C\)\(=O\)C$/i, solventKey: "acetone-d6" },
        { analyte: /^ClC\(Cl\)Cl$|^C\(Cl\)\(Cl\)Cl$/i, solventKey: "CDCl3" },
        { analyte: /^C\[S\]\(=O\)C$|^CS\(=O\)C$/i, solventKey: "DMSO-d6" },
        { analyte: /^CO$/i, solventKey: "MeOD" }
    ];
    /** Solvent piklerini filtrele. mode:"mark"=sadece etiketle (varsayılan); "remove"=sil. analyteSmiles verilirse analit=çözücü çakışmasında bypass. */
    function filterSolventPeaks(h1, c13, solventKey, opts) {
        const o = opts || {};
        const analyteSmiles = (o.analyteSmiles || "").replace(/\s+/g, "");
        const mode = o.mode === "remove" ? "remove" : "mark";
        const bypass = analyteSmiles && ANALYTE_SOLVENT_PAIRS.some(p => p.solventKey === solventKey && p.analyte.test(analyteSmiles));
        if (bypass) return { h1: h1 || [], c13: c13 || [], h1_raw: h1 || [], c13_raw: c13 || [], solventBypass: true };
        const db = (typeof SOLVENT_DB !== "undefined" ? SOLVENT_DB : {});
        const sel = db[solventKey] || db["CDCl3"] || {};
        const ignore1h = (sel.ignore_1h_range || []).slice();
        const ignore13c = (sel.ignore_13c_range || []).slice();
        const h1Tagged = (h1 || []).map(p => { const ppm = Number(p.ppm); const isSolvent = ignore1h.some(([a, b]) => ppm >= a && ppm <= b); return { ...p, _solvent: isSolvent }; });
        const c13Tagged = (c13 || []).map(p => { const ppm = Number(p.ppm); const isSolvent = ignore13c.some(([a, b]) => ppm >= a && ppm <= b); return { ...p, _solvent: isSolvent }; });
        const h1Out = mode === "remove" ? h1Tagged.filter(p => !p._solvent) : h1Tagged;
        const c13Out = mode === "remove" ? c13Tagged.filter(p => !p._solvent) : c13Tagged;
        return { h1: h1Out, c13: c13Out, h1_raw: h1Tagged, c13_raw: c13Tagged };
    }

    const NOISE_THRESHOLDS = { "1H": 0.02, "H1": 0.02, "13C": 0.01, "C13": 0.01, "HSQC": 0.002, "HMBC": 0.002, "COSY": 0.002, "NOESY": 0.002 };
    /** Veri Temizleme (Sanitization Core): Tip bazlı gürültü eşiği ve solvent/impurity piklerini analizden düşer. */
    function sanitizeSpectrum(rawPeaks, type, solventName) {
        const peaks = Array.isArray(rawPeaks) ? rawPeaks : [];
        if (!peaks.length) return [];
        const maxIntensity = Math.max(...peaks.map(p => Number(p.intensity) || 100), 1);
        const typeKey = String(type || "").toUpperCase().replace(/[^A-Z0-9]/g, "") || "1H";
        const frac = NOISE_THRESHOLDS[typeKey] ?? 0.02;
        const noiseThreshold = maxIntensity * frac;
        const is1H = String(type || "").toUpperCase() === "1H" || String(type || "").toUpperCase() === "H1";
        const db = (typeof SOLVENT_DB !== "undefined" ? SOLVENT_DB : {});
        const keyMap = { "CDCl3": "CDCl3", "Chloroform": "CDCl3", "DMSO": "DMSO-d6", "DMSO-d6": "DMSO-d6", "Water": "D2O", "Acetone": "acetone-d6" };
        const solventKey = keyMap[solventName] || "CDCl3";
        const solventData = db[solventKey] || db["CDCl3"] || {};
        const hResidual = solventData.residual_proton_ppm != null ? solventData.residual_proton_ppm : 7.26;
        const waterH = solventData.water_peak_ppm;
        const tol = 0.05;
        const impurities = (typeof COMMON_IMPURITIES !== "undefined" ? COMMON_IMPURITIES : []);

        return peaks.filter(peak => {
            if ((Number(peak.intensity) || 100) < noiseThreshold) return false;
            const ppm = Number(peak.ppm);
            if (!Number.isFinite(ppm)) return true;
            if (is1H) {
                if (Math.abs(ppm - hResidual) < (solventData.tolerance != null ? solventData.tolerance : tol)) return false;
                if (waterH != null && Math.abs(ppm - waterH) < (tol * 2)) return false;
                const impurityMatch = impurities.some(imp => imp.h && imp.h.some(ip => Math.abs(ppm - ip) < 0.05));
                if (impurityMatch) return false;
            } else {
                const cResidual = solventData.carbon_ppm;
                if (cResidual != null && Math.abs(ppm - cResidual) < (tol * 2)) return false;
                const impurityMatch = impurities.some(imp => imp.c && imp.c.length && imp.c.some(ip => Math.abs(ppm - ip) < 0.5));
                if (impurityMatch) return false;
            }
            return true;
        });
    }

    /** İntegral normalizasyonu: en küçük integrali 1H/2H/3H varsayıp en iyi katsayıyı seçer; değişebilir protonları toplamdan düşer.
     * İmza 1: normalizeIntegrals(peaks, molecule) -> array. İmza 2: normalizeIntegrals(h1Signals, expectedTotalH, exchangeableCount) -> { normalizedSignals, fitQuality, isConsistent }. */
    function normalizeIntegrals(peaksOrSignals, moleculeOrExpectedH, exchangeableCount) {
        const cfg = typeof VERIFICATION_CONFIG !== "undefined" ? VERIFICATION_CONFIG : {};
        const decimals = cfg.integral_locale_decimal || [".", ","];
        const parseInteg = (integ) => {
            if (integ == null) return null;
            const s = String(integ).trim().replace(new RegExp("[" + decimals.map(d => d === "." ? "\\." : d).join("") + "]", "g"), ".");
            const m = s.match(/^(\d+(\.\d+)?)(\s*H)?$/i); return m ? Number(m[1]) : null;
        };
        const usePlanSignature = typeof moleculeOrExpectedH === "number" && typeof exchangeableCount === "number";
        const list = Array.isArray(peaksOrSignals) ? peaksOrSignals : [];
        const exchangeableH = usePlanSignature ? exchangeableCount : (Number(moleculeOrExpectedH?.exchangeableCount ?? moleculeOrExpectedH?.h_exch ?? moleculeOrExpectedH?.exchH ?? 0) || 0);
        const targetTotal = usePlanSignature ? Math.max(0, moleculeOrExpectedH - exchangeableCount) : Math.max(0, (Number(moleculeOrExpectedH?.totalH ?? moleculeOrExpectedH?.counts?.H ?? 0) || 0) - exchangeableH);
        const tolRatio = cfg.exchangeable_integral_tolerance_ratio != null ? cfg.exchangeable_integral_tolerance_ratio : 0.25;

        if (!list.length) return usePlanSignature ? { normalizedSignals: [], fitQuality: 0, isConsistent: false } : list.map(p => ({ ...p, normalizedIntegral: null, roundedIntegral: null }));

        const withInteg = list.map(p => ({ ...p, _integ: parseInteg(p.integ) })).filter(p => p._integ != null && p._integ > 0);
        if (!withInteg.length) return usePlanSignature ? { normalizedSignals: list.map(p => ({ ...p })), fitQuality: 0, isConsistent: false } : list.map(p => ({ ...p, normalizedIntegral: null, roundedIntegral: null }));

        const referencePeak = withInteg.reduce((prev, curr) => (curr._integ < prev._integ ? curr : prev));
        let bestFactor = 1;
        let minError = Infinity;

        [1, 2, 3].forEach(assumedH => {
            const factor = assumedH / referencePeak._integ;
            let currentTotal = 0;
            let error = 0;
            withInteg.forEach(p => {
                const normalized = p._integ * factor;
                currentTotal += normalized;
                error += Math.abs(normalized - Math.round(normalized));
            });
            const totalDev = targetTotal > 0 ? Math.abs(currentTotal - targetTotal) : 0;
            const score = error + (totalDev * 2);
            if (score < minError) { minError = score; bestFactor = factor; }
        });

        const normalizedSignals = list.map(p => {
            const integ = parseInteg(p.integ);
            const norm = integ != null ? integ * bestFactor : null;
            return { ...p, normalizedIntegral: norm != null ? norm.toFixed(1) : null, roundedIntegral: norm != null ? Math.round(norm) : null };
        });
        const sumNorm = withInteg.reduce((acc, p) => acc + (parseInteg(p.integ) || 0) * bestFactor, 0);
        const isConsistent = targetTotal <= 0 || (Math.abs(sumNorm - targetTotal) / Math.max(1, targetTotal) <= tolRatio);
        const fitQuality = targetTotal > 0 ? Math.max(0, 1 - Math.abs(sumNorm - targetTotal) / Math.max(1, targetTotal)) : 0.95;

        if (usePlanSignature) return { normalizedSignals, fitQuality: Math.round(fitQuality * 100) / 100, isConsistent };
        return normalizedSignals;
    }

    /** Bağlam tespiti: CTX_SMALL_RIGID, CTX_LARGE_FLEXIBLE, CTX_PEPTIDE_LIKE, CTX_STEROID. */
    function getMoleculeContext(kernel) {
        const C = Number(kernel?.counts?.C ?? 0) || 0;
        const H = Number(kernel?.counts?.H ?? 0) || 0;
        const smiles = String(kernel?.smiles || kernel?.rawSmiles || "").replace(/\s+/g, "");
        const mwApprox = C * 12 + H * 1.008 + (kernel?.counts?.N ?? 0) * 14 + (kernel?.counts?.O ?? 0) * 16;
        const amideCount = (smiles.match(/C\(=O\)N|NC\(=O\)/g) || []).length;
        const isPeptideLike = amideCount >= 2;
        const isSteroid = /C1CCC2C3CCC4CCCCC4(C)C3CCC21|steroid|tetracyclic/i.test(smiles) || (C >= 20 && C <= 30 && H >= 28 && H <= 40 && (kernel?.groups?.aromaticC || 0) <= 2);
        if (isPeptideLike) return "CTX_PEPTIDE_LIKE";
        if (isSteroid) return "CTX_STEROID";
        if (mwApprox > 350 || C > 20) return "CTX_LARGE_FLEXIBLE";
        if (mwApprox < 250 && C <= 15) return "CTX_SMALL_RIGID";
        return "CTX_GENERIC";
    }

    /** Bulanık mantık: Hatanın ciddiyetini bağlama göre belirler (WARN / FAIL / HARD_VETO / INFO). */
    function SeverityGrader(issueCode, context, diffAmount) {
        let severity = "WARN";
        let penalty = 10;
        const diff = Number(diffAmount) || 0;

        switch (String(issueCode || "").toUpperCase()) {
            case "QC_C13_COUNT_LOW":
                if (context === "CTX_SMALL_RIGID") { if (diff > 0) { severity = "FAIL"; penalty = 50; } }
                else if (context === "CTX_LARGE_FLEXIBLE" || context === "CTX_STEROID") { severity = "INFO"; penalty = 0; }
                else { severity = "WARN"; penalty = 15; }
                break;
            case "QC_H1_AROMATIC_MISSING":
            case "H1_AROMATIC_MISSING":
            case "VETO_H1_AROMATIC_INTEGRAL":
                if (context === "CTX_STEROID") { severity = "WARN"; penalty = 15; }
                else if (context === "CTX_SMALL_RIGID" || context === "CTX_GENERIC") { severity = "HARD_VETO"; penalty = 100; }
                else { severity = "WARN"; penalty = 20; }
                break;
            case "MISSING_CARBON_PEAK":
                if (context === "CTX_LARGE_FLEXIBLE" || context === "CTX_STEROID") { severity = "INFO"; penalty = 0; }
                else { severity = "WARN"; penalty = 10; }
                break;
            case "QC_INTEGRAL_MISMATCH":
            case "H1_INTEGRAL_MISMATCH":
                if (diff < 0.15) { severity = "PASS"; penalty = 5; }
                else if (context === "CTX_LARGE_FLEXIBLE" || context === "CTX_PEPTIDE_LIKE") { severity = "WARN"; penalty = 10; }
                else { severity = "FAIL"; penalty = 30; }
                break;
            case "EXTRA_PEAK":
            case "QC_C13_COUNT_HIGH":
                if (context === "CTX_LARGE_FLEXIBLE") { severity = "INFO"; penalty = 0; }
                else { severity = "WARN"; penalty = 10; }
                break;
            case "NO_MS_PARENT_PEAK":
                if (context === "CTX_LARGE_FLEXIBLE") { severity = "PASS"; penalty = 5; }
                else { severity = "WARN"; penalty = 15; }
                break;
            default:
                severity = "WARN"; penalty = 10;
        }
        return { severity, penalty };
    }

    function verify1H(input) {

        const { smiles, formulaCounts, h1Signals, exclude_exchangeable_from_integral_check = true, kernel: kernelForIntegral } = input || {};

        const expectedH = Number(formulaCounts?.H ?? 0);

        const exchH = Number(formulaCounts?.h_exch ?? formulaCounts?.exchH ?? 0);

        let expectedHForIntegral = (exclude_exchangeable_from_integral_check !== false && exchH > 0) ? Math.max(0, expectedH - exchH) : expectedH;

        const peakPpm = (s) => {
            if (!s) return NaN;
            const v = s.ppm != null ? s.ppm : (s.shift ?? s.ppm_H);
            const n = Number(v);
            return Number.isFinite(n) ? n : NaN;
        };

        const parseInteg = (integ) => { const m = String(integ || "").trim().match(/^(\d+(\.\d+)?)(\s*H)?$/i); return m ? (Number.isFinite(Number(m[1])) ? Number(m[1]) : null) : null; };

        const solventRanges = [[2.45, 2.55], [3.30, 3.35], [4.7, 4.9]];
        const isInSolventRange = (ppm) => solventRanges.some(r => (ppm || 0) >= r[0] && (ppm || 0) <= r[1]);
        const isSolventOrContaminant = (s) => !!(s && (s.isSolvent === true || s.isContaminant === true || s._solvent === true));
        const integralNoiseThreshold = 0.05;
        const isBroadOrExch = (s) => /br|broad/i.test(String(s.mult || "")) || s.is_ex === true || s.isExchangeable === true || s.isBroad === true;
        const filterForIntegral = (signals) => (signals || []).filter(s => !isSolventOrContaminant(s) && !isInSolventRange(peakPpm(s)) && (parseInteg(s.integ) == null || parseInteg(s.integ) >= integralNoiseThreshold));
        const sumIntegrals = (signals) => { let sum = 0, seen = 0; for (const s of (signals || [])) { const v = parseInteg(s.integ); if (v == null) continue; sum += v; seen++; } return seen > 0 ? sum : null; };
        const calculateTotalIntegral = (signals, expectedExchH) => {
            const filtered = filterForIntegral(signals);
            const nonBroad = filtered.filter(s => !isBroadOrExch(s));
            const broadPeaks = filtered.filter(isBroadOrExch);
            let nonBroadSum = sumIntegrals(nonBroad);
            if (nonBroadSum == null) nonBroadSum = 0;
            let broadContrib = 0;
            for (const s of broadPeaks) { const v = parseInteg(s.integ); broadContrib += (v != null) ? Math.min(1, Math.max(0.5, v)) : 1; }  // OMNISCIENT v32: tutarlı exchangeable politika
            if (expectedExchH != null && expectedExchH >= 0) broadContrib = Math.min(expectedExchH, broadContrib);
            const rawSum = nonBroadSum + broadContrib;
            return rawSum == null ? null : Math.round(rawSum);
        };

        let foundH;

        let auditIntegral = null;

        const useUnifiedIntegral = !!(kernelForIntegral && kernelForIntegral.counts && Number(kernelForIntegral.counts.H) > 0);

        if (useUnifiedIntegral) {

            auditIntegral = computeH1IntegralAudit(kernelForIntegral, h1Signals || [], {});

            expectedHForIntegral = auditIntegral.hIntegralExpectedPool;

            foundH = Math.round(auditIntegral.hSum);

        } else {

            let workingSignals = filterForIntegral(h1Signals || []);

            foundH = calculateTotalIntegral(workingSignals, exchH);

            if (foundH == null) foundH = sumIntegrals(workingSignals);

            if (expectedH > 0 && foundH != null && Math.abs(foundH - expectedHForIntegral) > Math.max(1, 0.2 * expectedHForIntegral) && typeof normalizeIntegrals === "function") {

                const normalized = normalizeIntegrals(workingSignals, { totalH: expectedH, h_exch: exchH, counts: formulaCounts });

                const sumFromNorm = normalized.reduce((acc, p) => acc + (p.roundedIntegral != null ? p.roundedIntegral : parseInteg(p.integ) || 0), 0);

                if (Math.abs(sumFromNorm - expectedHForIntegral) < Math.abs((foundH || 0) - expectedHForIntegral)) { workingSignals = normalized; foundH = sumFromNorm; }

            } else if (foundH == null) foundH = sumIntegrals(workingSignals);

        }

        const countRegion = (min, max) => (h1Signals || []).filter(s => {

            const ppm = peakPpm(s);

            return Number.isFinite(ppm) && ppm >= min && ppm <= max;

        }).length;

        const hasPeakNear = (target, tol) => (h1Signals || []).some(s => {

            const ppm = peakPpm(s);

            return Number.isFinite(ppm) && Math.abs(ppm - target) <= tol;

        });

        const approx = (a, b, tol) => Math.abs(a - b) <= tol;

        const inferContext = () => {

            const nAro = countRegion(6.3, 8.8);

            case "NOESY_FALLBACK_DISPLAY_ONLY":

            case "MS_ISOTOPE_COMPANION_NOT_MASS_ERROR":

            case "IR_BAND_ABSENT_VS_UNRESOLVED_SEPARATED":
            case "IR_MULTI_CARBONYL_SUBTYPE_ALLOWED":

                    ? makeRuleResult(rule, statusFromRuleFail(rule), "IR summary-detail semantik çelişkisi.", [{ summary_detail_conflicts: context.ir_summary_conflict_items || [] }])
                    : makeRuleResult(rule, "PASS", "", []);
            case "LIBRARY_EXACT_FP_OPTIONAL_BUT_NOT_SILENT":
            case "LIBRARY_CLASS_FP_DOWNGRADE_NOT_FAIL":

                return { rule_id: rid, status: "INCONCLUSIVE", evidence: [], why: "Rule evaluator not implemented", hardness: rule.hardness || "INFO" };

    /** Merkezi kural değerlendirme motoru. @param {Array|Object} ruleset @param {Object} context @returns {Object} { results, score, vetoFlags, warnings } */
    function evaluateAll(ruleset, context) {
        const results = [];
        const vetoFlags = [];
        const warnings = [];
        const rules = (ruleset && ruleset.rules) ? ruleset.rules : (Array.isArray(ruleset) ? ruleset : []);
        for (const rule of rules) {
            if (!checkPrerequisites(rule.prerequisites || [], context)) {
                results.push({ rule_id: rule.rule_id, status: rule.status_on_skip || "SKIP", evidence: [{ missing_prerequisites: rule.prerequisites || [] }], why: "Prerequisite missing", hardness: rule.hardness });
                continue;
            }
            const result = executeRule(rule, context);
            results.push(result);
            if (result.status === "FATAL" || result.status === "ERROR") {
                vetoFlags.push({
                    error_code: result.rule_id,
                    modality: rule.modality || "FORMULA",
                    rule_name: result.rule_id,
                    why: result.why,
                    evidence: result.evidence || [],
                    missing_expected: [],
                    status_on_fail: result.status,
                    authority_tier: result.authority_tier || "AUTHORITATIVE_OR_UNKNOWN",
                    source_module: result.source_module || "rule_engine"
                });
            } else if (result.status === "WARN") {
                warnings.push({
                    error_code: result.rule_id,
                    modality: rule.modality,
                    message: result.why,
                    evidence: result.evidence || [],
                    authority_tier: result.authority_tier || "AUTHORITATIVE_OR_UNKNOWN",
                    source_module: result.source_module || "rule_engine"
                });
            }
        }
        let score = ruleset?.meta?.scoring_policy?.base_score ?? 100;
        results.forEach(r => {
            const rule = rules.find(x => (x.rule_id || x.id) === r.rule_id) || {};
            const ruleScoring = rule.scoring || {};
            if (r.status === "FATAL") score = 0;
            else if (r.status === "ERROR") score += (ruleScoring?.on_fail?.delta_score ?? -10);
            else if (r.status === "WARN") score += (ruleScoring?.on_fail?.delta_score ?? -2);
            else if (r.status === "INCONCLUSIVE") score += (ruleScoring?.on_skip?.delta_score ?? -1);
            else if (r.status === "SKIP") score += (ruleScoring?.on_skip?.delta_score ?? 0);
        });
        score = Math.max(0, Math.min(100, score));
        return { results, score, vetoFlags, warnings, veto_flags: vetoFlags };
    }

        corr.hmbc = attachAuthority(corr.hmbc, "HMBC", false);
        corr.noesy = attachAuthority(corr.noesy, "NOESY", false);
        corrFallback.hsqc = attachAuthority(corrFallback.hsqc, "HSQC", true);
        corrFallback.cosy = attachAuthority(corrFallback.cosy, "COSY", true);
        corrFallback.hmbc = attachAuthority(corrFallback.hmbc, "HMBC", true);

        const PPM_TOL_AROM = VERIFICATION_CONFIG.ppm_tol_arom;
