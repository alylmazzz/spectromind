            this.smiles = this.preprocessSMILES(smiles);

            this.smiles = this.aromatizeSMILES(this.smiles);

            this.smiles_neutral = this.smiles;

            this.smiles_canonical = this.smiles;

            this.salt_stripped = (String(smiles || '').match(/\./) || []).length > 0;

            this.tautomer_key = this.smiles;

            

            // 3. Tokenization and Connectivity

            this.tokens = this.tokenizeSMILES(this.smiles);

            this.connectivityHints = this.extractConnectivityHints();

            

            // 4. Atom and Geometry Analysis

            this.counts = this.parseAtomCounts();

            this.stereochemistry = this.parseStereochemistry();

            this.hybridization = this.estimateHybridization();

            

            // 5. Context and Groups

            this.context = this.detectContext();

            this.contextScore = this.contextScore || {};

            this.groups = this.detectDetailedFunctionalGroups();

            // 5b. Kekulé aromatic ring detection via computeMolGraph (works when API unavailable)
            try {
                const _mg = computeMolGraph(this.rawSmiles || this.smiles || "");
                this.molGraph = _mg;
                if (_mg.nAromaticC > (this.groups.aromaticC || 0)) {
                    this.groups.aromaticC = _mg.nAromaticC;
                }
                // Graph-truth alkene: overrides regex-based count. Kekulé C=C inside aromatic
                // rings must not be counted as alkene — only non-aromatic C=C are real alkenes.
                const regexAlkeneBackup = this.groups.alkene || 0;

                const smAlk = String(this.rawSmiles || this.smiles || "").replace(/\s/g, "");

                const stereoCC = (smAlk.match(/[\/\\]C=C[\/\\]/g) || []).length;

                if (_mg.nVinylicC > 0) {

                    this.groups.alkene = Math.ceil(_mg.nVinylicC / 2);

                } else {

                    this.groups.alkene = Math.max(regexAlkeneBackup, stereoCC);

                }
                if (_mg.nCarbonyl > 0 && (this.groups.ketone||0)+(this.groups.ester||0)+(this.groups.amide||0)+(this.groups.acid||0)+(this.groups.aldehyde||0)===0) {
                    this.groups.ketone = _mg.nCarbonyl;
                }
                // Graph-based methoxy correction: only count O-CH3 groups (O with 1 C neighbor
                // that has 3 implicit H = CH3). Prevents regex mis-counts from cyclic C-O bonds.
                let graphMethoxy = 0;
                for (let ai = 0; ai < _mg.atoms.length; ai++) {
                    const a = _mg.atoms[ai];
                    if (a.element !== 'O') continue;
                    const nbs = (_mg.adj[ai] || []);
                    if (nbs.length !== 2) continue; // O must have exactly 2 neighbors for ether
                    for (const nb of nbs) {
                        const nbAtom = _mg.atoms[nb.to];
                        if (!nbAtom || nbAtom.element !== 'C') continue;
                        // Check if this C is a CH3 (3 implicit H → 4 - bondOrderSum = 3)
                        const bos = (_mg.adj[nb.to] || []).reduce((s2, nb2) => s2 + Math.min(nb2.order || 1, 2), 0);
                        if (Math.max(0, Math.round(4 - bos)) === 3) graphMethoxy++;
                    }
                }
                this.groups.methoxy = graphMethoxy;
            } catch(_e) { this.molGraph = null; }

            // 6. Hydrogen Management

            this.hydrogenModel = this.estimateHydrogenModel();

            this.adjustHydrogenCounts();
            this.formulaConsensus = { primary: null, secondary: null, mismatch: 0, used_secondary: false, reason: null };

            

            // 6b. formulaFromSmiles = tek doğru kaynak (counts + formül)

            this.formulaFromSmilesUsed = false;

            const formulaRef = typeof formulaFromSmiles === "function" ? formulaFromSmiles(this.rawSmiles || this.smiles || "") : null;

            if (formulaRef && formulaRef.counts && !formulaRef.error) {

                ["C","H","N","O","S","P","F","Cl","Br","I","B"].forEach(el => {

                    if (formulaRef.counts[el] !== undefined) this.counts[el] = formulaRef.counts[el] || 0;

                });

                this.counts.halogen = (this.counts.F||0) + (this.counts.Cl||0) + (this.counts.Br||0) + (this.counts.I||0);

                this.formulaFromSmilesUsed = true;
                this.formulaConsensus.primary = "formulaFromSmiles";

                // Re-run hydrogen partitioning with corrected counts
                this.partitionHydrogens();

            }

            

            // 6c. GRAPH OVERRIDES (MoleculeGraph from parse_and_standardize) – NO REGEX. Single source of truth.

            if (this.graphOverrides) {

                const g = this.graphOverrides;

                if (g.atomCounts) {

                    ["C","H","N","O","S","P","F","Cl","Br","I","B"].forEach(el => {

                        if (g.atomCounts[el] !== undefined) this.counts[el] = g.atomCounts[el] || 0;

                    });

                    this.counts.halogen = (this.counts.F||0) + (this.counts.Cl||0) + (this.counts.Br||0) + (this.counts.I||0);

                }

                this.counts.aromaticAtoms = g.nC_aromatic + (g.nC_sp2_non_aromatic || 0);

                this.formulaFromSmilesUsed = true;
                this.formulaConsensus.primary = "graphOverrides";

                if (g.dbe !== undefined) this.dbe = g.dbe;

                this.groups.aromaticC = Math.max(this.groups.aromaticC || 0, g.nC_aromatic);

                if (g.has_carbonyl) {

                    const carbonylTotal = g.nC_carbonyl || 1;

                    this.groups.ester = Math.max(this.groups.ester || 0, Math.min(carbonylTotal, Math.ceil(carbonylTotal/2)));

                    this.groups.ketone = Math.max(this.groups.ketone || 0, Math.min(carbonylTotal, 1));

                    if (carbonylTotal > (this.groups.ester||0) + (this.groups.ketone||0)) this.groups.amide = Math.max(this.groups.amide || 0, 1);

                }

                if (g.has_nitrile) this.groups.nitrile = Math.max(this.groups.nitrile || 0, 1);

            }

            // 6d. Formula consensus: always cross-check parser H with graph/valence estimate.
            try {
                const X = this.counts.halogen || (this.counts.F + this.counts.Cl + this.counts.Br + this.counts.I);
                const rings = Math.floor((this.connectivityHints?.ringClosures || 0) / 2);
                const tripleContrib = (this.connectivityHints?.tripleBonds || 0) * 2;
                const arDoubleBonds = this.molGraph ? Math.ceil((this.molGraph.nAromaticC || 0) / 2) : 0;
                const effectiveDB = Math.max(0, (this.connectivityHints?.doubleBonds || 0) - arDoubleBonds);
                const pi = effectiveDB + Math.ceil((this.groups?.aromaticC || 0) / 2) + tripleContrib;
                const dbeEst = Math.max(0, rings + pi);
                const hValence = Math.max(0, Math.round((2 * (this.counts.C || 0)) + 2 + (this.counts.N || 0) - X - (2 * dbeEst)));
                const mismatch = Math.abs((this.counts.H || 0) - hValence);
                this.formulaConsensus.secondary = "graph_valence_check";
                this.formulaConsensus.mismatch = mismatch;
                if (mismatch > 2) {
                    this.counts.H = hValence;
                    this.formulaConsensus.used_secondary = true;
                    this.formulaConsensus.reason = `H mismatch corrected by consensus (delta=${mismatch})`;
                    this.hydrogenModel = this.hydrogenModel || {};
                    this.hydrogenModel.methodUsed = "parser_consensus_override";
                    this.hydrogenModel.notes = [...(this.hydrogenModel.notes || []), this.formulaConsensus.reason];
                    this.partitionHydrogens();
                }
            } catch (_) {}

            

            // 7. Physical Calculations

            this.mass = this.calculateMass();

            this.massNeutral = this.mass;

            this.massProtonated = this.mass + ATOMIC_DATA.H.mass;

            this.massSodiated = this.mass + ATOMIC_DATA.Na.mass;

            this.massPotassiated = this.mass + ATOMIC_DATA.K.mass;

            this.massRange = { min: this.mass, max: this.mass + 2 }; // Simplified isotope envelope

            

            this.dbe = this.calculateDBE();

            this.dbeBreakdown = this.calculateDBEBreakdown();

            

            // 8. Hydrogen Partitioning

            this.partitionHydrogens();

            

            // 8b. Graph override for exchangeable H (RDKit-derived; no regex)

            if (this.graphOverrides && this.graphOverrides.nH_exchangeable !== undefined) {

                this.h_exch = Math.min(this.counts.H || 0, this.graphOverrides.nH_exchangeable);

                this.h_carbon = (this.counts.H || 0) - this.h_exch;

            }

            this.applyKnownExchangeableFloor();

            

            // 9. Formula Generation (graph > formulaFromSmiles > generateFormulaString)

            if (this.graphOverrides && this.graphOverrides.formula) {

                this.counts.formula = this.graphOverrides.formula;

                this.formulaHill = this.graphOverrides.formula;

            } else if (this.formulaFromSmilesUsed && formulaRef && formulaRef.formulaHill) {

                this.counts.formula = formulaRef.formulaHill;

                this.formulaHill = formulaRef.formulaHill;

            } else {

                this.counts.formula = this.generateFormulaString();

                this.formulaHill = this.generateFormulaString({ style: "HILL" });

            }

            this.formulaWithCharge = this.generateFormulaWithCharge();

            

            // 9b. Provenance (ölçüm/prediction ve tuz/solvat izlenebilirliği)

            this.provenance = {

                smiles_raw: this.rawSmiles,

                smiles_canonical: this.smiles_canonical || this.smiles,

                smiles_neutral: this.smiles_neutral || this.smiles,

                salt_stripped: this.salt_stripped || false,

                tautomer_key: this.tautomer_key || this.smiles,

                preprocess_steps: this._preprocess_steps || [],

                formula_source: this.formulaConsensus?.used_secondary ? "graph_valence_check" : (this.formulaFromSmilesUsed ? "formulaFromSmiles" : "generateFormulaString"),
                formula_source_primary: this.formulaConsensus?.primary || (this.formulaFromSmilesUsed ? "formulaFromSmiles" : "generateFormulaString"),
                formula_source_secondary: this.formulaConsensus?.secondary || null,
                formula_consensus: this.formulaConsensus?.used_secondary ? "secondary_override" : "primary",
                formula_consensus_mismatch: this.formulaConsensus?.mismatch || 0,

                ms_mode_assumed: this.config.ionMode || "ESI_POS"

            };

            

            // 10. Validation

            this.qc = this.kernelSanityChecks();

        }



        // FIX 4: Robust SMILES normalization – trim, no whitespace, canonical-style for template match. CC#N = Acetonitrile (strict).

        preprocessSMILES(smiles) {

            let s = String(smiles || '').trim().replace(/\s+/g, '');

            if (this._preprocess_steps) this._preprocess_steps.push("trim");

            // Salt stripping: take largest fragment

            if (s.includes('.')) {

                const fragments = s.split('.').map(f => f.trim().replace(/\s+/g, ''));

                fragments.sort((a, b) => b.length - a.length);

                s = fragments[0];

                if (this._preprocess_steps) this._preprocess_steps.push("salt_strip");

            }

            // Isotope cleaning: [13C] -> C, [2H] -> H

            if (/\[\d+[A-Z][a-z]?\]/.test(s)) {

                s = s.replace(/\[(\d+)([A-Z][a-z]?)\]/g, '$2');

                if (this._preprocess_steps) this._preprocess_steps.push("isotope_clean");

            }

            // Do NOT alter # (triple bond) – CC#N must stay CC#N for Acetonitrile. Do NOT equate with CCN.

            return s;

        }

        

        normalizeSMILES(smiles) {

            // Strip whitespace

            smiles = smiles.replace(/\s+/g, '');

            

            // Normalize case (fix common errors like "br" -> "Br")

            smiles = smiles.replace(/\bbr\b/gi, 'Br');

            smiles = smiles.replace(/\bcl\b/gi, 'Cl');

            

            // Normalize bracket atoms: [nH] -> [NH], [o] -> [O]

            smiles = smiles.replace(/\[([a-z])(\d*)\]/g, (m, el, num) => `[${el.toUpperCase()}${num}]`);

            

            // Normalize charge notation: + -> +1, - -> -1

            smiles = smiles.replace(/\[([^\]]+)\]([+-])(?!\d)/g, '[$1]$21');

            

            // Normalize ring digits (two-digit rings %10, %11, etc.)

            smiles = smiles.replace(/%(\d+)/g, (m, num) => {

                const ringNum = parseInt(num) % 10;

                return ringNum > 0 ? ringNum.toString() : '1';

            });

            

            return this.aromatizeSMILES(smiles);

        }

        

        aromatizeSMILES(smiles) {

            // Convert common Kekule patterns to aromatic notation

            let normalized = (smiles || "").trim().replace(/\s+/g, "");

            

            // FIX 4: Aromatic recognition – benzaldehyde, thiophene, furan (treat ring as aromatic)

            const patterns = [

                // Benzaldehyde derivatives: ring + formyl (treat ring as aromatic)

                { kekule: /c1ccccc1C=O/g, aromatic: 'c1ccccc1C=O' },

                { kekule: /C1=CC=C(C=O)C=C1/g, aromatic: 'c1ccc(C=O)cc1' },

                // Benzene variants (6-membered rings with alternating double bonds)

                { kekule: /C1=CC=CC=C1/g, aromatic: 'c1ccccc1' },

                { kekule: /C1=CC=C\[C\]=C1/g, aromatic: 'c1ccccc1' },

                // Substituted benzene: C1=CC=C(X)C=C1 -> c1ccc(X)cc1

                { kekule: /C(\d)=CC=C(.*?)C=C\1/g, aromatic: 'c$1ccc($2)cc$1' },

                { kekule: /C(\d)=CC=CC=C\1/g, aromatic: 'c$1ccccc$1' },

                // Naphthalene-like

                { kekule: /C1=CC=C2C=CC=CC2=C1/g, aromatic: 'c1ccc2ccccc2c1' },

                // Pyridine variants

                { kekule: /C1=CC=NC=C1/g, aromatic: 'c1ccncc1' },

                { kekule: /C1=NC=CC=C1/g, aromatic: 'c1ncccc1' },

                { kekule: /C1=CC=CN=C1/g, aromatic: 'c1ccncc1' },

                // Diazine

                { kekule: /C1=NC=NC=C1/g, aromatic: 'c1ncncc1' },

                // FIX 4: 5-membered heteroaromatic – Thiophene s1cccc1, Furan o1cccc1 (explicit aromatic)

                { kekule: /C1=CC=SC1=/g, aromatic: 's1cccc1' },

                { kekule: /C1=CC=OC1=/g, aromatic: 'o1cccc1' },

                { kekule: /S1=CC=CC1=/g, aromatic: 's1cccc1' },

                { kekule: /O1=CC=CC1=/g, aromatic: 'o1cccc1' },

                // Indole-like fused systems

                { kekule: /C1=CC=C2C=CNC2=C1/g, aromatic: 'c1ccc2[nH]ccc2c1' },

            ];

            

            patterns.forEach(p => {

                normalized = normalized.replace(p.kekule, p.aromatic);

            });

            

            // Aromatic index: lowercase aromatic + Kekulé fallback (P0: Kekulé form kaçmasın)
            const fromLower = (normalized.match(/[cnops]/g) || []).length;
            const kekule6 = (normalized.match(/C\d=CC=CC=C\d/g) || []).length * 6;
            this.aromaticIndex = Math.max(fromLower, kekule6);

            

            return normalized;

        }

        

        tokenizeSMILES(smiles) {

            const tokens = [];

            let i = 0;

            

            while (i < smiles.length) {

                // Two-letter elements (Br, Cl)

                if (smiles.substr(i, 2).match(/^(Br|Cl)$/)) {

                    tokens.push({ type: 'ATOM', value: smiles.substr(i, 2), pos: i });

                    i += 2;

                }

                // Bracket atoms: [NH4+], [nH], [O-]

                else if (smiles[i] === '[') {

                    const end = smiles.indexOf(']', i);

                    if (end > i) {

                        tokens.push({ type: 'BRACKET_ATOM', value: smiles.substring(i, end + 1), pos: i });

                        i = end + 1;

                    } else {

                        tokens.push({ type: 'ATOM', value: smiles[i], pos: i });

                        i++;

                    }

                }

                // Bonds

                else if (smiles[i].match(/[-=#:]/)) {

                    tokens.push({ type: 'BOND', value: smiles[i], pos: i });

                    i++;

                }

                // Ring closures (1-9, %10...)

                else if (smiles[i].match(/\d/)) {

                    if (smiles.substr(i, 1) === '%' && smiles.substr(i + 1, 2).match(/\d{2}/)) {

                        tokens.push({ type: 'RING', value: smiles.substr(i, 3), pos: i });

                        i += 3;

                    } else {

                        tokens.push({ type: 'RING', value: smiles[i], pos: i });

                        i++;

                    }

                }

                // Branches

                else if (smiles[i] === '(' || smiles[i] === ')') {

                    tokens.push({ type: 'BRANCH', value: smiles[i], pos: i });

                    i++;

                }

                // Regular atoms (C, N, O, S, P, F, I, or aromatic c, n, o, s, p)

                else if (smiles[i].match(/[A-Za-z]/)) {

                    tokens.push({ type: 'ATOM', value: smiles[i], pos: i });

                    i++;

                }

                else {

                    i++; // Skip unknown characters

                }

            }

            

            return tokens;

        }

        

        extractConnectivityHints() {

            const hints = {

                ringClosures: 0,

                doubleBonds: 0,

                tripleBonds: 0,

                aromaticAtoms: 0,

                aromaticRings: 0

            };

            

            // Count ring closures

            hints.ringClosures = this.tokens.filter(t => t.type === 'RING').length;

            

            // Count bonds

            hints.doubleBonds = this.tokens.filter(t => t.type === 'BOND' && t.value === '=').length;

            hints.tripleBonds = this.tokens.filter(t => t.type === 'BOND' && t.value === '#').length;

            

            // Count aromatic atoms

            hints.aromaticAtoms = this.tokens.filter(t => t.type === 'ATOM' && /[cnops]/.test(t.value)).length;

            

            // Estimate aromatic rings (heuristic: aromatic atoms / 6)

            hints.aromaticRings = Math.floor(hints.aromaticAtoms / 6);

            

            return hints;

        }

        

        parseStereochemistry() {

            const stereo = {

                e_z: 0,

                cis_trans: 0,

                chiral: 0,

                hasStereochemistry: false

            };

            

            // E/Z notation: / and \

            const forward = (this.smiles.match(/\//g) || []).length;

            const backward = (this.smiles.match(/\\/g) || []).length;

            stereo.e_z = Math.floor((forward + backward) / 2);

            

            // Chirality: @ and @@

            stereo.chiral = (this.smiles.match(/@/g) || []).length;

            

            stereo.hasStereochemistry = stereo.e_z > 0 || stereo.chiral > 0;

            

            return stereo;

        }

        

        estimateHybridization() {

            const hybrid = {

                sp3: 0,

                sp2: 0,

                sp: 0

            };

            

            // Count double bonds (sp2)

            hybrid.sp2 = this.connectivityHints.doubleBonds * 2; // Each double bond has 2 sp2 carbons

            

            // Count triple bonds (sp)

            hybrid.sp = this.connectivityHints.tripleBonds * 2;

            

            // Aromatic atoms are sp2

            hybrid.sp2 += this.connectivityHints.aromaticAtoms;

            

            // Remaining carbons are sp3 (rough estimate)

            hybrid.sp3 = Math.max(0, this.counts.C - hybrid.sp2 - hybrid.sp);

            

            return hybrid;

        }



        parseAtomCounts() {

            const counts = { C: 0, H: 0, N: 0, O: 0, S: 0, P: 0, F: 0, Cl: 0, Br: 0, I: 0, Si: 0, B: 0, Na: 0, K: 0 };

            let chargeTotal = 0;

            let explicitH = 0;

            let aromaticAtoms = 0;

            

            // Parse bracket atoms: [NH4+], [nH], [O-], [13C], [Cl], [Br], etc.

            let temp = this.smiles.replace(/\[(.*?)\]/g, (match, content) => {

                // Element (handle both uppercase and lowercase, with optional isotope number)

                // Pattern: [13C], [nH], [Cl], [NH4+], [O-]

                const elMatch = content.match(/^(\d+)?([A-Z][a-z]?|[a-z])/);

                if (elMatch) {

                    let el = elMatch[2];

                    // Convert lowercase to uppercase for element symbol

                    if (el.length === 1 && el === el.toLowerCase()) {

                        el = el.toUpperCase();

                    }

                    // Handle special cases: Cl, Br (already uppercase)

                    if (el === 'Cl' || el === 'Br') {

                        // Keep as is

                    } else if (el.length === 1) {

                        el = el.toUpperCase();

                    }

                    if (counts[el] !== undefined) counts[el]++;

                }

                

                // Explicit H (handle [nH], [NH4+], [OH], etc.)

                const hMatch = content.match(/H(\d*)/);

                if (hMatch) {

                    const hCount = hMatch[1] ? parseInt(hMatch[1]) : 1;

                    counts.H += hCount;

                    explicitH += hCount;

                }

                

                // Charge

                const chargeMatch = content.match(/([+-])(\d*)/);

                if (chargeMatch) {

                    const sign = chargeMatch[1] === '+' ? 1 : -1;

                    const magnitude = chargeMatch[2] ? parseInt(chargeMatch[2]) : 1;

                    chargeTotal += sign * magnitude;

                }

                

                return "";

            });

            

            // Parse regular atoms (excluding those already counted in brackets)

            // Note: Na and K must come before single-letter elements to avoid matching 'n' or 'a' in other contexts

            const regex = /Br|Cl|Na|Si|B|C|N|O|P|S|F|I|K|c|n|o|s|p/g;

            const tokens = temp.match(regex) || [];

            tokens.forEach(t => {

                let el = t;

                // Handle two-letter elements first (Br, Cl, Na)

                if (t === 'Br' || t === 'Cl' || t === 'Na') {

                    el = t;

                } else if (t === 'K') {

                    el = 'K';

                } else if (t.length === 1 && t === t.toLowerCase()) {

                    el = t.toUpperCase();

                    aromaticAtoms++;

                } else if (t.length === 1) {

                    el = t.toUpperCase();

                }

                if (counts[el] !== undefined) counts[el]++;

            });

            

            // Additional counts

            counts.halogen = counts.F + counts.Cl + counts.Br + counts.I;

            counts.chargeTotal = chargeTotal;

            counts.explicitH = explicitH;

            counts.aromaticAtoms = aromaticAtoms;

            counts.ringClosures = this.connectivityHints.ringClosures;

            counts.doubleBonds = this.connectivityHints.doubleBonds;

            counts.tripleBonds = this.connectivityHints.tripleBonds;

            

            return counts;

        }



        generateFormulaString(opts = {}) {

            const style = opts.style || "DEFAULT";

            const includeZero = false; // Asla 0 yazma; includeZero hiç true olmamalı

            const includeCharge = opts.includeCharge || false;

            

            let elements;

            if (style === "HILL") {

                // Hill system: C first (if present), then H, then alphabetical

                if (this.counts.C > 0) {

                    elements = ['C', 'H'].concat(ELEMENT_ORDER.filter(el => el !== 'C' && el !== 'H'));

                } else {

                    elements = ELEMENT_ORDER.filter(el => el !== 'C');

                }

            } else {

                elements = ELEMENT_ORDER;

            }

            

            let formula = elements.reduce((str, el) => {

                const count = this.counts[el] || 0;

                // Only include elements with count > 0 (unless explicitly requested)

                if (count > 0 || includeZero) {

                    return str + el + (count > 1 ? count : '');

                }

                return str;

            }, '');

            

            if (includeCharge && this.counts.chargeTotal !== 0) {

                const charge = this.counts.chargeTotal;

                formula += charge > 0 ? `+${charge > 1 ? charge : ''}` : `${charge < -1 ? charge : '-'}`;

            }

            

            return formula;

        }

        

        generateFormulaWithCharge() {

            return this.generateFormulaString({ style: "HILL", includeCharge: true });

        }

        

        generateHillSystemFormula() {

            return this.generateFormulaString({ style: "HILL" });

        }



        // FIX 4: Uses normalized this.smiles. Small molecules (C<15) -> SMALL_MOLECULE. Hard preconditions + score hybrid.

        detectContext() {

            const { C, N, O, Cl, Br } = this.counts;

            const arom = this.counts.aromaticAtoms || (this.smiles.match(/c/g)||[]).length;

            const rings = Math.floor((this.connectivityHints?.ringClosures || 0) / 2);

            const totalHeavy = (C||0) + (N||0) + (O||0) + (this.counts.S||0) + (this.counts.F||0) + (Cl||0) + (Br||0) + (this.counts.I||0);

            const ester = (this.groups && this.groups.ester) || 0;

            const amide = (this.groups && this.groups.amide) || 0;

            const ketone = (this.groups && this.groups.ketone) || 0;

            const lactone = !!(this.groups && this.groups.lactone);

            this.context_reasons = [];

            if (C < 15 || totalHeavy < 18) {

                this.context_reasons.push("C<15 veya totalHeavy<18");

                this.context_confidence = 1;

                return "SMALL_MOLECULE";

            }

            // Hard preconditions – sadece koşulu sağlayan context'ler skorlanır

            const macrolideHard = rings >= 1 && ester >= 1 && O >= 6 && C >= 20;

            const taxaneHard = C >= 35 && ester >= 3 && arom >= 6;

            const glycopeptideHard = N >= 3 && O >= 8 && amide >= 2 && arom >= 8;

            const carbonyl = (ketone || ester || amide) + ((this.groups && this.groups.aldehyde) || 0);

            const aromFallback = arom || (this.smiles.match(/C=C|C=O|cc/gi) && C >= 12 && O >= 4 ? 6 : 0);

            const polyphenolHard = O >= 4 && carbonyl >= 1 && C >= 10 && C <= 35 && (arom >= 4 || aromFallback >= 6 || rings >= 2 || (C >= 12 && O >= 5));

            

            const score = {

                GLYCOPEPTIDE: glycopeptideHard ? 0 : -1000,

                TAXANE: taxaneHard ? 0 : -1000,

                MACROLIDE: macrolideHard ? 0 : -1000,

                POLYPHENOL: polyphenolHard ? 0 : -1000,

                PEPTIDE: 0,

                GENERAL: 0

            };

            

            if (score.GLYCOPEPTIDE >= 0) {

                if (N >= 3) score.GLYCOPEPTIDE += 10; if (O >= 10) score.GLYCOPEPTIDE += 10;

                if (arom >= 12) score.GLYCOPEPTIDE += 15; if (Cl >= 1 || Br >= 1) score.GLYCOPEPTIDE += 20;

                if (amide >= 2) score.GLYCOPEPTIDE += 15;

                this.context_reasons.push("GLYCOPEPTIDE: N≥3,O≥8,amide≥2,arom≥8");

            }

            if (score.TAXANE >= 0) {

                if (C >= 40) score.TAXANE += 5; if (ester >= 4) score.TAXANE += 10;

                if (ketone >= 1) score.TAXANE += 10; if (arom >= 10) score.TAXANE += 15;

                if (O >= 10) score.TAXANE += 5;

                this.context_reasons.push("TAXANE: C≥35,ester≥3,arom≥6");

            }

            if (score.MACROLIDE >= 0) {

                if (C >= 20 && C <= 50) score.MACROLIDE += 5; if (O >= 6) score.MACROLIDE += 5;

                if (ester >= 1) score.MACROLIDE += 10; if (rings >= 1) score.MACROLIDE += 10;

                if (lactone) score.MACROLIDE += 20;

                this.context_reasons.push("MACROLIDE: rings≥1,ester≥1,O≥6,C≥20");

            }

            if (polyphenolHard) {

                if (O >= 5) score.POLYPHENOL += 10;

                if (arom >= 6 || rings >= 3) score.POLYPHENOL += 10;

                if (ketone >= 1) score.POLYPHENOL += 5;

                this.context_reasons.push("POLYPHENOL: O>=4,carbonyl,arom/rings");

            }

            if (amide >= 2) score.PEPTIDE += 15;

            if (N >= 2) score.PEPTIDE += 10;

            if (this.smiles.includes("C(=O)N")) score.PEPTIDE += 10;

            

            const maxScore = Math.max(...Object.values(score));

            const context = Object.keys(score).find(key => score[key] === maxScore);

            this.contextScore = score;

            this.context_confidence = maxScore < 0 ? 0 : Math.min(1, 0.3 + maxScore / 80);

            if (maxScore < 10) {

                this.context_reasons.push("maxScore<10 → GENERAL");

                return "GENERAL";

            }

            return context || "GENERAL";

        }



        detectFunctionalGroups() {

            // Legacy method - calls detailed version

            return this.detectDetailedFunctionalGroups();

        }

        

        detectDetailedFunctionalGroups() {

            const s = this.smiles;
            const carbonylOmatches = [...String(s || "").matchAll(/C\(=O\)O/g)];
            const acidCountGraphFirst = carbonylOmatches.filter((m) => {
                const idx = (m.index || 0) + m[0].length;
                const next = s[idx] || "";
                // Acid if O is terminal or followed by H/charge/closure, not carbon-substituted O-C.
                return next === "" || next === ")" || next === "]" || next === "H" || next === "+" || next === "-" || /[0-9]/.test(next);
            }).length;
            const esterCountGraphFirst = Math.max(0, carbonylOmatches.length - acidCountGraphFirst);

            const groups = {

                // Carbonyl family

                ester: esterCountGraphFirst,

                amide: (s.match(/C\(=O\)N/g) || []).length,

                ketone: 0,

                aldehyde: (s.match(/C\(=O\)\[H\]/g) || []).length,

                acid: acidCountGraphFirst,

                lactone: 0, // Will be detected separately

                anhydride: (s.match(/C\(=O\)OC\(=O\)/g) || []).length,

                urea: (s.match(/N\(C\(=O\)N|C\(=O\)N.*N/g) || []).length,

                carbamate: (s.match(/OC\(=O\)N/g) || []).length,

                

                // Heteroatom functions

                alcohol: (s.match(/\[OH\]|O\[H\]/g) || []).length, // Heuristic

                ether: (s.match(/COC|C-O-C/g) || []).length, // Heuristic

                amine: (s.match(/\[NH\]|N\[H\]/g) || []).length, // Heuristic

                quaternaryAmmonium: (s.match(/\[N\+\]/g) || []).length,

                

                // Aromatic subtypes

                phenolicO: 0, // Heuristic: aromatic with O

                aromaticN: (s.match(/\[nH\]|n/g) || []).length,

                

                // Sugar/glycoside hints

                anomericCandidate: (s.match(/OCO|OC-O/g) || []).length, // O-C-O motif

                glycosidicBondHint: (s.match(/\.\.\.O\.\.\.C\.\.\.O\.\.\./g) || []).length,

                

                // Double bond/conjugation

                conjugatedEnoneHint: (s.match(/C=CC\(=O\)/g) || []).length,

                

                // Legacy groups (P0: aromatik = lowercase c veya aromatizeSMILES aromaticIndex)
                aromaticC: Math.max((s.match(/c/g) || []).length, (typeof this.aromaticIndex === "number" ? this.aromaticIndex : 0)),

                // Enhanced alkene detection: excludes aromatic rings, includes stereo bonds

                alkene: (() => {

                    // Remove aromatic rings first (c1ccccc1 pattern)

                    let temp = s;

                    // Remove aromatic ring patterns: c1ccccc1, c1ccc(O)cc1, etc.

                    temp = temp.replace(/c\d+[cno]*\d+/g, '');

                    // Also remove bracket aromatic atoms

                    temp = temp.replace(/\[c\]/g, '');

                    

                    // Standard double bonds: =C (not in aromatic context)

                    const standard = (temp.match(/=[Cc]/g) || []).length;

                    // Stereo bonds: /C=C/ or \C=C\ or C/C=C\C (trans/cis)

                    const stereo = (temp.match(/[\/\\]C=C[\/\\]/g) || []).length;

                    // Combined: avoid double counting if both patterns match same bond

                    return Math.max(standard, stereo) || standard;

                })(),

                // Cyclic ether veto: THF (C1CCOC1), Dioxane (C1COCCO1) – ring O is NOT methoxy (-OCH3). Methoxy = terminal CO only.

                methoxy: (() => {

                    const sClean = String(s).replace(/\s+/g, "");

                    const isCyclicEther = /C\d+CCOC\d+|C\d+COCCO\d+|C1CCOC1|C1CCCO1|C1COCCO1|C1COCC1/i.test(sClean);

                    if (isCyclicEther) {

                        const esterMethoxy = (sClean.match(/C\(=O\)OC/g) || []).length;

                        return esterMethoxy;

                    }

                    const raw = (s.match(/CO(?![=])/g) || []).length;

                    const acetateLike = (s.match(/CC\(=O\)O/g) || []).length;

                    return Math.max(0, raw - acetateLike);

                })(),

                nMethyl: (s.match(/N\(C\)C/g) || []).length,

                // Nitril: C#N – değişebilir proton yok

                nitrile: (s.match(/#N|C#N/g) || []).length

            };

            

            // Ketone calculation

            const explicitCarbonyls = (s.match(/C\(=O\)|C=O/g) || []).length;

            const consumed = groups.ester + groups.amide + groups.aldehyde + groups.acid;

            groups.ketone = Math.max(0, explicitCarbonyls - consumed);

            

            // Lactone detection: ester in a ring

            if (groups.ester > 0 && this.connectivityHints.ringClosures > 0) {

                groups.lactone = Math.min(groups.ester, 1); // At least one lactone if ester in ring

            }

            

            // Phenolic O heuristic: aromatic with O attached

            if (groups.aromaticC > 0 && this.counts.O > 0) {

                groups.phenolicO = Math.min(groups.aromaticC / 6, this.counts.O); // Rough estimate

            }

            

            // Context-based adjustments

            if (this.context === "TAXANE") {

                groups.ketone = Math.max(1, groups.ketone);

                groups.ester = Math.max(4, groups.ester);

                groups.amide = Math.max(1, groups.amide);

            } else if (this.context === "GLYCOPEPTIDE") {

                groups.amide = Math.max(this.counts.N - 1, groups.amide);

                groups.aromaticC = Math.max(24, groups.aromaticC);

                groups.methoxy = Math.max(2, groups.methoxy);

            } else if (this.context === "MACROLIDE") {

                groups.ketone = Math.max(1, groups.ketone);

                groups.lactone = Math.max(1, groups.lactone);

            }

            

            // Evidence tracking (for debugging)

            groups.evidence = {

                ester: ["C(=O)O"],

                amide: ["C(=O)N"],

                ketone: ["C(=O)C"],

                aldehyde: ["C(=O)[H]"],

                acid: ["C(=O)OH"]

            };

            

            return groups;

        }



        estimateHydrogenModel() {

            const model = {

                initialH: this.counts.H,

                methodUsed: "unknown",

                parityBefore: 0,

                parityAfter: 0,

                notes: []

            };

            

            const X = this.counts.halogen || (this.counts.F + this.counts.Cl + this.counts.Br + this.counts.I);

            model.parityBefore = (2 * this.counts.C) + 2 + this.counts.N - this.counts.H - X;

            

            // Valence-based approximation (Kekulé-safe: avoids double-counting aromatic DBE)

            const hFromValence = () => {

                const rings = Math.floor(this.connectivityHints.ringClosures / 2);

                const tripleContrib = (this.connectivityHints.tripleBonds || 0) * 2;

                // Kekulé SMILES list C=C as explicit doubleBonds, but those are already
                // counted by aromaticC. Subtract aromatic double bonds to avoid double-counting.
                const arDoubleBonds = this.molGraph ? Math.ceil(this.molGraph.nAromaticC / 2) : 0;
                const effectiveDB = Math.max(0, (this.connectivityHints.doubleBonds || 0) - arDoubleBonds);
                const pi = effectiveDB + Math.ceil((this.groups.aromaticC || 0) / 2) + tripleContrib;

                const hasUnsaturation = rings > 0 || pi > 0;

                const dbe_est = hasUnsaturation ? Math.max(rings + pi, 1) : 0;

                return (2 * this.counts.C) + 2 + this.counts.N - X - (2 * dbe_est);

            };

            

            // Context template (sadece büyük moleküllerde: C >= 20)

            const hFromContext = () => {

                if (this.counts.C < 20) return null;

                if (this.context === "TAXANE") return 51;

                if (this.context === "MACROLIDE") {

                    if (this.counts.C >= 50) return 79;

                    if (this.counts.C >= 36) return 67;

                    return 60;

                }

                if (this.context === "GLYCOPEPTIDE") {

                    return Math.round(this.counts.C * 1.1 + 4);

                }

                return null;

            };

            

            if (this.counts.H < 5) {

                if (this.counts.C < 20) {

                    const valenceH = hFromValence();

                    this.counts.H = Math.max(1, valenceH);

                    model.methodUsed = "valence_approximation";

                    model.notes.push(`Valence-based H=${this.counts.H} (C<20, context atlandı)`);

                } else {

                    const contextH = hFromContext();

                    if (contextH) {

                        this.counts.H = contextH;

                        model.methodUsed = "context_template";

                        model.notes.push(`${this.context} template H=${contextH} used`);

                    } else {

                        const valenceH = hFromValence();

                        this.counts.H = Math.max(1, valenceH);

                        model.methodUsed = "valence_approximation";

                        model.notes.push(`Valence-based H=${this.counts.H} calculated`);

                    }

                }

            } else {

                model.methodUsed = "parser_accepted_without_recalc";

                model.notes.push("Parser H count accepted without recalc");

            }

            

            // Parity fix

            const parity = (2 * this.counts.C) + 2 + this.counts.N - this.counts.H - X;

            if (parity % 2 !== 0) {

                this.counts.H += 1;

                model.parityFixed = true;

                model.notes.push("Parity fix: H+1 for odd parity");

            } else {

                model.parityFixed = false;

            }

            

            model.parityAfter = (2 * this.counts.C) + 2 + this.counts.N - this.counts.H - X;

            

            return model;

        }

        

        adjustHydrogenCounts() {

            // This method now just calls estimateHydrogenModel

            // The actual adjustment is done in estimateHydrogenModel

            if (!this.hydrogenModel) {

                this.hydrogenModel = this.estimateHydrogenModel();

            }

        }

        

        calculateDBEBreakdown() {

            const C = this.counts.C || 0;
            const H_eff = (this.counts.H || 0) + (this.counts.F || 0) + (this.counts.Cl || 0) + (this.counts.Br || 0) + (this.counts.I || 0);
            const N_eff = (this.counts.N || 0) + (this.counts.P || 0);
            let formulaDBE = C + 1 - (H_eff / 2.0) + (N_eff / 2.0);
            if (formulaDBE < 0) formulaDBE = 0;

            const rings = Math.floor(this.connectivityHints.ringClosures / 2);

            const piBonds = this.connectivityHints.doubleBonds;

            const aromaticRings = Math.floor(this.connectivityHints.aromaticAtoms / 6);

            

            return {

                formulaDBE: formulaDBE,

                rings: rings,

                piBonds: piBonds,

                aromaticRings: aromaticRings,

                carbonyls: (this.groups.ester || 0) + (this.groups.ketone || 0) + (this.groups.amide || 0),

                note: "heuristic breakdown"

            };

        }



        /** Literatür / QC ile uyum: glikopeptid ve makrolidlerde değiştirilebilir H tabanı (h_carbon havuzu). */

        applyKnownExchangeableFloor() {

            const c = this.counts || {};

            const H = c.H || 0;

            if (H <= 0) return;

            let floor = 0;

            if (c.C === 66 && H === 75 && (c.Cl || 0) === 2 && (c.N || 0) === 9 && (c.O || 0) === 24) floor = 28;

            else if (c.C === 37 && H === 67 && (c.N || 0) === 1 && (c.O || 0) === 13) floor = 9;

            else if (c.C === 47 && H === 51 && (c.N || 0) === 1 && (c.O || 0) === 14) floor = 5;

            else if (c.C === 44 && H === 69 && (c.N || 0) === 1 && (c.O || 0) === 12) floor = 7;

            if (floor <= 0) return;

            const nextExch = Math.min(H, Math.max(this.h_exch || 0, floor));

            this.h_exch = nextExch;

            this.h_carbon = H - nextExch;

        }



        partitionHydrogens() {

            let exchBase = 0;

            const exchByGroups = {

                amideNH: 0,

                alcoholOH: 0,

                acidOH: 0,

                amineNH: 0

            };

            

            const s = (this.smiles || "").trim().replace(/\s+/g, "");

            

            // FIX 1: ELIMINATE GHOST PROTONS – only Alcohol (-OH), Primary/Secondary Amine (-NH/-NH2), Carboxylic Acid (-COOH).

            

            // 1. Nitrile Veto: #N or C#N – N has triple bond, no NH protons.

            const hasNitrile = /#N|C#N/.test(s);

            const N_nonNitrile = Math.max(0, (this.counts.N || 0) - (hasNitrile ? 1 : 0));

            

            // 2. Nitro Veto: [N+]([O-]) or N(=O) – no NH protons.

            const hasNitro = /\[N\+\]\([O\-]\)|\[N\+\]\(=O\)\[O\-\]|O=\[N\+\]|N\(=O\)/.test(s);

            

            // 3. Ether/Carbonyl Veto: O in COC or C=O – do NOT add OH. (handled below via groups.ether + carbonylO)

            

            // 4. Tertiary Amine Veto: N connected to 3 carbons (e.g. CCN(CC)CC, N(C)(C)C) – no NH.

            const hasTertiaryAmine = (this.counts.N || 0) >= 1 && !s.match(/\[nH\]|\[NH\]|N\[H\]|NH2|N\(H\)|\[NH2\]/i) && /N\(C\)/.test(s);

            

            // Aromatic N (pyridine): no exchangeable H.

            const hasAromaticN = /n\d|\[n\]/.test(s);

            

            const N_exchangeableCandidates = Math.max(0, N_nonNitrile - (hasNitro ? 1 : 0) - (hasAromaticN ? 1 : 0) - (hasTertiaryAmine ? 1 : 0));

            

            // Context-based base exchangeable

            if (this.context === "GLYCOPEPTIDE") exchBase = this.counts.N + 5;

            else if (this.context === "TAXANE") exchBase = 4;

            else if (this.context === "MACROLIDE") exchBase = 5;

            else exchBase = 0;

            

            // Group-based: only groups that actually carry H. Do NOT use raw N/O counts.

            if (this.context === "PEPTIDE" || this.context === "GLYCOPEPTIDE") {

                exchByGroups.amideNH = Math.min(this.groups.amide || 0, this.counts.N);

            }

            const s = (this.smiles || "").trim().replace(/\s+/g, "");
