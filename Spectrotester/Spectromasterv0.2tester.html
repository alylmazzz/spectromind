        const runSmokeTests = () => {
            const results = [];
            for (const tc of GOLDEN_EXPECTATIONS.test_cases) {
                const tcResult = { id: tc.id, name: tc.name, smiles: tc.smiles, checks: [], pass: true };
                try {
                    const k = new SpectroMasterKernel(tc.smiles, {});
                    const h1 = generate1H ? generate1H(k) : (typeof window.generate1H === 'function' ? window.generate1H(k) : null);
                    const c13 = generate13C ? generate13C(k, h1?.signals || [], h1?.stats || {}) : null;
                    const corrRaw = (typeof generate2D === 'function') ? generate2D(h1?.signals || [], c13?.signals || [], k, {}) : null;
                    const corr = ensure2DCorrelationsVisible(corrRaw, h1?.signals || [], c13?.signals || [], k);
                    const inv = tc.invariants;

                    const check = (name, passed, detail) => {
                        tcResult.checks.push({ name, passed, detail });
                        if (!passed) tcResult.pass = false;
                    };

                    const pInteg = (s) => parseFloat(String(s.integ || "1").replace(/H$/i, "")) || 1;

                    // ── Formula / DBE ──
                    if (inv.formula) {
                        check("formula", k.formula === inv.formula, `got=${k.formula}, expected=${inv.formula}`);
                    }
                    if (inv.dbe != null) {
                        check("dbe", k.dbe === inv.dbe, `got=${k.dbe}, expected=${inv.dbe}`);
                    }

                    // ── Aromatic C count ──
                    if (inv.aromatic_C_min != null) {
                        const nAr = k.groups?.aromaticC || 0;
                        check("aromatic_C_min", nAr >= inv.aromatic_C_min, `aromaticC=${nAr}, min=${inv.aromatic_C_min}`);
                    }

                    // ── 13C: carbonyl presence/absence ──
                    if (c13 && inv.c13_carbonyl_must_not_be_present) {
                        const carbonylSig = (c13.signals || []).filter(s => (s.ppm||0) >= 160 && (s.ppm||0) <= 220);
                        check("no_c13_carbonyl", carbonylSig.length === 0, `carbonyl_signals=${carbonylSig.length} (ppm: ${carbonylSig.map(s=>s.ppm?.toFixed(1)).join(',')})`);
                    }
                    if (c13 && inv.c13_carbonyl_must_be_present) {
                        const cMin = inv.carbonyl_ppm_min || 160;
                        const cMax = inv.carbonyl_ppm_max || 220;
                        const carbonylSig = (c13.signals || []).filter(s => (s.ppm||0) >= cMin && (s.ppm||0) <= cMax);
                        check("c13_carbonyl_present", carbonylSig.length >= 1, `carbonyl in [${cMin}-${cMax}]=${carbonylSig.length}`);
                    }
                    if (c13 && inv.c13_no_aliphatic_ketone) {
                        const aliKetone = (c13.signals || []).filter(s => (s.ppm||0) >= 200 && (s.ppm||0) <= 220);
                        check("no_aliphatic_ketone", aliKetone.length === 0, `aliphatic_ketone(200-220)=${aliKetone.length}`);
                    }

                    // ── 13C: aromatic CH and Q ──
                    if (c13 && inv.aromatic_CH_min != null) {
                        const arCH = (c13.signals || []).filter(s => s.type === "CH" && (s.ppm||0) >= 95 && (s.ppm||0) <= 165).length;
                        check("aromatic_CH_min", arCH >= inv.aromatic_CH_min, `arCH=${arCH}, min=${inv.aromatic_CH_min}`);
                    }
                    if (c13 && inv.aromatic_Q_min != null) {
                        const arQ = (c13.signals || []).filter(s => (s.type === "Q" || s.type === "Cq") && (s.ppm||0) >= 100 && (s.ppm||0) <= 165).length;
                        check("aromatic_Q_min", arQ >= inv.aromatic_Q_min, `arQ=${arQ}, min=${inv.aromatic_Q_min}`);
                    }

                    // ── 13C: hetero CH (O-CH/O-CH2) ──
                    if (c13 && inv.hetero_CH_min != null) {
                        const [hMin, hMax] = inv.hetero_CH_ppm_range || [55, 95];
                        const hetCH = (c13.signals || []).filter(s => (s.type === "CH" || s.type === "CH2") && (s.ppm||0) >= hMin && (s.ppm||0) <= hMax).length;
                        check("hetero_CH_min", hetCH >= inv.hetero_CH_min, `hetCH=${hetCH} in [${hMin}-${hMax}], min=${inv.hetero_CH_min}`);
                    }

                    // ── 1H: aromatic integral ──
                    if (h1 && inv.h1_aromatic_min != null) {
                        const arH = (h1.signals || []).filter(s => (s.ppm||0) >= 6.0 && (s.ppm||0) <= 9.0 && !s.is_ex);
                        const integSum = arH.reduce((s, x) => s + pInteg(x), 0);
                        check("h1_aromatic_integral", integSum >= inv.h1_aromatic_min, `aromatic_integ=${integSum.toFixed(1)}, min=${inv.h1_aromatic_min}`);
                    }

                    // ── 1H: vinylic integral ──
                    if (h1 && inv.h1_vinylic_min != null) {
                        const vinH = (h1.signals || []).filter(s => (s.ppm||0) >= 6.0 && (s.ppm||0) <= 7.6 && !s.is_ex && (s.category === "VINYLIC" || (s.assign||"").toLowerCase().includes("vinyl")));
                        const vinInteg = vinH.reduce((s, x) => s + pInteg(x), 0);
                        check("h1_vinylic_integral", vinInteg >= inv.h1_vinylic_min, `vinylic_integ=${vinInteg.toFixed(1)}, min=${inv.h1_vinylic_min}`);
                    }

                    // ── 1H: O-CH region (3.0-5.6 ppm) ──
                    if (h1 && inv.h1_och_region_min != null) {
                        const ochH = (h1.signals || []).filter(s => (s.ppm||0) >= 3.0 && (s.ppm||0) <= 5.6 && !s.is_ex);
                        const ochInteg = ochH.reduce((s, x) => s + pInteg(x), 0);
                        check("h1_och_region", ochInteg >= inv.h1_och_region_min, `och_integ=${ochInteg.toFixed(1)}, min=${inv.h1_och_region_min}`);
                    }

                    // ── Exchangeable H count ──
                    if (h1 && inv.exch_H_min != null) {
                        const exchH = (h1.signals || []).filter(s => s.is_ex);
                        const exchInteg = exchH.reduce((s, x) => s + pInteg(x), 0);
                        check("exch_H_min", exchInteg >= inv.exch_H_min, `exchH_integ=${exchInteg.toFixed(1)}, min=${inv.exch_H_min}`);
                    }
                    if (h1 && inv.exch_H_max != null) {
                        const exchH = (h1.signals || []).filter(s => s.is_ex);
                        const exchInteg = exchH.reduce((s, x) => s + pInteg(x), 0);
                        check("exch_H_max", exchInteg <= inv.exch_H_max + 1, `exchH_integ=${exchInteg.toFixed(1)}, max=${inv.exch_H_max}`);
                    }

                    // ── No dominant alkyl 2ppm cluster ──
                    if (h1 && inv.no_dominant_alkyl_2ppm) {
                        const alkylH = (h1.signals || []).filter(s => (s.ppm||0) >= 1.8 && (s.ppm||0) <= 2.6 && !s.is_ex);
                        const alkylInteg = alkylH.reduce((s, x) => s + pInteg(x), 0);
                        check("no_dominant_alkyl_2ppm", alkylInteg <= 3.0, `alkyl_1.8-2.6_integ=${alkylInteg.toFixed(1)}, max=3.0`);
                    }

                    // ── Vinyl C ──
                    if (c13 && inv.vinyl_C_min != null) {
                        const vinylC = (c13.signals || []).filter(s => s.category === "VINYLIC").length;
                        check("vinyl_C_min", vinylC >= inv.vinyl_C_min, `vinylC=${vinylC}, min=${inv.vinyl_C_min}`);
                    }

                    // ── HSQC Q veto ──
                    if (inv.hsqc_Q_veto) {
                        if (corr && corr.hsqc) {
                            const qInHsqc = corr.hsqc.filter(x => x.c != null && x.meta && (x.meta.type === "Q" || x.meta.type === "CQ"));
                            check("hsqc_no_Q", qInHsqc.length === 0, `Q_in_HSQC=${qInHsqc.length}`);
                        } else if (c13) {
                            const aromaticC = k.groups?.aromaticC || 0;
                            const arCH = (c13.signals || []).filter(s => s.type === "CH" && (s.ppm||0) >= 100 && (s.ppm||0) <= 165).length;
                            check("hsqc_Q_veto_arCH_exists", aromaticC === 0 || arCH > 0, `aromaticC=${aromaticC}, arCH=${arCH}`);
                        }
                    }

                    // ── HSQC min crosspeaks ──
                    if (corr && inv.hsqc_min_crosspeaks != null) {
                        const realHsqc = (corr.hsqc || []).filter(x => x.h != null && x.c != null);
                        check("hsqc_min_crosspeaks", realHsqc.length >= inv.hsqc_min_crosspeaks, `hsqc=${realHsqc.length}, min=${inv.hsqc_min_crosspeaks}`);
                    }

                    // ── HSQC O-CH mapping (3-5.6 H ↔ 55-90 C) ──
                    if (corr && inv.hsqc_och_mapping) {
                        const ochHsqc = (corr.hsqc || []).filter(x => x.h != null && x.c != null && x.h >= 3.0 && x.h <= 5.6 && x.c >= 55 && x.c <= 90);
                        check("hsqc_och_mapping", ochHsqc.length >= 2, `och_hsqc=${ochHsqc.length}, min=2`);
                    }

                    // ── COSY min edges ──
                    if (corr && inv.cosy_min_edges != null) {
                        const realCosy = (corr.cosy || []).filter(x => x.h1 != null && x.h2 != null);
                        check("cosy_min_edges", realCosy.length >= inv.cosy_min_edges, `cosy=${realCosy.length}, min=${inv.cosy_min_edges}`);
                    }

                    // ── COSY vinylic pair ──
                    if (corr && inv.cosy_vinylic_pair) {
                        const vinCosy = (corr.cosy || []).filter(x => x.h1 != null && x.h2 != null && x.h1 >= 6.0 && x.h1 <= 7.6 && x.h2 >= 6.0 && x.h2 <= 7.6 && ((x.note||"").includes("vinyl") || (x.assign||"").includes("Vinyl")));
                        check("cosy_vinylic_pair", vinCosy.length >= 1, `vinylic_cosy=${vinCosy.length}`);
                    }

                    // ── COSY aromatic required ──
                    if (corr && inv.cosy_aromatic_required) {
                        const arCosy = (corr.cosy || []).filter(x => x.h1 != null && x.h2 != null && x.h1 >= 6.3 && x.h1 <= 8.2 && x.h2 >= 6.3 && x.h2 <= 8.2);
                        check("cosy_aromatic", arCosy.length >= 1, `aromatic_cosy=${arCosy.length}`);
                    }

                    // ── COSY O-CH network ──
                    if (corr && inv.cosy_och_network) {
                        const ochCosy = (corr.cosy || []).filter(x => x.h1 != null && x.h2 != null && x.h1 >= 3.0 && x.h1 <= 5.6 && x.h2 >= 3.0 && x.h2 <= 5.6);
                        check("cosy_och_network", ochCosy.length >= 1, `och_cosy=${ochCosy.length}`);
                    }

                    // ── HMBC to carbonyl ──
                    if (corr && inv.hmbc_to_carbonyl) {
                        const hmbcCarb = (corr.hmbc || []).filter(x => x.h != null && x.c != null && x.c >= 165 && x.c <= 195);
                        check("hmbc_to_carbonyl", hmbcCarb.length >= 1, `hmbc_carbonyl=${hmbcCarb.length}`);
                    }
                    if (corr && inv.hmbc_carbonyl_min != null) {
                        const hmbcCarb = (corr.hmbc || []).filter(x => x.h != null && x.c != null && x.c >= 160);
                        check("hmbc_carbonyl_min", hmbcCarb.length >= inv.hmbc_carbonyl_min, `hmbc_carbonyl=${hmbcCarb.length}, min=${inv.hmbc_carbonyl_min}`);
                    }

                } catch (e) {
                    tcResult.checks.push({ name: "RUNTIME_ERROR", passed: false, detail: String(e) });
                    tcResult.pass = false;
                }
                results.push(tcResult);
            }

            let report = `\n=== SMOKE TEST RESULTS (${GOLDEN_EXPECTATIONS.version}) ===\n`;
            let allPass = true;
            for (const r of results) {
                const status = r.pass ? "✓ PASS" : "✗ FAIL";
                report += `\n[${status}] ${r.name}\n`;
                for (const c of r.checks) {
                    report += `  ${c.passed ? "✓" : "✗"} ${c.name}: ${c.detail}\n`;
                }
                if (!r.pass) allPass = false;
            }
            report += `\n=== ${allPass ? "ALL TESTS PASSED ✓" : "SOME TESTS FAILED ✗"} ===\n`;
            console.log(report);
            alert(report);
            return results;
        };

                    report.ms.forEach(m => {
                        const lb = String(m.label||"");
                        let calc = null;
                        if (/\[M\+H\]\+|PARENT/i.test(lb)) calc = M+1.007825;
                        else if (/\[M\+Na\]\+/i.test(lb)) calc = M+22.989769;
                        else if (/\[M\+K\]\+/i.test(lb))  calc = M+38.963706;
                        else if (/\[M\-H\]\-/i.test(lb))  calc = M-1.007825;
                        else calc = m.mz;
                        rows.push(new TableRow({ children:[
                            tc((Number(m.mz)||0).toFixed(4), { mono:true, color:"#"+COLORS.tealLight }),
                            tc(calc!=null?calc.toFixed(4):"–", { mono:true }),
                            tc((m.rel||0).toFixed(1), { mono:true }),
                            tc(lb||"–"),
                        ]}));
                    });
                    children.push(new Table({ rows, width:{ size:100, type:WidthType.PERCENTAGE }, columnWidths:[2500,2500,2000,3000] }));
                } else { children.push(new Paragraph({ children:[new TextRun({ text:"Veri yok", size:18, color:"808080" })], spacing:{after:80} })); }
                children.push(spacer());

                // — FT-IR —
                children.push(sectionTitle("FT-IR"));
                if (report.ir?.length) {
                    const rows = [thRow([["cm⁻¹",22],["Şiddet",18],["Atama",60]])];
                    report.ir.forEach(b => rows.push(new TableRow({ children:[
                        tc(String(b.freq||""), { mono:true, color:"#fda4af" }),
                        tc(b.int||"–"),
                        tc(b.assign||"–"),
                    ]})));
                    children.push(new Table({ rows, width:{ size:100, type:WidthType.PERCENTAGE }, columnWidths:[2200,1800,6000] }));
                } else { children.push(new Paragraph({ children:[new TextRun({ text:"Veri yok", size:18, color:"808080" })], spacing:{after:80} })); }
                children.push(spacer());

                // — 2D NMR özeti —
                const corr = report.corr || {};
                const hsqcN = corr.hsqc?.length || 0;
                const cosyN = corr.cosy?.length || 0;
                const hmbcN = corr.hmbc?.length || 0;
                children.push(sectionTitle("2D NMR Korelasyonları (Özet)"));
                children.push(new Paragraph({ children:[
                    new TextRun({ text:`HSQC: ${hsqcN} pik  |  COSY: ${cosyN} çift  |  HMBC: ${hmbcN} çapraz pik`, size:20, font:"Courier New", color:clr("#"+COLORS.tealLight) }),
                ], spacing:{after:80} }));
                if (hsqcN > 0) {
                    children.push(subTitle("HSQC"));
                    const rows = [thRow([["¹H (ppm)",33],["¹³C (ppm)",33],["Atama",34]])];
                    corr.hsqc.slice(0,20).forEach(p => rows.push(new TableRow({ children:[
                        tc((p.h||0).toFixed(2), { mono:true, color:"#"+COLORS.tealLight }),
                        tc((p.c||0).toFixed(1),  { mono:true, color:"#93c5fd" }),
                        tc(p.assign||p.label||"–"),
                    ]})));
                    if (hsqcN > 20) children.push(new Paragraph({ children:[new TextRun({ text:`... ve ${hsqcN-20} pik daha`, size:16, color:"808080" })], spacing:{after:40} }));
                    children.push(new Table({ rows, width:{ size:100, type:WidthType.PERCENTAGE }, columnWidths:[3300,3300,3400] }));
                    children.push(spacer(80));
                }
                if (hmbcN > 0) {
                    children.push(subTitle("HMBC"));
                    const rows = [thRow([["¹H (ppm)",33],["¹³C (ppm)",33],["Bağ",34]])];
                    corr.hmbc.slice(0,20).forEach(p => rows.push(new TableRow({ children:[
                        tc((p.h||0).toFixed(2), { mono:true, color:"#"+COLORS.tealLight }),
                        tc((p.c||0).toFixed(1),  { mono:true, color:"#93c5fd" }),
                        tc(p.assign||p.label||"–"),
                    ]})));
                    if (hmbcN > 20) children.push(new Paragraph({ children:[new TextRun({ text:`... ve ${hmbcN-20} çapraz pik daha`, size:16, color:"808080" })], spacing:{after:40} }));
                    children.push(new Table({ rows, width:{ size:100, type:WidthType.PERCENTAGE }, columnWidths:[3300,3300,3400] }));
                    children.push(spacer(80));
                }
                children.push(spacer());

                // — Teyit raporu —
                children.push(sectionTitle("Teyit / Doğrulama Raporu"));
                children.push(infoRow("Genel Karar",    v.label));
                children.push(infoRow("Güven Skoru",    `${vr?.confidence_score ?? "–"}/100`));
                children.push(infoRow("Durum",          vr?.status || vr?.overall || "–"));
                if (vr?.summary) children.push(infoRow("Özet",  vr.summary));
                if (vr?.recommended_action) children.push(infoRow("Önerilen Aksiyon", vr.recommended_action));

                // veto flags
                if (vr?.veto_flags?.length) {
                    children.push(spacer(80));
                    children.push(subTitle("Veto / Hard Fail"));
                    const rows = [thRow([["Kod",30],["Modalite",15],["Kural",25],["Açıklama",30]])];
                    vr.veto_flags.forEach(f => rows.push(new TableRow({ children:[
                        tc(f.error_code||"–", { mono:true, color:"#ef4444" }),
                        tc(f.modality||"–"),
                        tc(f.rule_name||"–"),
                        tc(f.why||"–"),
                    ]})));
                    children.push(new Table({ rows, width:{ size:100, type:WidthType.PERCENTAGE }, columnWidths:[3000,1500,2500,3000] }));
                    children.push(spacer(80));
                }

                // warnings
                if (vr?.warnings?.length) {
                    children.push(subTitle("Uyarılar"));
                    const rows = [thRow([["Kod",30],["Modalite",15],["Mesaj",55]])];
                    vr.warnings.forEach(w => rows.push(new TableRow({ children:[
                        tc(w.error_code||w.code||"–", { mono:true, color:"#f59e0b" }),
                        tc(w.modality||"–"),
                        tc(w.message||w.why||"–"),
                    ]})));
                    children.push(new Table({ rows, width:{ size:100, type:WidthType.PERCENTAGE }, columnWidths:[3000,1500,5500] }));
                    children.push(spacer(80));
                }

                // root cause analysis
                if (vr?.root_cause_analysis?.length) {
                    children.push(subTitle("Kök Neden Analizi"));
                    const rows = [thRow([["Kod",28],["Mod.",12],["Şiddet",15],["Açıklama",45]])];
                    vr.root_cause_analysis.slice(0,10).forEach(r2 => rows.push(new TableRow({ children:[
                        tc(r2.error_code||"–", { mono:true, color:"#fcd34d" }),
                        tc(r2.modality||"–"),
                        tc(r2.severity||"–"),
                        tc(r2.why||r2.what_failed||"–"),
                    ]})));
                    children.push(new Table({ rows, width:{ size:100, type:WidthType.PERCENTAGE }, columnWidths:[2800,1200,1500,4500] }));
                    children.push(spacer(80));
                }

                // page break between molecules
                if (idx < targetReports.length - 1) {
                    children.push(mkPageBreak());
                }

                sections.push(...children);
            });

            // ── Document ────────────────────────────────────────────────────────
            const doc = new Document({
                creator:       "SpectroMaster Platinum v33.0",
                title:         "Spektroskopik Analiz Raporu",
                description:   `SpectroMaster – ${targetReports.length} molekül, ${dateStr}`,
                styles: {
                    default: {
                        document: {
                            run: { font:"Calibri", size:20, color:clr("#"+COLORS.slate50) },
                        },
                    },
                },
                sections: [{
                    properties: {
                        page: { margin: { top:1080, right:900, bottom:1080, left:900 } }
                    },
                    headers: {
                        default: new Header({ children:[
                            new Paragraph({
                                children:[
                                    new TextRun({ text:"SpectroMaster Platinum v33.0  –  ", bold:true, size:16, color:clr("#"+COLORS.teal), font:"Calibri" }),
                                    new TextRun({ text:dateStr, size:16, color:clr("#"+COLORS.slate200), font:"Calibri" }),
                                ],
                                alignment: AlignmentType.RIGHT,
                                border: { bottom: { style:BorderStyle.SINGLE, size:4, color:COLORS.teal } },
                            }),
                        ]})
                    },
                    children: [
                        // — Document title —
                        new Paragraph({
                            children:[
                                new TextRun({ text:"Spektroskopik Analiz Raporu", bold:true, size:64, color:clr("#"+COLORS.teal), font:"Calibri" }),
                            ],
                            alignment: AlignmentType.CENTER,
                            spacing: { after:160 },
                        }),
                        new Paragraph({
                            children:[
                                new TextRun({ text:`${targetReports.length} molekül  ·  ${dateStr}`, size:22, color:clr("#"+COLORS.slate200), font:"Calibri" }),
                            ],
                            alignment: AlignmentType.CENTER,
                            spacing: { after:60 },
                        }),
                        new Paragraph({
                            children:[
                                new TextRun({ text:"Bu rapor SpectroMaster Platinum motoruyla (¹H/¹³C/2D NMR + MS + FT-IR) otomatik oluşturulmuştur.", size:18, color:clr("#"+COLORS.slate200), font:"Calibri" }),
                            ],
                            alignment: AlignmentType.CENTER,
                            spacing: { after:80 },
                        }),
                        mkPageBreak(),
                        ...sections,
                    ],
                }],
            });

            const blob = await Packer.toBlob(doc);
            const url  = URL.createObjectURL(blob);
            const a    = document.createElement("a");
            a.href     = url;
            a.download = filename || `spectromaster_rapor_${Date.now()}.docx`;
            a.click();
            setTimeout(() => URL.revokeObjectURL(url), 5000);
        };
        // ─── /DOCX EXPORT ───────────────────────────────────────────────────────

        const copyAll = () => {

            const text = reports.map(r => {

                const k = r.kernel;

                const head = k                    ? `ANALYSIS: ${k.counts?.formula || "?"}\nMass: ${k.mass}\nStatus: ${r.qc?.status}\n\n`

                    : `ANALYSIS: (parse yok)\nSMILES: ${r.inputSmiles || "?"}\nStatus: ${r.qc?.status}\n\n`;

                const h1lines = (r.h1 || []).map(s => `${(Number(s.ppm) || 0).toFixed(2)} (${s.mult}, ${s.integ}, J=${s.j})`).join("\n");

                return head + h1lines;

            }).join("\n\n----------------\n\n");

            navigator.clipboard.writeText(text).then(()=>alert("Tüm raporlar kopyalandı!"));

        };

        

        const clearAll = () => setReports([]);



        const runVerificationForReport = (report) => {

            const vr = runVerification({

                kernel: report.kernel,

                h1: report.h1,

                c13: report.c13,

                ms: report.ms,

                ir: report.ir,

                corr: report.corr || {},
                corr_meta: report.corrMeta || {}

            });

            setReports(prev => prev.map(r => r.id === report.id ? { ...r, verificationReport: vr } : r));

        };



        return (

            <div className="min-h-screen p-8 max-w-7xl mx-auto">

                <header className="mb-12 text-center">

                    <div className="inline-block bg-teal-900 text-teal-200 px-4 py-1 rounded-full text-xs font-bold tracking-widest mb-3 border border-teal-700">v33.0 The Great Correction</div>

                    <h1 className="text-5xl font-black text-white mb-2">SpectroMaster <span className="text-teal-400">Platinum</span></h1>

                    <p className="text-slate-400 text-base max-w-2xl mx-auto">Teorik NMR / MS / IR ve teyit motoru — kullanım: aşağıya <span className="text-teal-300 font-semibold">SMILES</span> yazıp analizi başlatın.</p>

                </header>



                <div className="bg-slate-900 p-8 rounded-[2rem] border border-slate-700 mb-12">

                    {isFileProtocol && (

                        <div className="mb-4 p-4 rounded-xl bg-amber-950/60 border border-amber-700/80 text-amber-100 text-sm text-left">

                            <strong className="text-amber-300">file:// ile açtınız:</strong> Uygulama çalışır; harici <code className="text-amber-200 bg-black/30 px-1 rounded">ruleset.json</code> ve isteğe bağlı <code className="text-amber-200 bg-black/30 px-1 rounded">/api/parse_and_standardize</code> için yerel sunucu kullanın (ör. proje kökünde <code className="text-amber-200 bg-black/30 px-1 rounded">npx serve .</code>).

                        </div>

                    )}

                    <div className="mb-4 text-left">

                        <h2 className="text-lg font-bold text-teal-300 mb-1">1. SMILES girin</h2>

                        <p className="text-slate-400 text-sm">Her satıra bir SMILES yazın. Örnek: <code className="text-teal-200/90 bg-slate-950 px-2 py-0.5 rounded font-mono text-xs">CCO</code> (etanol), <code className="text-teal-200/90 bg-slate-950 px-2 py-0.5 rounded font-mono text-xs">c1ccccc1</code> (benzen). Ardından <strong className="text-slate-300">TÜMÜNÜ ANALİZ ET</strong> ile teorik spektrum ve teyit raporu üretilir.</p>

                    </div>

                    <textarea ref={smilesInputRef} id="spectromaster-smiles-input" autoComplete="off" spellCheck="false" aria-label="SMILES girdisi — her satırda bir molekül" value={input} onChange={e=>setInput(e.target.value)} placeholder={"Buraya SMILES yazın…\nÖrnek (çok satır):\nCCO\nc1ccccc1O"} rows={8} className="w-full bg-slate-950 border-2 border-teal-900/50 text-white rounded-xl px-6 py-4 font-mono text-sm focus:border-teal-500 focus:ring-2 focus:ring-teal-500/30 transition-colors outline-none resize-y mb-4 placeholder:text-slate-600" />

                    <div className="flex flex-wrap justify-end gap-3 items-center">

                        <span className="text-slate-500 text-xs mr-auto">{input.trim() ? `${parseMultilineSmilesInput(input.split(/\r?\n/)).length} molekül satırı` : "SMILES bekleniyor"}</span>

                        <button type="button" onClick={analyze} disabled={loading||!input.trim()} className="bg-teal-600 hover:bg-teal-500 text-white font-bold px-10 py-3 rounded-xl transition-all shadow-lg active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">

                            {loading ? <span className="animate-spin-slow inline-block text-2xl">◌</span> : "TÜMÜNÜ ANALİZ ET"}

                        </button>

                    </div>

                    {loading && analyzeProgress && analyzeProgress.total > 0 && (

                        <div className="mt-4 p-4 rounded-xl bg-slate-950 border border-teal-900/60 text-left" aria-live="polite">

                            <div className="text-teal-300 text-sm font-bold mb-2">Analiz ediliyor… {analyzeProgress.done} / {analyzeProgress.total} molekül</div>

                            <div className="h-2 w-full bg-slate-800 rounded-full overflow-hidden">

                                <div className="h-full bg-teal-500 transition-all duration-300" style={{ width: (100 * analyzeProgress.done / analyzeProgress.total) + "%" }} />

                            </div>

                            <p className="text-slate-500 text-xs mt-2">Büyük moleküllerde işlem birkaç saniye sürebilir; tarayıcı sekmesini kapatmayın.</p>

                        </div>

                    )}

                </div>



                {error && <div className="mb-8 p-4 bg-red-900/50 border border-red-500 text-red-200 rounded-xl text-center font-bold">{error}</div>}



                <div className="space-y-20 pb-24">

                    {reports.map((report, idx) => (

                        <div key={report.id} className="fade-in bg-slate-800 border border-slate-700 p-10 rounded-[2.5rem]">

                             <div className="flex justify-between items-start mb-8">

                                 <div>

                                    <div className="text-teal-400 font-mono text-xs mb-2">CONTEXT: {report.kernel?.context || "INVALID_SMILES"}</div>

                                    <h2 className="text-5xl font-black text-white">{report.kernel?.counts?.formula || "—"}</h2>

                                     <div className="mt-1 text-slate-500 font-mono text-xs break-all">SMILES: {report.inputSmiles || report.kernel?.rawSmiles || report.kernel?.smiles || '-'}</div>

                                     <div className="mt-2 text-slate-400 font-mono text-sm">Exact Mass: {(report.kernel?.mass || 0).toFixed(4)} • DBE: {report.kernel?.dbe || 0}</div>

                                 </div>

                                 <div className="text-right flex flex-col items-end gap-3">

                                     <span className={`px-4 py-2 rounded-lg text-sm font-black tracking-wider ${(()=>{const vr=report.verificationReport; const score=vr?.confidence_score??100; const status=vr?.status||vr?.overall; const label=status==='INCONCLUSIVE'?'INCONCLUSIVE':(status==='FAIL'||(vr?.veto_flags?.length)||score<70)?'FAIL':(status==='PARTIAL'||status==='WARN'||(score>=70&&score<90))?'VALIDATED (WARN)':(score>=90?'PASS':'VALIDATED'); return status==='INCONCLUSIVE'?'bg-slate-600 text-slate-200 border border-slate-500':(label==='FAIL'?'bg-red-900 text-red-300 border border-red-700':label==='VALIDATED (WARN)'?'bg-amber-900 text-amber-300 border border-amber-700':'bg-emerald-900 text-emerald-300 border border-emerald-700');})()}`}>{(()=>{const vr=report.verificationReport; const score=vr?.confidence_score??100; const status=vr?.status||vr?.overall; if(status==='INCONCLUSIVE') return 'INCONCLUSIVE'; if(status==='FAIL'||(vr?.veto_flags?.length)||score<70) return 'FAIL'; if(status==='PARTIAL'||status==='WARN'||(score>=70&&score<90)) return 'VALIDATED (WARN)'; return score>=90?'PASS':'VALIDATED';})()}</span>

                                     <button onClick={() => generateAndDownloadDocx([report], `spectromaster_${(report.kernel?.counts?.formula||'mol').replace(/[^A-Za-z0-9]/g,'_')}_${Date.now()}.docx`)} title="Bu molekülü DOCX olarak indir" className="flex items-center gap-1.5 bg-teal-900/60 hover:bg-teal-800 border border-teal-700 text-teal-300 text-xs font-bold px-3 py-1.5 rounded-lg transition-colors">
                                         <svg xmlns="http://www.w3.org/2000/svg" className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                                         DOCX İndir
                                     </button>

                                     {report.qc?.note && <div className="text-xs text-slate-500">{report.qc.note}</div>}

                                     {report.qc?.issues && report.qc.issues.length > 0 && <div className="text-xs text-red-400">{(() => { const iss = report.qc.issues[0]; if (iss == null) return ""; if (typeof iss === "object") return [iss.level, iss.code, iss.message].filter(Boolean).join(" — ") || JSON.stringify(iss); return String(iss); })()}</div>}

                                 </div>

                             </div>



                             <div className="grid grid-cols-1 xl:grid-cols-2 gap-8">

                                 <div>

                                     <h3 className="text-xl font-black text-white mb-4">1H NMR</h3>

                                     <table className="spectral-table"><thead><tr><th>ppm</th><th>Mult</th><th>Int</th><th>J (Hz)</th></tr></thead>

                                     <tbody>{report.h1?.map((s,i)=><tr key={i}><td className="text-teal-400 font-bold">{(s.ppm || 0).toFixed(2)}</td><td>{s.mult || '-'}</td><td className="text-white">{s.integ || '-'}</td><td className="text-slate-500 text-xs">{s.j || '-'}</td></tr>) || <tr><td colSpan="4" className="text-slate-600">No data</td></tr>}</tbody></table>

                                 </div>

                                 <div>

                                     <h3 className="text-xl font-black text-white mb-4">MS Data</h3>

                                     <table className="spectral-table"><thead><tr><th>m/z (Calc)</th><th>m/z (Obs)</th><th>Rel. Int. (%)</th><th>Label</th></tr></thead>

                                     <tbody>{report.ms?.map((m,i)=>{const M=report.kernel?.mass||0; let calcMz=null; const lb=String(m.label||""); if(/\[M\+H\]\+|PARENT/i.test(lb)) calcMz=M+1.007825; else if(/\[M\+Na\]\+/i.test(lb)) calcMz=M+22.989769; else if(/\[M\+K\]\+/i.test(lb)) calcMz=M+38.963706; else if(/\[M\-H\]\-/i.test(lb)) calcMz=M-1.007825; else calcMz=m.mz; const obsMz=Number(m.mz)||0; const isotopeCompanion=/\(\s*13C\s*\)|isotope|M\+1|M\+2|M\+4|Cl isotope|Br isotope/i.test(lb); const ppmErr=(!isotopeCompanion&&calcMz&&obsMz)?Math.abs(obsMz-calcMz)/calcMz*1e6:null; return <tr key={i}><td className="text-slate-400">{calcMz!=null?calcMz.toFixed(4):'-'}</td><td className="text-emerald-400 font-bold">{obsMz.toFixed(4)}</td><td className="text-slate-500">{(m.rel||0).toFixed(1)}</td><td>{m.label||'-'}{isotopeCompanion && <span className="text-cyan-400 text-xs ml-1">(isotope companion)</span>}{ppmErr!=null && ppmErr>10 && <span className="text-red-400 text-xs ml-1">({ppmErr.toFixed(0)} ppm)</span>}</td></tr>}) || <tr><td colSpan="4" className="text-slate-600">No data</td></tr>}</tbody></table>

                                 </div>

                             </div>

                             

                             <div className="grid grid-cols-1 xl:grid-cols-2 gap-8 mt-8">

                                <div>

                                     <h3 className="text-xl font-black text-white mb-4">13C NMR</h3>

                                     <table className="spectral-table"><thead><tr><th>ppm</th><th>Type</th><th>Atama</th></tr></thead>

                                     <tbody>{report.c13?.map((s,i)=><tr key={i}><td className="text-blue-400 font-bold">{(s.ppm || 0).toFixed(1)}</td><td><span className={`tag ${s.type==='Q'?'tag-blue':'tag-pass'}`}>{s.type || '-'}</span></td><td className="text-xs text-slate-300">{s.assign || '-'}</td></tr>) || <tr><td colSpan="3" className="text-slate-600">No data</td></tr>}</tbody></table>

                                </div>

                                <div>

                                     <h3 className="text-xl font-black text-white mb-4">FT-IR</h3>

                                     <table className="spectral-table"><thead><tr><th>cm⁻¹</th><th>Int</th><th>Atama</th></tr></thead>

                                     <tbody>{report.ir?.map((b,i)=><tr key={i}><td className="text-rose-400 font-bold">{typeof b.freq === 'number' ? b.freq : String(b.freq || '')}</td><td>{b.int}</td><td className="text-slate-300">{b.assign}</td></tr>)}</tbody></table>

                                </div>

                             </div>



                            <div className="mt-8 pt-8 border-t border-slate-700">
                                 <h3 className="text-xl font-black text-white mb-4">2D Correlations (Predicted)</h3>
                                 <div className="text-xs text-slate-400 mb-3">
                                    HSQC: {(report.corr?.hsqc?.length || 0)} | COSY: {(report.corr?.cosy?.length || 0)} | HMBC: {(report.corr?.hmbc?.length || 0)} | NOESY: {(report.corr?.noesy?.length || 0)}
                                 </div>
                                 <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                     <div>
                                        <h4 className="text-sm font-bold text-teal-500 mb-2">HSQC</h4>
                                        <table className="spectral-table">
                                          <thead><tr><th>δH (ppm)</th><th>δC (ppm)</th><th>Atama</th></tr></thead>
                                          <tbody>
                                          {(report.corr?.hsqc || []).slice(0, 50).map((c,i)=>{const fb=String(c.assign||"").startsWith("THEORETICAL_FALLBACK_")||c.is_display_only===true||c.derived_from_fallback===true; return <tr key={i}><td className="text-teal-300">{c.h !== null && c.h !== undefined ? Number(c.h).toFixed(2) : '-'}</td><td className="text-cyan-300">{c.c !== null && c.c !== undefined ? Number(c.c).toFixed(1) : 'UNASSIGNED'}</td><td className="text-slate-300">{c.assign || c.note || '-'}{fb && <span className="ml-2 text-[10px] text-amber-400">Display-only / non-authoritative</span>}</td></tr>})}
                                          {(report.corr?.hsqc?.length || 0) === 0 && <tr><td colSpan="3" className="text-slate-500">No HSQC pairs generated</td></tr>}
                                          </tbody>
                                        </table>
                                     </div>
                                     <div>

                                         {report.verificationReport.modules?.noesy && (()=>{ const m = report.verificationReport.modules.noesy; const re = m.rule_engine; const sh = re?.strength_histogram; return (<div className="p-4 rounded-xl bg-slate-800 border border-slate-600"><h4 className="text-sm font-bold text-purple-400 mb-2">NOESY</h4><div className={`text-xs font-bold mb-1 ${m.status === 'PASS' ? 'text-emerald-400' : m.status === 'FAIL' ? 'text-red-400' : 'text-amber-400'}`}>{m.status}</div><div className="text-slate-400 text-xs">Bulunan: {m.found} H–H NOE çapraz pik</div>{re && re.theoretical_pair_count > 0 && <div className="text-xs text-amber-500/90 mt-1">Teorik (NOESY_THEORETICAL): {re.theoretical_pair_count} çift — gerçek spektrumla karşılaştırın</div>}{re && re.roesy_vs_noesy_recommendation && <div className="text-xs text-slate-500 mt-1">NOESY/ROESY önerisi (MW): {re.roesy_vs_noesy_recommendation}</div>}{m.noesy_reason && m.noesy_reason !== 'OK' && <div className="text-xs text-slate-500 mt-1">Durum kodu: {m.noesy_reason}</div>}{re && <div className="text-xs text-slate-500 mt-1">Simetri: {re.symmetry_verified_peaks}/{m.found} (≈%{Math.round((re.symmetry_fraction || 0) * 100)}) | Diagonal: {re.diagonal_peaks} | Spin difüzyon riski: {re.spin_diffusion_risk || '–'}</div>}{re && (re.tau_c_ns_estimate != null || re.regime_label) && <div className="text-xs text-slate-500 mt-1">τc≈{re.tau_c_ns_estimate != null ? Number(re.tau_c_ns_estimate).toFixed(3) : '–'} ns{re.omega_tau_c != null ? ` | ωτc≈${Number(re.omega_tau_c).toFixed(2)}` : ''}{re.regime_label ? ` — ${re.regime_label}` : ''}</div>}{re && re.mixing_time_guidance && Array.isArray(re.mixing_time_guidance.tau_mix_ms_typical) && <div className="text-xs text-slate-500 mt-1">τmix önerisi (MW): {re.mixing_time_guidance.tau_mix_ms_typical[0]}–{re.mixing_time_guidance.tau_mix_ms_typical[1]} ms{re.mixing_time_ms_observed != null ? ` | ölçülen: ${re.mixing_time_ms_observed} ms` : ''}</div>}{sh && (sh.strong + sh.medium + sh.weak + sh.very_weak + sh.other > 0) && <div className="text-xs text-slate-500 mt-1">Şiddet (etiket): güçlü {sh.strong}, orta {sh.medium}, zayıf {sh.weak}, çok zayıf {sh.very_weak}, diğer {sh.other}</div>}{re && (re.t1_noise_suspect_f2_columns > 0 || re.solvent_flagged > 0 || re.duplicate_pair_clusters > 0) && <div className="text-xs text-slate-500 mt-1">Kalite: {re.t1_noise_suspect_f2_columns ? `t₁-sütun şüphe ${re.t1_noise_suspect_f2_columns}` : ''}{re.solvent_flagged ? `${re.t1_noise_suspect_f2_columns ? ', ' : ''}çözücü ${re.solvent_flagged}` : ''}{re.duplicate_pair_clusters ? `${(re.t1_noise_suspect_f2_columns || re.solvent_flagged) ? ', ' : ''}duplike küme ${re.duplicate_pair_clusters}` : ''}</div>}{m.notes?.length > 0 && <div className="mt-2 text-xs text-slate-500">{m.notes.map((n,i)=><div key={i}>{typeof n === "object" && n !== null ? (n.note || JSON.stringify(n)) : String(n)}</div>)}</div>}</div>); })()}

                                         {report.verificationReport.modules?.ms && (()=>{ const m = report.verificationReport.modules.ms; return (<div className="p-4 rounded-xl bg-slate-800 border border-slate-600"><h4 className="text-sm font-bold text-rose-400 mb-2">MS</h4><div className={`text-xs font-bold mb-1 ${m.status === 'PASS' ? 'text-emerald-400' : m.status === 'FAIL' ? 'text-red-400' : 'text-amber-400'}`}>{m.status}</div><div className="text-slate-400 text-xs">Teorik M: {m.theoreticalMass != null ? Number(m.theoreticalMass).toFixed(4) : '–'}{m.ppm_quality && m.ppm_quality !== 'N/A' && <span className="ml-2">| ppm: {m.ppm_quality}{m.best_ppm != null && Number.isFinite(m.best_ppm) ? ` (${Number(m.best_ppm).toFixed(2)})` : ''}{m.ms_lrms ? ' | LRMS' : ''}</span>}</div>{m.matchedAdducts?.length > 0 && <div className="text-emerald-500 text-xs mt-1">Tespit edilen iyonlar: [{m.matchedAdducts.map(a=>a.type).join('], [')}]</div>}{m.notes?.length > 0 && <div className="mt-2 text-xs text-slate-500">{m.notes.map((n,i)=><div key={i}>{typeof n === "object" && n !== null ? (n.note || JSON.stringify(n)) : String(n)}</div>)}</div>}</div>); })()}

                                         {report.verificationReport.modules?.ftir && (()=>{ const m = report.verificationReport.modules.ftir; return (<div className="p-4 rounded-xl bg-slate-800 border border-slate-600"><h4 className="text-sm font-bold text-rose-400 mb-2">FT-IR</h4><div className={`text-xs font-bold mb-1 ${m.status === 'PASS' ? 'text-emerald-400' : m.status === 'FAIL' ? 'text-red-400' : 'text-amber-400'}`}>{m.status}</div>{m.ftir_expected_coverage != null && <div className="text-slate-500 text-xs">Beklenen bant kapsamı: {(m.ftir_expected_coverage * 100).toFixed(0)}%</div>}<div className="text-slate-400 text-xs">Beklenen bantlar: {m.expectedBands?.length ? m.expectedBands.join(', ') : '–'}</div>{m.artifact_notes?.length > 0 && <div className="mt-1 text-xs text-amber-600/90">{m.artifact_notes.map((n,i)=><div key={i}>{typeof n === "object" && n !== null ? (n.note || JSON.stringify(n)) : String(n)}</div>)}</div>}{m.notes?.length > 0 && <div className="mt-2 text-xs text-slate-500">{m.notes.map((n,i)=><div key={i}>{typeof n === "object" && n !== null ? (n.note || JSON.stringify(n)) : String(n)}</div>)}</div>}</div>); })()}

                                     </div>

                                     {report.verificationReport.recommendations?.length > 0 && <div className="mt-4 pt-4 border-t border-slate-600"><h4 className="text-sm font-bold text-slate-400 mb-2">Öneriler</h4><ul className="text-xs text-slate-400 list-disc pl-4">{report.verificationReport.recommendations.map((r,i)=><li key={i}>{typeof r === "object" && r !== null ? (r.message || r.reason || JSON.stringify(r)) : String(r)}</li>)}</ul></div>}

                                 </div>

                             )}

                        </div>

                    ))}

                    {reports.length > 0 && <div className="flex justify-center flex-wrap gap-4">
                        <button onClick={copyAll} className="bg-slate-700 hover:bg-slate-600 text-white px-6 py-3 rounded-xl font-bold transition-colors">TÜMÜNÜ KOPYALA</button>
                        <button onClick={() => generateAndDownloadDocx(reports, `spectromaster_${reports.length}mol_${Date.now()}.docx`)} className="bg-teal-800 hover:bg-teal-700 text-teal-200 border border-teal-600 px-6 py-3 rounded-xl font-bold transition-colors flex items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                            TÜMÜNÜ DOCX İNDİR ({reports.length} molekül)
                        </button>
                        <button onClick={clearAll} className="text-red-500 border border-red-900 px-6 py-3 rounded-xl font-bold hover:bg-red-900/20 transition-colors">TEMİZLE</button>
                    </div>}
                    <div className="flex justify-center mt-4">
                        <button onClick={runSmokeTests} className="bg-purple-900 hover:bg-purple-800 text-purple-200 border border-purple-600 px-6 py-3 rounded-xl font-bold transition-colors flex items-center gap-2" title="Golden expectations smoke testlerini çalıştır (v33 deterministic engine)">
                            <svg xmlns="http://www.w3.org/2000/svg" className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                            RUN SMOKE TESTS (v33 Golden)
                        </button>
                    </div>

                </div>

            </div>

        );

    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    const doRender = () => root.render(<SpectroMasterErrorBoundary><App /></SpectroMasterErrorBoundary>);
    if (typeof requestIdleCallback !== 'undefined') requestIdleCallback(doRender, { timeout: 100 });
    else setTimeout(doRender, 0);

  </script>

</body>

</html>
