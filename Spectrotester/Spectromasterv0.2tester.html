        // ---------- MCA: KnowledgeCheck (Library Coverage Report) – analiz öncesi ----------
        const KNOWN_ATOMS = ["C", "H", "N", "O", "S", "P", "F", "Cl", "Br", "I", "B", "Si"];
        const NON_ATOM_COUNT_KEYS = ["ringClosures", "doubleBonds", "tripleBonds", "explicitH", "aromaticAtoms", "chargeTotal", "halogen", "h_exch", "exchH", "formula"];
        const STRUCTURAL_DESCRIPTOR_LABELS = {
            ringClosures: "Halka kapanış sayısı (SMILES halka indeksleri 1, 2, … ile tanımlı). Element değildir; DBE ve yapı sınıflandırmasında kullanılır. Kütüphane atom listesine dahil edilmez.",

            explicitH: "Açık H sayısı (SMILES’ta yazılan H). Element değildir; formül sayımı ile ilişkilidir.",
            aromaticAtoms: "Aromatik atom sayısı (küçük harf c/n vb.). Element değildir; yapı sınıfı tanımlayıcıdır.",
            chargeTotal: "Toplam yük. Element değildir.",
            halogen: "Toplam halojen sayısı (F+Cl+Br+I). Element değildir; tek tek F, Cl, Br, I sayılır.",

            exchH: "Değişebilir proton (h_exch ile aynı). Element değildir.",
            formula: "Formül string. Element değildir."
        };
        const smilesNorm = (k.smiles || k.rawSmiles || "").trim().replace(/\s+/g, "");

        const fingerprint_match = fpRule ? true : false;
        const unknownAtoms = [];
        const structuralDescriptorsInCounts = [];
        if (k.counts) {
            for (const [el, n] of Object.entries(k.counts)) {
                if (n == null || (typeof n === "number" && n <= 0)) continue;
                if (NON_ATOM_COUNT_KEYS.includes(el)) {
                    structuralDescriptorsInCounts.push({ key: el, description: STRUCTURAL_DESCRIPTOR_LABELS[el] || (el + ": Formül/kernel sayım alanı; element değildir.") });
                } else if (!KNOWN_ATOMS.includes(el)) {
                    unknownAtoms.push(el);
                }
            }
        }
        const authoritative2D = (corr?.hsqc?.length || 0) + (corr?.cosy?.length || 0) + (corr?.hmbc?.length || 0) + (corr?.noesy?.length || 0);
        const fallback2D = (corrFallback?.hsqc?.length || 0) + (corrFallback?.cosy?.length || 0) + (corrFallback?.hmbc?.length || 0) + (corrFallback?.noesy?.length || 0);
        const observedToFallbackRatio = authoritative2D > 0 ? authoritative2D / Math.max(1, fallback2D) : 0;
        const exactFp = fingerprint_match ? 1 : 0;
        const classFingerprintTemplates = [
            { id: "TAXANE_LIKE", hit: (k?.context === "TAXANE") || ((k?.groups?.ester || 0) >= 2 && (k?.groups?.aromaticC || 0) >= 6 && (k?.counts?.C || 0) >= 30) },
            { id: "MACROLIDE_LIKE", hit: (k?.context === "MACROLIDE") || ((k?.groups?.ester || 0) >= 1 && (k?.counts?.O || 0) >= 6 && (k?.counts?.C || 0) >= 20) },
            { id: "STEROID_POLYENE_LIKE", hit: /STEROID|POLYENE/i.test(String(k?.context || "")) || ((k?.dbe || 0) >= 6 && (k?.groups?.alkene || 0) >= 2 && (k?.counts?.C || 0) >= 24) },
            { id: "GLYCOPEPTIDE_LIKE", hit: (k?.context === "GLYCOPEPTIDE") || ((k?.counts?.N || 0) >= 2 && (k?.counts?.O || 0) >= 8 && (k?.groups?.amide || 0) >= 2) }
        ];
        const classFp = classFingerprintTemplates.some(t => t.hit) ? 1 : 0;
        const graphConfidence = graphAvailable ? 1 : 0.35;
        const modalityCompleteness = [h1?.length > 0, c13?.length > 0, ms?.length > 0, ir?.length > 0, authoritative2D > 0].filter(Boolean).length / 5;
        const unknownPenalty = Math.min(0.5, unknownAtoms.length * 0.1);
        const simulation_confidence = Math.max(0.15, Math.min(0.99,
            (0.35 * exactFp) +
            (0.20 * classFp) +

        const library_coverage_report = {
            fingerprint_match,
            fingerprint_name: fpRule?.name || null,
            class_fp_hit: classFp === 1,
            class_fp_templates: classFingerprintTemplates.filter(t => t.hit).map(t => t.id),
            unknown_atoms: unknownAtoms.length ? unknownAtoms : null,
            structural_descriptors_in_counts: structuralDescriptorsInCounts.length ? structuralDescriptorsInCounts : null,
            simulation_confidence: Math.round(simulation_confidence * 100),
            coverage_label,
            extend_library_guide,
            mca_short_explanation: "Meta-Bilişsel Mimari (MCA): Bu molekülün referans kütüphanede (FP_RULES, SMALL_MOLECULE_DB) ne kadar iyi tanımlandığını ve teyit kurallarının ne kadar güvenle uygulanabileceğini özetler.",

            simulation_confidence_explanation: "Güven skoru evidence-weighted hesaplandı (exact FP, class FP, graph confidence, modalite bütünlüğü, authoritative/fallback oranı, unknown atom cezası).",

        const hasCarbonyl = (k.groups?.ester || 0) + (k.groups?.amide || 0) + (k.groups?.ketone || 0) + (k.groups?.aldehyde || 0) + (k.groups?.acid || 0) > 0;

        const hasNitrile = /#N|C#N|C≡N/.test(k.smiles || k.rawSmiles || "");

                else hsqcNotes.push("Tek izole eksik HSQC – düşük SNR veya 1J(CH) uyumsuzluğu olabilir (overlap yumuşatma uygulandı).");

            }

        }

        const HSQC_TOL_H = (cfg.hsqc_ppm_h != null ? cfg.hsqc_ppm_h : 0.2);
        const HSQC_TOL_C_SIG = (cfg.hsqc_ppm_c != null ? cfg.hsqc_ppm_c : 1.0);
        const hsqcLim = HSQC_RULES.shift_limits || { h_ppm: [-2, 15], c_ppm: [-10, 240] };
        const hsqcOutOfLimits = [];
        realHsqc.forEach((p, ix) => {
            const h = Number(p.h), c = Number(p.c);
            if (!Number.isFinite(h) || !Number.isFinite(c)) return;
            if (h < hsqcLim.h_ppm[0] || h > hsqcLim.h_ppm[1] || c < hsqcLim.c_ppm[0] || c > hsqcLim.c_ppm[1]) hsqcOutOfLimits.push({ ix, h, c });
        });
        if (hsqcOutOfLimits.length > 0) hsqcNotes.push(`HSQC kural motoru: ${hsqcOutOfLimits.length} çapraz pik δH/δC fiziksel sınır dışı (referans tablo dışı değer; referans/phasing kontrol edin).`);

        const hsqcDupTol = HSQC_RULES.duplicate_peak || { dH_ppm: 0.03, dC_ppm: 0.5 };
        const hsqcDuplicates = [];
        for (let i = 0; i < realHsqc.length; i++) {
            for (let j = i + 1; j < realHsqc.length; j++) {
                const p1 = realHsqc[i], p2 = realHsqc[j];
                const dH = Math.abs(Number(p1.h) - Number(p2.h));
                const dC = Math.abs(Number(p1.c) - Number(p2.c));
                if (dH < hsqcDupTol.dH_ppm && dC < hsqcDupTol.dC_ppm) hsqcDuplicates.push({ i, j, dH, dC });
            }
        }
        if (hsqcDuplicates.length > 0) hsqcNotes.push(`HSQC: ${hsqcDuplicates.length} olası duplike çapraz pik çifti (ΔδH<${hsqcDupTol.dH_ppm}, ΔδC<${hsqcDupTol.dC_ppm}).`);

        const expSolventHsqc = String(expMeta.solvent || k.config?.solvent || "CDCl3");
        const hsqcSolventRefs = (HSQC_RULES.solvent_hsqc_refs || []).filter(r => !r.solvent || r.solvent === expSolventHsqc || expSolventHsqc.includes(r.solvent) || r.solvent.includes(expSolventHsqc));
        let hsqcSolventFlagged = 0;
        realHsqc.forEach(p => {
            const h = Number(p.h), c = Number(p.c);
            for (const ref of hsqcSolventRefs) {
                if (Math.abs(h - ref.h) <= ref.tol_h && Math.abs(c - ref.c) <= ref.tol_c) { hsqcSolventFlagged++; break; }
            }
        });
        if (hsqcSolventFlagged > 0) hsqcNotes.push(`HSQC: ${hsqcSolventFlagged} çapraz pik çözücü/residual bölgesinde (${expSolventHsqc}); rapordan çıkarılabilir.`);

        const hsqcSigs = HSQC_RULES.chemical_shift_signatures || [];
        const hsqcSignatureHits = hsqcSigs.map(sig => {
            let n = 0;
            realHsqc.forEach(p => {
                const h = Number(p.h), c = Number(p.c);
                if (h >= sig.h[0] && h <= sig.h[1] && c >= sig.c[0] && c <= sig.c[1]) n++;
            });
            return { id: sig.id, label: sig.label, count: n, dept_hint: sig.dept_hint };
        }).filter(x => x.count > 0);

        const hsqcDeptWarnings = [];
        const softDept = HSQC_RULES.dept_soft_checks || [];
        realHsqc.forEach(p => {
            const h = Number(p.h), c = Number(p.c);
            const carb = (c13Signals || []).find(s => s && Number.isFinite(Number(s.ppm)) && Math.abs(Number(s.ppm) - c) <= Math.max(PPM_TOL_C_HSQC, HSQC_TOL_C_SIG));
            if (!carb) return;
            const t = String(carb.type || "").toUpperCase();
            for (const rule of softDept) {
                if (rule.type === "CH3" && t === "CH3" && (h > rule.h_max_aliph || c > rule.c_max_aliph)) {
                    hsqcDeptWarnings.push({ h: h.toFixed(2), c: c.toFixed(1), type: t, note: rule.note }); break;
                }
                if (rule.type === "CH2" && t === "CH2" && (h > rule.h_max_for_aliph || c > rule.c_max_aliph)) {
                    hsqcDeptWarnings.push({ h: h.toFixed(2), c: c.toFixed(1), type: t, note: rule.note }); break;
                }
                if (rule.type === "CH" && t === "CH" && c >= rule.c_min_arom && h < rule.h_arom_low) {
                    hsqcDeptWarnings.push({ h: h.toFixed(2), c: c.toFixed(1), type: t, note: rule.note }); break;
                }
            }
        });
        if (hsqcDeptWarnings.length > 0) hsqcNotes.push(`DEPT/HSQC tutarlılık uyarısı: ${hsqcDeptWarnings.length} pik — tipik δ aralıkları ile 13C multiplet sınıfı çakışmıyor olabilir.`);

        if (hsqcSignatureHits.length > 0) hsqcNotes.push("HSQC imza eşleşmeleri: " + hsqcSignatureHits.map(s => `${s.label}×${s.count}`).join(", ") + ".");
        if (HSQC_RULES.physics_note && realHsqc.length > 0 && C_protonated > 0) hsqcNotes.push(HSQC_RULES.physics_note);

        const hsqcAnnotatedSample = [];
        realHsqc.slice(0, 15).forEach((p, i) => {
            const h = Number(p.h), c = Number(p.c);
            const best = hsqcSigs.map(sig => (h >= sig.h[0] && h <= sig.h[1] && c >= sig.c[0] && c <= sig.c[1] ? sig.id : null)).filter(Boolean);
            hsqcAnnotatedSample.push({ h_ppm: h, c_ppm: c, signature_ids: best });
        });

        const corrHsqc = corr?.hsqc;
        const qInHsqcVerify = findHsqcLinkedToQuaternaryCarbon(corrHsqc, c13ForAnalysis || [], 0.08);
        const probHsqcCh3Verify = findProblematicHsqcCHCh3Mismatches(corrHsqc, h1ForAnalysis || h1, c13ForAnalysis || [], (h) => parseIntegralValue(h?.integ ?? h?.integral));
        const aromaticHsqcVerify = countAromaticHsqcCorrelations(corrHsqc, h1ForAnalysis || h1, c13ForAnalysis || [], null);
        if (qInHsqcVerify.length > 0) {
            hsqcNotes.push(`HSQC (BLOK H2): ${qInHsqcVerify.length} çapraz pik Q/Cq ¹³C ile eşleşiyor (audit ile aynı veto).`);
            if (hsqcStatus === "PASS") hsqcStatus = "FAIL";
        }
        if (probHsqcCh3Verify.length > 0) {
            hsqcNotes.push(`HSQC (BLOK H3): ${probHsqcCh3Verify.length} tip uyumsuzluğu (¹H metil ↔ ¹³C CH/CH2).`);
            if (hsqcStatus === "PASS") hsqcStatus = "WARN";
        }

        modules.hsqc = {
            status: hsqcStatus,
            expectedProtonatedC: C_protonated,
            expectedCorrelationCount: hsqcCovVerify.expectedCorrelationCount,
            ratioHsqcToExpectedC: hsqcCovVerify.ratioHsqcToExpectedC,
            assignedPairsCount: hsqcCovVerify.assignedPairsCount,
            nonExchPeakCount: hsqcCovVerify.nonExchPeakCount,
            assignedRatioToNonExchPeaks: hsqcCovVerify.assignedRatioToNonExchPeaks,
            found: hsqcFound,
            notes: hsqcNotes,
            missing_correlations: hsqcMissing.length ? hsqcMissing.slice(0, 10) : null,
            severity_grading: hsqcMissing.map(m => ({ c_ppm: m.c_ppm, type: m.type, severity: m.severity, HSQC_LOSS_CAUSE: m.causeDesc })),
            rule_engine: {
                solvent: expSolventHsqc,
                duplicate_pairs: hsqcDuplicates.length,
                solvent_flagged: hsqcSolventFlagged,
                shift_out_of_range: hsqcOutOfLimits.length,
                signatures_matched: hsqcSignatureHits,
                dept_soft_warnings: hsqcDeptWarnings.slice(0, 8),
                annotated_sample: hsqcAnnotatedSample,
                tolerances: { h_ppm: HSQC_TOL_H, c_ppm: HSQC_TOL_C_SIG },
                q_carbon_in_hsqc: qInHsqcVerify.length,
                ch_ch3_mismatch_hsqc: probHsqcCh3Verify.length,
                aromatic_hsqc_crosspeaks: aromaticHsqcVerify
            }
        };



        // ========== 2D COSY (NMR_ANALYSIS_RULES: COSY_EXPECTATION, geminal/aromatic) ==========

        const realCosy = (corr.cosy || []).filter(x => x.h1 != null && x.h2 != null && x.assign !== "NO_COSY_ELIGIBLE_PROTONS");

        const cosyFound = realCosy.length;

        const COSY_RULES = typeof NMR_ANALYSIS_RULES !== "undefined" && NMR_ANALYSIS_RULES.COSY ? NMR_ANALYSIS_RULES.COSY : { COSY_EXPECTATION: [] };

        const nonExchH1 = (h1ForAnalysis || h1 || []).filter(h => !/br|broad|exch|OH|NH/i.test(String(h.mult || "")));

        const anyCoupledProtons = nonExchH1.some(h => { const m = String(h.mult || "").toLowerCase(); return m && m !== "s" && m !== "singlet"; });

        const allProtonsSinglet = nonExchH1.length > 0 && !anyCoupledProtons;

        const cosyExpectationValid = COSY_RULES.COSY_EXPECTATION?.find(e => e.condition === "all_protons_singlet");

        const cosyExpectationRequired = COSY_RULES.COSY_EXPECTATION?.find(e => e.condition === "has_couplings");

        const expectedCOSYPairsMin = expectations.expectedCOSYPairsMin != null ? expectations.expectedCOSYPairsMin : 0;
        const cosyPairMinRatio = (cfg.cosy_expected_pair_min_ratio != null ? cfg.cosy_expected_pair_min_ratio : 0.5);
        const cosyPairsBelowBaseline = expectedCOSYPairsMin > 0 && cosyFound < expectedCOSYPairsMin && !allProtonsSinglet;

        let cosyStatus = "PASS";

        const cosyNotes = [];

        if (cosyFound >= 1) cosyNotes.push("COSY korelasyonları mevcut.");

        if (expectedCOSYPairsMin > 0 && !allProtonsSinglet) cosyNotes.push("Vicinal çift baseline (yapı/heuristik): en az " + expectedCOSYPairsMin + " çapraz pik; bulunan: " + cosyFound + ".");

        if (cosyPairsBelowBaseline && cosyFound > 0) {
            if (cosyFound / expectedCOSYPairsMin < cosyPairMinRatio) cosyStatus = "WARN";
            cosyNotes.push("COSY vicinal çift sayısı baseline altında; SNR/örtüşme veya deney ayarı kontrol edilmeli.");
        }

        else if (cosyFound === 0) {

            if (allProtonsSinglet && nonExchH1.length > 0) {

                cosyNotes.push("COSY_EXPECTATION: Tüm protonlar singlet – çapraz pik beklenmez (geçerli). " + (cosyExpectationValid?.rationale || "No COSY cross-peaks expected when all signals are singlets."));

            } else if (anyCoupledProtons) {

                cosyStatus = "WARN";

                cosyNotes.push("COSY boş; ¹H’de çoklu multiplet (d, t, q vb.) var – komşu protonlar için COSY korelasyonu beklenir. " + (cosyExpectationRequired?.rationale || "Eksik veri veya deney ayarı kontrol edilmeli."));

                if ((k.groups?.aromaticC || 0) >= 6) cosyNotes.push("Aromatik: ortho çiftler için COSY (J ~7–9 Hz) beklenir; meta zayıf/opsiyonel. " + (COSY_RULES.aromatic_patterns?.monosubstituted_benzene?.note || ""));

                if (COSY_RULES.geminal_coupling?.require_CH2_crosspeak) cosyNotes.push("Geminal: CH₂’de iki ayrı proton sinyali varsa COSY’de geminal çapraz pik beklenir.");

            } else if (H_expected_ref >= 3 && (k.groups?.aromaticC || 0) + (k.groups?.alkene || 0) > 0) {

                cosyStatus = "WARN";

                cosyNotes.push("COSY boş; komşu protonlar bekleniyor.");

            }

        }

        modules.cosy = { status: cosyStatus, found: cosyFound, notes: cosyNotes, all_protons_singlet: allProtonsSinglet, COSY_EXPECTATION: allProtonsSinglet ? "VALID" : (anyCoupledProtons ? "REQUIRED" : null), expectedCOSYPairsMin, cosyPairsBelowBaseline };
        logRule("COSY", "END", { cosyFound, anyCoupledProtons, expectedCOSYPairsMin }, { status: cosyStatus });



        // ========== 2D HMBC (NMR_ANALYSIS_RULES: functional_group_rules, 2J/3J, invisibility_causes) ==========

        const realHmbc = (corr.hmbc || []).filter(x => x.h_ppm != null && x.c_ppm != null && x.assign !== "NO_HMBC_GENERATED");

        const hmbcFound = realHmbc.length;

        const HMBC_RULES = typeof NMR_ANALYSIS_RULES !== "undefined" && NMR_ANALYSIS_RULES.HMBC ? NMR_ANALYSIS_RULES.HMBC : { required_functional_groups: [], optional_functional_groups: [], invisibility_causes: [] };

        const hmbcCtol = (cfg.hmbc_ppm_c != null ? cfg.hmbc_ppm_c : 0.5);
        const findDeptTypeForC = (cppm) => {
            const hit = (c13Signals || []).find(s => s && Number.isFinite(Number(s.ppm)) && Math.abs(Number(s.ppm) - cppm) <= Math.max(hmbcCtol, 0.35));
            if (!hit) return "UNKNOWN";
            return String(hit.type || "").toUpperCase() || "UNKNOWN";
        };
        const classifyHmbcBondHeuristic = (h, c) => {
            const deptOnC = findDeptTypeForC(c);
            if (h >= 9.0 && h <= 10.5 && c >= 185 && c <= 210) return { bond_class: "2J", code: "aldehyde_H_to_formyl_C" };
            if (h >= 3.25 && h <= 3.55 && c >= 50 && c <= 57) return { bond_class: "2J", code: "methoxy_to_OMe_C" };
            if (h >= 3.25 && h <= 3.55 && ((c >= 110 && c <= 160) || (c >= 155 && c <= 175))) return { bond_class: "3J", code: "methoxy_to_ar_or_CO_path" };
            if (h >= 6.5 && h <= 8.5 && c >= 110 && c <= 155) {
                if (deptOnC === "C" || /Q|Cq|QUAT/i.test(deptOnC)) return { bond_class: "3J", code: "ArH_to_quat_ArC" };
                return { bond_class: "AMBIGUOUS", code: "ArH_to_ArCH" };
            }
            if (c >= 160 && c <= 220) {
                if (h >= 1.8 && h <= 2.8) return { bond_class: "3J", code: "alpha_CH2CH3_to_CO" };
                if (h >= 6.5 && h <= 8.5) return { bond_class: "3J", code: "ArH_to_CO" };
                return { bond_class: "AMBIGUOUS", code: "H_to_carbonyl_generik" };
            }
            if (h >= 0 && h <= 4.5 && c >= 0 && c <= 90) return { bond_class: "AMBIGUOUS", code: "aliphatic_aliphatic" };
            return { bond_class: "AMBIGUOUS", code: "genel" };
        };

        const dupTol = HMBC_RULES.duplicate_peak || { dH_ppm: 0.03, dC_ppm: 0.5 };
        const hmbcDuplicates = [];
        for (let i = 0; i < realHmbc.length; i++) {
            for (let j = i + 1; j < realHmbc.length; j++) {
                const p1 = realHmbc[i], p2 = realHmbc[j];
                const dH = Math.abs(Number(p1.h_ppm) - Number(p2.h_ppm));
                const dC = Math.abs(Number(p1.c_ppm) - Number(p2.c_ppm));
                if (dH < dupTol.dH_ppm && dC < dupTol.dC_ppm) hmbcDuplicates.push({ i, j, dH, dC });
            }
        }

        const expSolvent = String(expMeta.solvent || k.config?.solvent || "CDCl3");
        const solventRefs = (HMBC_RULES.solvent_hmbc_refs || []).filter(r => !r.solvent || r.solvent === expSolvent || expSolvent.includes(r.solvent) || r.solvent.includes(expSolvent));
        const solventCrosspeaks = [];
        realHmbc.forEach((p, idx) => {
            const h = Number(p.h_ppm), c = Number(p.c_ppm);
            for (const ref of solventRefs) {
                if (Math.abs(h - ref.h) <= ref.tol_h && Math.abs(c - ref.c) <= ref.tol_c) {
                    solventCrosspeaks.push({ idx, h, c, ref: ref.solvent || "solvent" });
                    break;
                }
            }
        });

        const bondHist = { "2J": 0, "3J": 0, "4J": 0, AMBIGUOUS: 0 };
        const annotatedHmbcSample = [];
        realHmbc.forEach((p, i) => {
            const h = Number(p.h_ppm), c = Number(p.c_ppm);
            const cl = classifyHmbcBondHeuristic(h, c);
            const key = cl.bond_class === "2J" ? "2J" : cl.bond_class === "3J" ? "3J" : cl.bond_class === "4J" ? "4J" : "AMBIGUOUS";
            bondHist[key] = (bondHist[key] || 0) + 1;
            if (i < 12) annotatedHmbcSample.push({ h_ppm: h, c_ppm: c, bond_class: key, rule_code: cl.code });
        });

        const sigPatterns = HMBC_RULES.signature_patterns || [];
        const signatureHits = sigPatterns.map(sp => {
            let n = 0;
            realHmbc.forEach(p => {
                const h = Number(p.h_ppm), c = Number(p.c_ppm);
                if (h >= sp.h[0] && h <= sp.h[1] && c >= sp.c[0] && c <= sp.c[1]) n++;
            });
            return { id: sp.id, label: sp.label, count: n, bond_hint: sp.bond_hint };
        }).filter(x => x.count > 0);

        const t1cfg = HMBC_RULES.t1_noise_ridge || { min_peaks_same_c: 5, intensity_frac: 0.1, c_bin_ppm: 0.5 };
        const cBin = t1cfg.c_bin_ppm || 0.5;
        const byC = {};
        realHmbc.forEach(p => {
            const c = Number(p.c_ppm);
            const k0 = Math.round(c / cBin) * cBin;
            if (!byC[k0]) byC[k0] = [];
            byC[k0].push(p);
        });
        let t1NoiseSuspect = 0;
        Object.values(byC).forEach(group => {
            if (group.length < (t1cfg.min_peaks_same_c || 5)) return;
            const intens = group.map(x => Number(x.intensity != null ? x.intensity : x.strength === "strong" ? 1 : x.strength === "medium" ? 0.5 : 0.2) || 0.35);
            const mx = Math.max(...intens, 1e-6);
            const weak = group.filter((_, gi) => intens[gi] < mx * (t1cfg.intensity_frac || 0.1));
            if (weak.length >= 4) t1NoiseSuspect += weak.length;
        });

        const hmbcToCarbonyl = realHmbc.filter(p => (p.c_ppm || p.c) >= 160 && (p.c_ppm || p.c) <= 220);

        const hasRequiredCarbonyl = (k.groups?.ester || 0) + (k.groups?.ketone || 0) + (k.groups?.amide || 0) > 0;
        const hasAlphaHForCarbonyl = expectations.hasAlphaHForCarbonyl !== false;
        const hmbcOptionalIfNoAlphaH = (cfg.hmbc_optional_if_no_alpha_H !== false && cfg.hmbc_carbonyl_required_only_if_path_exists);
        const hasRequiredCarbonylEffective = hasRequiredCarbonyl && (hmbcOptionalIfNoAlphaH ? hasAlphaHForCarbonyl : true);

        const hasOptionalNitrile = hasNitrile;

        const hasQuaternaryAromaticC = c13Signals.some(s => (s.ppm||0) >= 115 && (s.ppm||0) <= 160 && /Q|Cq|quaternary/i.test(String(s.type||"")));
        const expectsHmbc = hasCarbonyl || hasNitrile || hasQuaternaryAromaticC;

        const invisibilityCauses = HMBC_RULES.invisibility_causes || ["Yakın proton yok (3 bağ içinde)", "J≈0 (geometri/hibritleşme)", "Geniş/değişebilir proton – relaksasyon", "Kuplaj penceresi dışı"];

        let hmbcStatus = "PASS";

        const hmbcNotes = [];

        if (hasRequiredCarbonylEffective && hmbcToCarbonyl.length === 0) {

            hmbcStatus = "WARN";

            const reqRule = HMBC_RULES.functional_group_rules?.find(r => r.group === "ester_C=O" || r.group === "ketone_C=O" || r.group === "amide_C=O") || HMBC_RULES.required_functional_groups?.find(r => r.group === "ester_carbonyl" || r.group === "ketone_carbonyl");

            const rationale = reqRule?.rationale || "Ester/keton/amid C=O için 2J/3J HMBC beklenir (alpha-H path gating: alpha H yoksa zorunlu değil).";

            hmbcNotes.push("Karbonil (ester/keton/amid) için HMBC korelasyonu bekleniyordu; 160–220 ppm bölgesinde H→C korelasyonu yok. " + rationale);

            hmbcNotes.push("2J (α-proton) korelasyonu öncelikli; eksikse ciddi uyarı. Olası nedenler: " + (invisibilityCauses.slice(0, 2).join("; ") || "yakın proton yok veya J≈0."));

        } else if (hasRequiredCarbonyl && !hasAlphaHForCarbonyl && hmbcToCarbonyl.length === 0) {

            hmbcNotes.push("Karbonil (sadece asit COOH) mevcut; alpha C–H yok. HMBC karbonil korelasyonu zorunlu değil (alpha-H path gating).");

        } else if (expectsHmbc && hmbcFound === 0 && !hasRequiredCarbonylEffective) {

            if (!hasOptionalNitrile) hmbcStatus = "WARN";

            hmbcNotes.push("Karbonil/aromatik için HMBC korelasyonu bekleniyordu.");

        }

        if (hasOptionalNitrile && hmbcFound === 0) {

            const nitrileRule = HMBC_RULES.functional_group_rules?.find(r => r.group === "nitrile_C#N") || HMBC_RULES.optional_functional_groups?.find(r => r.group === "nitrile");

            hmbcNotes.push("Nitril (C≡N): HMBC opsiyonel – 2J/3J çok zayıf; yoksa cezalandırılmaz. " + (nitrileRule?.rationale || "HMBC absence acceptable."));

        }

        if (hmbcFound >= 1 && expectsHmbc) hmbcNotes.push("Uzun menzil H–C korelasyonları gözlenmiş (2J/3J).");

        if (hmbcDuplicates.length > 0) hmbcNotes.push(`Kural motoru: ${hmbcDuplicates.length} olası duplike çapraz pik çifti (ΔδH<${dupTol.dH_ppm}, ΔδC<${dupTol.dC_ppm} ppm); örtüşme veya tekrarlı pik seçimi kontrol edin.`);
        if (solventCrosspeaks.length > 0) hmbcNotes.push(`Çözücü/residual bölgesine düşen ${solventCrosspeaks.length} HMBC çapraz pik (${expSolvent}); analizden çıkarılabilir.`);
        if (t1NoiseSuspect > 0) hmbcNotes.push(`t1-noise ridge uyarısı: aynı δC bandında çok sayıda zayıf çapraz pik (~${t1NoiseSuspect} şüpheli); yoğun 13C t1 artefaktı olası.`);
        if (signatureHits.length > 0) hmbcNotes.push("İmza desenleri: " + signatureHits.map(s => `${s.label}×${s.count}`).join(", ") + ".");
        if ((k.groups?.ether || 0) > 0 && HMBC_RULES.oxygen_bridge_note && hmbcFound > 0) hmbcNotes.push("O-köprü: " + HMBC_RULES.oxygen_bridge_note);

        const diagRules = HMBC_RULES.correlation_diagnostic_rules || [];
        const fgDiagnosticHits = diagRules.map(rule => {
            let n = 0;
            realHmbc.forEach(p => {
                const h = Number(p.h_ppm), c = Number(p.c_ppm);
                if (!Number.isFinite(h) || !Number.isFinite(c)) return;
                if (h >= rule.h[0] && h <= rule.h[1] && c >= rule.c[0] && c <= rule.c[1]) n++;
            });
            return { id: rule.id, label: rule.label, count: n };
        }).filter(x => x.count > 0);

        const hmbcCTolQuat = hmbcCtol;
        const hsqcHasCForHmbc = (cppm) => realHsqc.some(p => Math.abs(Number(p.c) - cppm) <= hmbcCTolQuat);
        const quaternaryHints = [];
        const seenHmbcC = new Set();
        realHmbc.forEach(p => {
            const c = Number(p.c_ppm);
            if (!Number.isFinite(c)) return;
            if (hsqcHasCForHmbc(c)) return;
            const key = Math.round(c * 10) / 10;
            if (seenHmbcC.has(key)) return;
            seenHmbcC.add(key);
            if (c >= 155 || (c >= 100 && c <= 158)) quaternaryHints.push(key);
        });

        const uniqHmbcH = [...new Set(realHmbc.map(p => Number(p.h_ppm)).filter(x => Number.isFinite(x)))];
        let hAnchoredToHsqc = 0;
        for (const hh of uniqHmbcH) {
            if (realHsqc.some(p => Math.abs(Number(p.h) - hh) <= HSQC_TOL_H)) hAnchoredToHsqc++;
        }
        const hsqcProtonAnchorFraction = uniqHmbcH.length ? Math.round((hAnchoredToHsqc / uniqHmbcH.length) * 1000) / 1000 : null;

        if (fgDiagnosticHits.length > 0) hmbcNotes.push("HMBC tanı kuralları (heuristik): " + fgDiagnosticHits.map(s => `${s.label}×${s.count}`).join(", ") + ".");
        if (quaternaryHints.length > 0) hmbcNotes.push(`HSQC’de δC karşılığı olmayan HMBC hedefleri (kuaterner / ipso karbon adayı): ${quaternaryHints.slice(0, 8).map(c => c.toFixed(1)).join(", ")}${quaternaryHints.length > 8 ? " …" : ""} ppm.`);
        if (hsqcProtonAnchorFraction != null && hmbcFound >= 3 && hsqcProtonAnchorFraction < 0.45) hmbcNotes.push("2D entegrasyon: HMBC’deki çoğu proton δH’ı HSQC ile zayıf eşleşiyor; tolerans veya artefakt ihtimali.");

        let hmbcJ3Fraction = null;
        const j23 = (bondHist["2J"] || 0) + (bondHist["3J"] || 0);
        if (j23 > 0) hmbcJ3Fraction = Math.round(((bondHist["3J"] || 0) / j23) * 1000) / 1000;

        modules.hmbc = {
            status: hmbcStatus,
            expectedFunctionalGroups: hasCarbonyl ? ["C=O"] : (hasNitrile ? ["C≡N"] : []),
            found: hmbcFound,
            notes: hmbcNotes,
            carbonyl_hmbc_count: hmbcToCarbonyl.length,
            required_groups: hasRequiredCarbonylEffective ? ["ester_carbonyl", "ketone_carbonyl", "amide_carbonyl"] : [],
            optional_groups: hasOptionalNitrile ? ["nitrile"] : [],
            hasAlphaHForCarbonyl,
            two_bond_priority: HMBC_RULES.two_bond_vs_three_bond?.prioritize_two_bond !== false,
            invisibility_causes: invisibilityCauses,
            rule_engine: {
                solvent: expSolvent,
                duplicate_pairs: hmbcDuplicates.length,
                solvent_flagged: solventCrosspeaks.length,
                bond_histogram: bondHist,
                j3_fraction_of_2j3j: hmbcJ3Fraction,
                signatures_matched: signatureHits,
                fg_diagnostic_hits: fgDiagnosticHits,
                quaternary_c_hints_ppm: quaternaryHints.slice(0, 20),
                hsqc_proton_anchor_fraction: hsqcProtonAnchorFraction,
                t1_noise_suspect_peaks: t1NoiseSuspect,
                annotated_sample: annotatedHmbcSample
            }
        };
        logRule("HMBC", "END", { hmbcFound, hasRequiredCarbonylEffective, hasAlphaHForCarbonyl }, { status: hmbcStatus });

        if (modules.hsqc && modules.hsqc.rule_engine && modules.hmbc?.rule_engine) {
            modules.hsqc.rule_engine.hmbc_cross_ref = {
                hsqc_proton_anchor_fraction: modules.hmbc.rule_engine.hsqc_proton_anchor_fraction,
                quaternary_c_hints_ppm: (modules.hmbc.rule_engine.quaternary_c_hints_ppm || []).slice(0, 6),
                fg_diagnostic_hits: modules.hmbc.rule_engine.fg_diagnostic_hits || [],
                j3_fraction_of_2j3j: modules.hmbc.rule_engine.j3_fraction_of_2j3j
            };
        }

        // ========== Aromatic System Analysis (NMR_ANALYSIS_RULES.AromaticSystem substitution_patterns) ==========

        const AROMATIC_RULES = typeof NMR_ANALYSIS_RULES !== "undefined" && NMR_ANALYSIS_RULES.AromaticSystem ? NMR_ANALYSIS_RULES.AromaticSystem : { substitution_patterns: {} };

        const aromaticH1Signals = (h1ForAnalysis || h1 || []).filter(s => (s.ppm || 0) >= 6 && (s.ppm || 0) <= 9);

        const aromaticH1Integral = aromaticH1Signals.reduce((sum, s) => sum + parseIntegralValue(s.integ), 0);

        const uniqueAromaticPpm = new Set(aromaticH1Signals.map(s => Math.round((s.ppm || 0) * 100) / 100));

        const observedUniqueAromatic = uniqueAromaticPpm.size;

        const aromaticC_count = k.groups?.aromaticC || 0;

        let inferredPattern = null;

        let expectedUniqueMin = 0, expectedUniqueMax = 0;

        if (aromaticC_count >= 6 && aromaticH1Integral > 0) {
            const patterns = AROMATIC_RULES.substitution_patterns || {};
            const arRings = k.molGraph?.aromaticRings || [];
            const dominantSub = arRings.length > 0
                ? Math.round(arRings.reduce((s, r) => s + Number(r.substitutionCount || 0), 0) / arRings.length)
                : null;

            if (dominantSub !== null) {
                if (dominantSub <= 1) { inferredPattern = "monosubstituted_benzene"; const p = patterns.monosubstituted_benzene; expectedUniqueMin = p?.unique_proton_signals ?? 3; expectedUniqueMax = 5; }
                else if (dominantSub === 2) { inferredPattern = "disubstituted_benzene"; expectedUniqueMin = 2; expectedUniqueMax = 4; }
                else if (dominantSub === 3) { inferredPattern = "trisubstituted_benzene"; expectedUniqueMin = 2; expectedUniqueMax = 3; }
                else if (dominantSub === 4) { inferredPattern = "tetrasubstituted_benzene"; expectedUniqueMin = 1; expectedUniqueMax = 2; }
                else { inferredPattern = "polysubstituted_aromatic"; expectedUniqueMin = 1; expectedUniqueMax = Math.max(1, observedUniqueAromatic); }
            } else {
                if (aromaticH1Integral >= 5) { inferredPattern = "monosubstituted_benzene"; const p = patterns.monosubstituted_benzene; expectedUniqueMin = p?.unique_proton_signals ?? 3; expectedUniqueMax = 5; }
                else if (aromaticH1Integral >= 4) { inferredPattern = "disubstituted_benzene"; expectedUniqueMin = 2; expectedUniqueMax = 4; }
                else if (aromaticH1Integral >= 3) { inferredPattern = "trisubstituted_benzene"; expectedUniqueMin = 2; expectedUniqueMax = 3; }
                else if (aromaticH1Integral >= 2) { inferredPattern = "tetrasubstituted_benzene"; expectedUniqueMin = 1; expectedUniqueMax = 2; }
            }
        }

        const aromaticPatternMatch = inferredPattern && observedUniqueAromatic >= expectedUniqueMin && observedUniqueAromatic <= (expectedUniqueMax || 10);

        const aromatic_analysis = aromaticC_count > 0 ? {

            aromatic_H_integral: aromaticH1Integral,

            aromatic_H_signal_count: aromaticH1Signals.length,

            unique_aromatic_signals: observedUniqueAromatic,

            inferred_pattern: inferredPattern,

            expected_unique_range: inferredPattern ? [expectedUniqueMin, expectedUniqueMax] : null,

            pattern_match: aromaticPatternMatch,

            status: !inferredPattern ? "N/A" : (aromaticPatternMatch ? "PASS" : (observedUniqueAromatic < expectedUniqueMin ? "WARN" : "PASS")),

            note: inferredPattern && !aromaticPatternMatch ? `Aromatik desen: ${inferredPattern} için genelde ${expectedUniqueMin}–${expectedUniqueMax} benzersiz sinyal beklenir; gözlenen: ${observedUniqueAromatic}. Simetri veya örtüşme olası.` : (inferredPattern ? "Aromatik proton sayısı ve benzersiz sinyal sayısı beklenen aralıkla uyumlu." : null),
            ring_substitution_avg: (k.molGraph?.aromaticRings || []).length > 0
              ? (k.molGraph.aromaticRings.reduce((s, r) => s + Number(r.substitutionCount || 0), 0) / k.molGraph.aromaticRings.length)
              : null

        } : null;

        if (aromatic_analysis?.note && modules.h1?.notes) modules.h1.notes.push(aromatic_analysis.note);

        modules.aromatic = aromatic_analysis;

        // ========== 2D NOESY (kural motoru: simetri, diagonal, artefakt heuristikleri, τmix / spin difüzyon) ==========

        const noesyRaw = corr.noesy || [];
        const realNoesy = noesyRaw.filter(x => x.h1_ppm != null && x.h2_ppm != null && x.assign !== "NOESY_SKIPPED_CONTEXT" && x.assign !== "NOESY_EMPTY");

        let noesyStatus = "PASS";
        let noesyReason = null;
        const noesyNotes = [];
        const NR = (NMR_ANALYSIS_RULES && NMR_ANALYSIS_RULES.NOESY) ? NMR_ANALYSIS_RULES.NOESY : {};
        const symTol = Number(cfg.noesy_symmetry_ppm ?? NR.symmetry_ppm_tol ?? 0.04);
        const diagTol = Number(cfg.noesy_diagonal_ppm ?? NR.diagonal_ppm_tol ?? 0.05);
        const diagProxPpm = Number(NR.diagonal_proximity_ppm ?? 0.15);
        const intRange = Array.isArray(NR.symmetry_intensity_ratio) ? NR.symmetry_intensity_ratio : [0.2, 5.0];
        const dupDh = Number(NR.duplicate_pair_dh_ppm ?? 0.03);
        const labile = Array.isArray(NR.exchange_labile_h_ppm) ? NR.exchange_labile_h_ppm : [4.0, 10.5];
        const noesyT1NoiseCfg = NR.t1_noise || {};
        const f2Bin = Number(noesyT1NoiseCfg.f2_bin_ppm ?? 0.03);
        const t1MinCol = Number(noesyT1NoiseCfg.min_peaks_in_column ?? 4);
        const t1IntFrac = Number(noesyT1NoiseCfg.intensity_frac ?? 0.12);
        const noesyPeakInt = (p) => {
            const v = Number(p.intensity);
            if (Number.isFinite(v) && v !== 0) return Math.abs(v);
            const s = String(p.strength || "").toLowerCase();
            if (s.includes("very") && s.includes("weak")) return 0.08;
            if (s.includes("strong")) return 1;
            if (s.includes("medium")) return 0.45;
            if (s.includes("weak")) return 0.18;
            return 0.25;
        };
        const noesySymmetryPartner = (p, list) => {
            const h1 = Number(p.h1_ppm), h2 = Number(p.h2_ppm);
            const ip = noesyPeakInt(p);
            for (const q of list) {
                if (q === p) continue;
                if (Math.abs(Number(q.h1_ppm) - h2) > symTol) continue;
                if (Math.abs(Number(q.h2_ppm) - h1) > symTol) continue;
                const iq = noesyPeakInt(q);
                if (ip > 1e-12 && iq > 1e-12) {
                    const r = ip / iq;
                    if (r >= intRange[0] && r <= intRange[1]) return true;
                } else return true;
            }
            return false;
        };

        if (noesyRaw.length === 0) noesyReason = "NOT_PROVIDED", noesyNotes.push("NOESY verisi sağlanmadı.");
        else if (noesyRaw.some(x => x.assign === "NOESY_SKIPPED_CONTEXT")) {
            noesyReason = (k.context === "MACROLIDE" || k.context === "GLYCOPEPTIDE") ? "NOT_PROVIDED" : "NOT_EXPECTED_FOR_CONTEXT";
            noesyStatus = (k.context === "MACROLIDE" || k.context === "GLYCOPEPTIDE") ? "WARN" : "PASS";
            noesyNotes.push(noesyReason === "NOT_EXPECTED_FOR_CONTEXT" ? "NOESY bu molekül tipi için beklenmiyor (SMALL_MOLECULE/GENERAL)." : "NOESY bu molekül için doğrulama dışı bırakıldı.");
        } else if (realNoesy.length > 0) {
            noesyReason = "OK";
            noesyNotes.push("NOESY korelasyonları mevcut.");
        } else if (noesyRaw.some(x => x.assign === "NOESY_EMPTY")) {
            noesyReason = "OK_EMPTY";
            noesyNotes.push("Geçerli NOESY çifti yok (yalnızca NOESY_EMPTY kaydı); teorik üretim kapalı veya proton ağı yetersiz.");
        } else {
            noesyReason = "EMPTY_LIST";
            noesyNotes.push("NOESY listesi var ancak geçerli h1/h2 çifti yok (atama veya filtre).");
        }

        const theoreticalNoesyCount = realNoesy.filter(x => x.assign === "NOESY_THEORETICAL").length;
        if (theoreticalNoesyCount > 0 && noesyReason === "OK") {
            noesyNotes.push(`${theoreticalNoesyCount} çift SMILES/¹H-tabanlı teorik tahmin (NOESY_THEORETICAL); gerçek NOESY ile doğrulanmalı.`);
        }

        let noesyRuleEngine = null;
        if (realNoesy.length > 0 && noesyReason === "OK") {
            let diagonalCount = 0;
            let diagonalNearCount = 0;
            let exchangeSuspect = 0;
            let solventFlagged = 0;
            const strengthHist = { strong: 0, medium: 0, weak: 0, very_weak: 0, other: 0 };
            const dupMap = new Map();
            const roundKey = (x) => Math.round(Number(x) / dupDh) * dupDh;
            for (const p of realNoesy) {
                const h1 = Number(p.h1_ppm), h2 = Number(p.h2_ppm);
                if (!Number.isFinite(h1) || !Number.isFinite(h2)) continue;
                if (Math.abs(h1 - h2) < diagTol) diagonalCount++;
                const perpDiag = Math.abs(h1 - h2) / Math.SQRT2;
                if (perpDiag <= diagProxPpm && Math.abs(h1 - h2) >= diagTol * 0.5) diagonalNearCount++;
                if (h1 >= labile[0] && h1 <= labile[1] && h2 >= labile[0] && h2 <= labile[1]) exchangeSuspect++;
                const st = String(p.strength || "").toLowerCase();
                if (st.includes("very") && st.includes("weak")) strengthHist.very_weak++;
                else if (st.includes("strong")) strengthHist.strong++;
                else if (st.includes("medium")) strengthHist.medium++;
                else if (st.includes("weak")) strengthHist.weak++;
                else strengthHist.other++;
                const refs = Array.isArray(NR.solvent_1h_refs) ? NR.solvent_1h_refs : [];
                for (const ref of refs) {
                    const tol = Number(ref.tol ?? 0.1);
                    if (Math.abs(h1 - ref.h) < tol || Math.abs(h2 - ref.h) < tol) { solventFlagged++; break; }
                }
                const dk = `${roundKey(h1).toFixed(4)}|${roundKey(h2).toFixed(4)}`;
                dupMap.set(dk, (dupMap.get(dk) || 0) + 1);
            }
            const duplicate_pairs = [...dupMap.values()].filter(c => c > 1).length;
            let symmetryVerified = 0;
            for (const p of realNoesy) { if (noesySymmetryPartner(p, realNoesy)) symmetryVerified++; }
            const asymmetryCount = realNoesy.length - symmetryVerified;
            const symFrac = realNoesy.length ? symmetryVerified / realNoesy.length : 0;
            const f2Cols = {};
            for (const p of realNoesy) {
                const h2 = Number(p.h2_ppm);
                if (!Number.isFinite(h2)) continue;
                const k2 = Math.round(h2 / f2Bin) * f2Bin;
                if (!f2Cols[k2]) f2Cols[k2] = [];
                f2Cols[k2].push(p);
            }
            let t1NoiseSuspectCols = 0;
            for (const col of Object.values(f2Cols)) {
                if (col.length < t1MinCol) continue;
                const maxI = Math.max(...col.map(noesyPeakInt), 1e-12);
                const weakish = col.filter(c => noesyPeakInt(c) < maxI * t1IntFrac).length;
                if (weakish >= t1MinCol - 1) t1NoiseSuspectCols++;
            }
            const mw = Number(k.mass);
            const mwOk = Number.isFinite(mw) && mw > 0;
            const tauPerDa = Number(NR.tau_c_ns_per_Da ?? 0.0006);
            const tauCap = Number(NR.tau_c_ns_small_mol_cap ?? 0.12);
            let tau_c_ns = null;
            if (mwOk) {
                tau_c_ns = mw < 500 ? Math.min(tauCap, 0.1) : Math.min(tauCap, mw * tauPerDa);
            }
            const fieldMHz = Number(expMeta.fieldMHz ?? expMeta.field_MHz_1H ?? k.config?.fieldMHz ?? 600);
            const omega = 2 * Math.PI * (Number.isFinite(fieldMHz) ? fieldMHz : 600) * 1e6;
            const nullOmegaTau = Number(NR.omega_tau_c_null ?? 1.12);
            let omega_tau_c = null;
            let regime_label = null;
            if (tau_c_ns != null && Number.isFinite(omega)) {
                omega_tau_c = omega * tau_c_ns * 1e-9;
                if (omega_tau_c < nullOmegaTau * 0.75) regime_label = "hızlı_tümleşme (genelde pozitif NOE)";
                else if (omega_tau_c > nullOmegaTau * 1.2) regime_label = "yavaş_tümleşme (büyük MW; negatif NOE bölgesi)";
                else regime_label = "ara rejim (ωτc null noktası yakını)";
            }
            const guide = NR.mixing_time_guidance_ms || {};
            let mixing_recommendation = null;
            if (mwOk && guide.small_organic) {
                let rec = guide.large || [50, 150];
                if (mw < Number(guide.small_organic_Da_max ?? 500)) rec = guide.small_organic;
                else if (mw < Number(guide.medium_Da_max ?? 2000)) rec = guide.medium || [300, 500];
                mixing_recommendation = { mw_Da: Math.round(mw), tau_mix_ms_typical: rec };
            }
            const tmixMs = Number(expMeta.noesy_mixing_time_ms ?? expMeta.noesy_tmix_ms ?? expMeta.tau_mix_ms ?? expMeta.mixing_time_ms);
            const sd = NR.spin_diffusion || {};
            const sdMwThr = Number(sd.mw_threshold_Da ?? 2000);
            let spin_diffusion_risk = "LOW";
            if (Number.isFinite(tmixMs) && mwOk) {
                const isLarge = mw >= sdMwThr;
                const thr = isLarge ? Number(sd.long_tmix_large_mol_ms ?? 120) : Number(sd.long_tmix_small_mol_ms ?? 600);
                if (tmixMs > thr * 1.05) {
                    spin_diffusion_risk = isLarge ? "HIGH" : "MEDIUM";
                    noesyNotes.push(`Spin difüzyon / dolaylı transfer riski: τmix=${tmixMs} ms bu MW için uzun sayılabilir (yaklaşık eşik ${thr} ms). Kısa τmix veya buildup eğrisi önerilir.`);
                    if (noesyStatus === "PASS") noesyStatus = "WARN";
                }
            } else if (mixing_recommendation && !Number.isFinite(tmixMs)) {
                noesyNotes.push(`Tipik τmix (MW≈${mixing_recommendation.mw_Da} Da): ${mixing_recommendation.tau_mix_ms_typical[0]}–${mixing_recommendation.tau_mix_ms_typical[1]} ms (metadata’da τmix yok).`);
            }
            if (symFrac < 0.55 && realNoesy.length >= 5) {
                noesyNotes.push(`NOESY simetrisi zayıf: çapraz piklerin ~%${Math.round((1 - symFrac) * 100)}’inde (f1,f2)↔(f2,f1) eşiği içinde eş bulunamadı; artefakt, EXSY veya işleme hatası düşünün.`);
                if (noesyStatus === "PASS") noesyStatus = "WARN";
            }
            if (t1NoiseSuspectCols > 0) {
                noesyNotes.push(`t₁-gürültü benzeri sütun şüphesi: ${t1NoiseSuspectCols} F2 kolonunda çok sayıda zayıf çapraz pik.`);
                if (noesyStatus === "PASS" && t1NoiseSuspectCols >= 2) noesyStatus = "WARN";
            }
            if (exchangeSuspect > 0) noesyNotes.push(`Kimyasal değişim şüphesi (labil δH aralığında ${exchangeSuspect} çapraz): NH/OH/EXSY ile karıştırılabilir.`);
            if (solventFlagged > 0) noesyNotes.push(`Çözücü/artık çizgisine yakın ${solventFlagged} NOESY çifti (filtre veya atama kontrolü).`);
            if (duplicate_pairs > 0) noesyNotes.push(`Yakın δH ile tekrarlayan çiftler: ${duplicate_pairs} küme (aynı çiftin birden fazla girişi).`);
            noesyNotes.push(`Özet: diagonal=${diagonalCount}, diagonal-yakın=${diagonalNearCount}, simetri-doğrulanan=${symmetryVerified}/${realNoesy.length}, çözücü-şüpheli=${solventFlagged}.`);
            noesyRuleEngine = {
                diagonal_peaks: diagonalCount,
                diagonal_proximity_flagged: diagonalNearCount,
                symmetry_verified_peaks: symmetryVerified,
                asymmetry_count: asymmetryCount,
                symmetry_fraction: symFrac,
                duplicate_pair_clusters: duplicate_pairs,
                exchange_labile_suspect: exchangeSuspect,
                solvent_flagged: solventFlagged,
                t1_noise_suspect_f2_columns: t1NoiseSuspectCols,
                strength_histogram: strengthHist,
                tau_c_ns_estimate: tau_c_ns,
                omega_tau_c: omega_tau_c,
                regime_label,
                field_MHz_1H: Number.isFinite(fieldMHz) ? fieldMHz : null,
                mixing_time_ms_observed: Number.isFinite(tmixMs) ? tmixMs : null,
                mixing_time_guidance: mixing_recommendation,
                spin_diffusion_risk,
                distance_bins_hint_A: NR.distance_bins_A || null,
                theoretical_pair_count: theoreticalNoesyCount,
                mixing_time_law_s: NR.mixing_time_law_s || null,
                spin_diffusion_linear_note: NR.spin_diffusion_linear_hint || null,
                roesy_vs_noesy_recommendation: (mwOk && NR.roesy_vs_noesy_MW) ? (mw < 1000 ? NR.roesy_vs_noesy_MW.MW_lt_1000 : mw < 2000 ? NR.roesy_vs_noesy_MW.MW_1000_2000 : mw >= 5000 ? NR.roesy_vs_noesy_MW.MW_gt_5000 : "Ara MW: koşula göre NOESY veya ROESY") : null,
                reference_distances_A: NR.reference_distances_A || null,
                noe_categories: NR.noe_categories || null
            };
        }

        modules.noesy = {
            status: noesyStatus,
            found: realNoesy.length,
            notes: noesyNotes,
            noesy_reason: noesyReason,
            rule_engine: noesyRuleEngine
        };



        // ========== MS (verifyMS modül fonksiyonu) ==========
        modules.ms = typeof verifyMS === "function" ? verifyMS({ kernel: k, ms, config: cfg, pushWarn }) : { status: "PASS", theoreticalMass: k.mass || 0, matchedAdducts: [], notes: [], require_isotope_pattern: false };
        logRule("verifyMS", "END", { theoreticalMass: k.mass, peakCount: (ms||[]).length }, { status: modules.ms.status, matchedAdducts: (modules.ms.matchedAdducts || []).length });
        const C_found = c13Signals.length;
        const C_expected = modules.c13?.expected ?? k.counts?.C ?? 0;
        const matched = modules.ms?.matchedAdducts || [];



        // ========== FT-IR (verifyIR modül fonksiyonu) ==========
        const bands = (ir || []).filter(b => b.freq != null && Number.isFinite(b.freq));
        modules.ftir = typeof verifyIR === "function" ? verifyIR({ kernel: k, ir, config: cfg, c13: c13Signals }) : { status: "PASS", expectedBands: [], foundBands: [], notes: [], ftir_expected_coverage: 1, artifact_notes: [] };
        logRule("verifyIR", "END", { bandCount: bands.length, hasCarbonyl, hasNitrile }, { status: modules.ftir.status, ftir_expected_coverage: modules.ftir.ftir_expected_coverage });



        // ========== YAPISAL VETO KURALLARI (SMILES ↔ Çıktı tutarlılığı) ==========

        const c13CarbonylRegion = c13Signals.filter(s => (s.ppm||0) >= 160 && (s.ppm||0) <= 220);

        const irCarbonylBand = bands.some(b => (b.freq||0) >= 1650 && (b.freq||0) <= 1800);

        const irOHBand = bands.some(b => (b.freq||0) >= 3200 && (b.freq||0) <= 3600);

        const h1AromaticSignals = (h1ForAnalysis||h1||[]).filter(s => (s.ppm||0) >= 6.0 && (s.ppm||0) <= 9.0);

        const h1AromaticCount = h1AromaticSignals.length;

        const parseIntegForAromatic = (integ) => parseIntegralValue(integ);
        const exchangeable_ppm_ranges_by_solvent = { CDCl3: { cooh_min: 10.5 }, "DMSO-d6": { cooh_min: 11 }, "MeOD": { cooh_min: 11 }, "CD3OD": { cooh_min: 11 } };

        const weightNorm = (w) => w ? Math.round(w * 100) : 0;
        let weights = decomposer ? { h1: weightNorm(decomposer.weights.h1), c13: weightNorm(decomposer.weights.c13), hsqc: weightNorm(decomposer.weights.hsqc), cosy: weightNorm(decomposer.weights.cosy), hmbc: weightNorm(decomposer.weights.hmbc), ms: weightNorm(decomposer.weights.ms), ftir: weightNorm(decomposer.weights.ftir) } : { ...(cfg.weights || { h1: 22, c13: 8, hsqc: 18, cosy: 12, hmbc: 10, ms: 26, ftir: 4 }) };
        const hasHalogen = (k.counts?.Cl || 0) + (k.counts?.Br || 0) + (k.counts?.F || 0) + (k.counts?.I || 0) > 0;
        const isIsomerCase = (k.groups?.aromaticC || 0) >= 6 && (k.counts?.C || 0) >= 8 && (k.counts?.H || 0) >= 8;
        if (!decomposer) { if (hasHalogen) weights = { h1: 10, c13: 20, hsqc: 10, cosy: 5, hmbc: 5, ms: 50, ftir: 5 }; else if (isIsomerCase) weights = { h1: 60, c13: 15, hsqc: 15, cosy: 15, hmbc: 15, ms: 5, ftir: 5 }; }
        const weights_used = weights;

        const modFailFloor = 18;

        const modWarnFloor = 60;

        const scoreFromStatus = (m) => {

            if (!m) return modFailFloor;

            if (Number.isFinite(m.score)) return Math.max(modFailFloor, m.score);

            const st = String(m.status || "").toUpperCase();

            if (st === "PASS") return 100;

            if (st === "WARN") return modWarnFloor;

            if (st === "FAIL") return modFailFloor;

            return modFailFloor;

        };

        const moduleScores = { c13: scoreFromStatus(modules.c13), h1: scoreFromStatus(modules.h1), hsqc: scoreFromStatus(modules.hsqc), cosy: scoreFromStatus(modules.cosy), hmbc: scoreFromStatus(modules.hmbc), ms: scoreFromStatus(modules.ms), ftir: scoreFromStatus(modules.ftir) };

        const totalWeight = (weights.h1 || 0) + (weights.c13 || 0) + (weights.hsqc || 0) + (weights.cosy || 0) + (weights.hmbc || 0) + (weights.ms || 0) + (weights.ftir || 0);

        const ChemScore = decomposer != null && decomposer.total != null ? decomposer.total : (totalWeight > 0 ? Math.round((moduleScores.h1 * (weights.h1 || 0) + moduleScores.c13 * (weights.c13 || 0) + moduleScores.hsqc * (weights.hsqc || 0) + moduleScores.cosy * (weights.cosy || 0) + moduleScores.hmbc * (weights.hmbc || 0) + moduleScores.ms * (weights.ms || 0) + moduleScores.ftir * (weights.ftir || 0)) / totalWeight) : 0);
        const dataScoreNeedsReview = cfg?.data_score_needs_review ?? 50;
        const dataCompletenessAvg = (data_completeness.h1 + data_completeness.c13 + data_completeness.hsqc + data_completeness.cosy + data_completeness.hmbc + data_completeness.ms + data_completeness.ftir) / 7;
        const DataScore = Math.round(dataCompletenessAvg * 100);
        let confidence_score = Math.round(0.7 * ChemScore + 0.3 * DataScore);

        // ---------- Faz-3 Kalibrasyon Katmanı (overconfidence azaltma) ----------
        // Not: Kritik model çatışmalarında skor tavanını düşür.
        const hardVetoCount = (veto_flags || []).filter(v => String(v.severity || "").toUpperCase() === "HARD_VETO").length;
        const failCount = [modules.c13, modules.h1, modules.hsqc, modules.cosy, modules.hmbc, modules.noesy, modules.ms, modules.ftir]
            .filter(m => m && String(m.status || "").toUpperCase() === "FAIL").length;
        const warnCount = [modules.c13, modules.h1, modules.hsqc, modules.cosy, modules.hmbc, modules.noesy, modules.ms, modules.ftir]
            .filter(m => m && String(m.status || "").toUpperCase() === "WARN").length;

        const fRef = formulaRef || {};
        const kernelFormula = String(k.counts?.formula || "").trim();
        const refFormula = String(fRef.formulaHill || "").trim();
        const formulaMismatch = !!(kernelFormula && refFormula && kernelFormula !== refFormula);
        const dbeFromRef = (fRef.counts && Number.isFinite((fRef.counts.C || 0))) ? ((2 * (fRef.counts.C || 0) + 2 + (fRef.counts.N || 0) - (fRef.counts.H || 0) - ((fRef.counts.F || 0) + (fRef.counts.Cl || 0) + (fRef.counts.Br || 0) + (fRef.counts.I || 0))) / 2) : null;
        const dbeMismatch = Number.isFinite(dbeFromRef) && Number.isFinite(k.dbe) ? Math.abs(dbeFromRef - k.dbe) > 0.25 : false;

        const noesyRe = modules.noesy?.rule_engine || null;
        const noesyOnlyTheoretical = modules.noesy?.found > 0 && (noesyRe?.theoretical_pair_count || 0) === (modules.noesy?.found || 0);
        const lowNoesySymmetry = noesyRe && Number.isFinite(noesyRe.symmetry_fraction) && noesyRe.symmetry_fraction < 0.55 && (modules.noesy?.found || 0) >= 5;

        let calibrationPenalty = 0;
        calibrationPenalty += hardVetoCount * 14;
        calibrationPenalty += failCount * 9;
        calibrationPenalty += warnCount * 2;
        if (formulaMismatch) calibrationPenalty += 25;
        if (dbeMismatch) calibrationPenalty += 12;
        if (noesyOnlyTheoretical) calibrationPenalty += 10;
        if (lowNoesySymmetry) calibrationPenalty += 6;

        confidence_score = Math.max(0, Math.min(100, confidence_score - calibrationPenalty));
        if (hardVetoCount > 0) confidence_score = Math.min(confidence_score, 55);
        if (failCount >= 2) confidence_score = Math.min(confidence_score, 60);
        if (formulaMismatch || dbeMismatch) confidence_score = Math.min(confidence_score, 45);
        const confidence_calibration = {
            raw_score: Math.round(0.7 * ChemScore + 0.3 * DataScore),
            calibrated_score: confidence_score,
            penalty_total: calibrationPenalty,
            factors: {
                hard_veto_count: hardVetoCount,
                fail_count: failCount,
                warn_count: warnCount,
                formula_mismatch: formulaMismatch,
                dbe_mismatch: dbeMismatch,
                noesy_only_theoretical: noesyOnlyTheoretical,
                noesy_low_symmetry: lowNoesySymmetry
            }
        };

        // ---------- MCA: Severity enrichment for veto_flags ----------
        const ERROR_SEVERITY_MAP_REF = typeof ERROR_SEVERITY_MAP !== "undefined" ? ERROR_SEVERITY_MAP : {};
        const ERROR_SCORE_MAP_REF = typeof ERROR_SCORE_MAP !== "undefined" ? ERROR_SCORE_MAP : { INFO: 0, WARN: 2, SOFT_FAIL: 5, HARD_VETO: 9 };
        veto_flags.forEach(v => { v.severity = ERROR_SEVERITY_MAP_REF[v.error_code] || "SOFT_FAIL"; v.severity_score = ERROR_SCORE_MAP_REF[v.severity] ?? 5; });

        const root_cause_analysis = veto_flags.map(v => ({ error_code: v.error_code, modality: v.modality, what_failed: v.rule_name, why: v.why, evidence: v.evidence || [], missing_expected: v.missing_expected || [], severity: v.severity, severity_score: v.severity_score }));

        modules.h1?.checks?.filter(c => c.error_code && c.status !== "PASS").forEach(c => root_cause_analysis.push({ error_code: c.error_code, modality: "1H", what_failed: c.name, why: (c.details || []).join("; ") || "Kural ihlali", evidence: [], missing_expected: [], severity: ERROR_SEVERITY_MAP_REF[c.error_code] || "SOFT_FAIL", severity_score: ERROR_SCORE_MAP_REF[ERROR_SEVERITY_MAP_REF[c.error_code]] ?? 5 }));

        warnings.forEach(w => root_cause_analysis.push({ error_code: w.error_code, modality: w.modality, what_failed: w.error_code, why: w.message, evidence: w.evidence || [], missing_expected: [], severity: "WARN", severity_score: 2 }));

        // HSQC/COSY root_cause girdilerine modül detayı ekle (UI'da detaylı gösterim için)
        root_cause_analysis.forEach(r => {
            if (r.modality === "HSQC" && modules.hsqc) {
                r.detail = {
                    summary: "Beklenen protonlu karbon sayısı: " + (modules.hsqc.expectedProtonatedC ?? "-") + ", bulunan HSQC pik: " + (modules.hsqc.found ?? "-") + (modules.hsqc.expectedProtonatedC > 0 ? ", oran: %" + (Math.round((modules.hsqc.found / modules.hsqc.expectedProtonatedC) * 100)) : ""),
                    expectedProtonatedC: modules.hsqc.expectedProtonatedC,
                    found: modules.hsqc.found,
                    ratio_pct: modules.hsqc.expectedProtonatedC > 0 ? Math.round((modules.hsqc.found / modules.hsqc.expectedProtonatedC) * 100) : null,
                    missing_correlations: modules.hsqc.missing_correlations,
                    severity_grading: modules.hsqc.severity_grading
                };
            }
            if (r.modality === "COSY" && modules.cosy) {
                r.detail = {
                    summary: "Bulunan COSY çapraz pik: " + (modules.cosy.found ?? 0) + ", tüm protonlar singlet: " + (modules.cosy.all_protons_singlet ? "evet (COSY boş kabul)" : "hayır") + ", beklenti: " + (modules.cosy.COSY_EXPECTATION || "-"),
                    cosy_found: modules.cosy.found,
                    all_protons_singlet: modules.cosy.all_protons_singlet,
                    COSY_EXPECTATION: modules.cosy.COSY_EXPECTATION,
                    notes: modules.cosy.notes
                };
            }
        });

        // ---------- MCA / v32 OMNISCIENT: Bağlam + RootCauseAnalyzer (SeverityGrader ile WARN: High Overlap Probable) ----------
        const ctxV32 = typeof getMoleculeContext === "function" ? getMoleculeContext(k) : "CTX_GENERIC";
        const rcaInput = { counts: k.counts, expectedC, foundC: C_found, symmetryFactor: symDet?.symmetry_factor, expected_unique_carbons: symDet?.expected_unique_carbons, isSymmetric: symDet?.isSymmetric, context: ctxV32, smiles: smilesInput, groups: k.groups };
        const rca = (cfg.use_omniscient_v32 && typeof RootCauseAnalyzer === "function") ? RootCauseAnalyzer(veto_flags, rcaInput) : null;
        if (rca && rca.rule_id) veto_flags.forEach(v => { v.rule_id = v.rule_id || rca.rule_id; });

        const ERROR_TO_ROOT_REF = typeof ERROR_TO_ROOT_CAUSE !== "undefined" ? ERROR_TO_ROOT_CAUSE : {};
        const SYMMETRY_ACTION_REF = typeof SYMMETRY_SUGGESTED_ACTION !== "undefined" ? SYMMETRY_SUGGESTED_ACTION : "APPLY_SYMMETRY_FACTOR_2";
        const firstVeto = veto_flags[0];
        const symmetryLikely = expectedC > 0 && C_found > 0 && C_found <= Math.ceil(expectedC / 2) + 1 && (expectedC / C_found >= 1.8 || expectedC / C_found <= 2.2);
        const c13CountLowSymmetry = expectedC > 0 && C_found > 0 && expectedC % C_found === 0 && C_found < expectedC && (modules.c13?.status === "FAIL" || modules.c13?.status === "WARN");
        let root_cause = firstVeto ? {
            primary: rca?.primary || ERROR_TO_ROOT_REF[firstVeto.error_code] || "SCIENTIFIC_CONFLICT",
            subtype: firstVeto.error_code,
            description: firstVeto.why + (symmetryLikely ? " Gözlenen karbon sayısı beklenenin yaklaşık yarısı; simetri olası." : ""),
            suggested_action: symmetryLikely ? SYMMETRY_ACTION_REF : (ERROR_TO_ROOT_REF[firstVeto.error_code] === "MODELING_LIMITATION" ? "EXTEND_LIBRARY" : "REVIEW_STRUCTURE_VS_DATA")
        } : null;

        if (rca?.suggestedVerdict === "CONDITIONAL_PASS" && root_cause) root_cause.omniscient_verdict = "CONDITIONAL_PASS";

        if (c13CountLowSymmetry && !firstVeto) {
            const overlapLabel = rca?.overlapLabel || null;
            const grader = (typeof SeverityGrader === "function" && ctxV32) ? SeverityGrader("QC_C13_COUNT_LOW", ctxV32, expectedC > 0 ? (expectedC - C_found) / expectedC : 0) : { severity: "SOFT_FAIL", penalty: 10 };
            root_cause = {
                category: "SYMMETRY_ARTIFACT",
                primary: "SYMMETRY_ARTIFACT",
                subtype: "QC_C13_COUNT_LOW",
                severity: grader.severity === "INFO" ? "WARN" : (grader.severity || "SOFT_FAIL"),
                diagnosis_code: "QC_C13_SYMMETRY",
                description: overlapLabel || `${expectedC} karbon atomu ${C_found} benzersiz sinyal veriyor. Yüksek simetri tespit edildi; bu bir hata değil, yapısal bir özelliktir.`,
                humanReadable: overlapLabel ? (overlapLabel + ". " + `${expectedC} karbon, ${C_found} sinyal; büyük molekül/steroidte örtüşme normaldir.`) : `Yüksek simetri tespit edildi. ${expectedC} karbon atomu ${C_found} benzersiz sinyal veriyor. Sikloheksan, benzen vb. moleküllerde tek/az sinyal normaldir.`,
                actionableAdvice: "Simetri faktörünü manuel olarak onaylayın; gerekirse C_min (simetriye göre beklenen minimum sinyal sayısı) ile değerlendirin.",
                suggested_action: SYMMETRY_ACTION_REF,
                rule_id: "SYM-01"
            };
        } else if (firstVeto && c13CountLowSymmetry && (firstVeto.error_code === "VETO_C13_CARBONYL_STRUCTURE" || modules.c13?.status === "WARN")) {
            root_cause = { ...root_cause, category: root_cause.primary, severity: firstVeto.severity || "SOFT_FAIL", diagnosis_code: firstVeto.error_code, humanReadable: root_cause.description + " Yüksek simetri nedeniyle karbon sayısı düşük olabilir.", actionableAdvice: "Simetriyi onaylayın veya 13C sinyal sayısını simetriye göre yorumlayın.", suggested_action: root_cause.suggested_action || SYMMETRY_ACTION_REF };
        } else if (root_cause && firstVeto) {
            root_cause = { ...root_cause, category: root_cause.primary, severity: firstVeto.severity || "SOFT_FAIL", diagnosis_code: firstVeto.error_code, humanReadable: root_cause.description, actionableAdvice: root_cause.suggested_action, suggested_action: root_cause.suggested_action };
        }

        const worst_severity = veto_flags.length ? veto_flags.reduce((a, v) => (v.severity_score > (a.score || 0) ? { severity: v.severity, score: v.severity_score } : a), { severity: veto_flags[0].severity, score: veto_flags[0].severity_score }) : null;
        let conditional_pass = worst_severity && worst_severity.severity === "SOFT_FAIL";
        if (rca?.suggestedVerdict === "CONDITIONAL_PASS") conditional_pass = true;

        // ---------- MCA / v32: Confidence Decomposition (ConfidenceDecomposer çıktısı kullanılır) ----------
        const modalityKeys = ["h1", "c13", "hsqc", "cosy", "hmbc", "ms", "ftir"];
        const modalityLabels = { h1: "1H_NMR", c13: "13C_NMR", hsqc: "HSQC", cosy: "COSY", hmbc: "HMBC", ms: "MS", ftir: "IR" };
        let confidence_breakdown;
        if (decomposer && decomposer.details) {
            confidence_breakdown = { total: Math.max(0, Math.min(100, confidence_score)), details: {} };
            modalityKeys.forEach(key => {
                const d = decomposer.details[key];
                if (d) confidence_breakdown.details[modalityLabels[key]] = { score: d.score, weight: weights[key] || 0, contribution: d.contribution, impact: d.impact || "POSITIVE", reason: d.impact === "CRITICAL_DROP" ? "Modül FAIL" : (d.impact === "WARN" ? "Modül WARN" : "Modül PASS") };
            });

            modalityKeys.forEach(key => {
                const score = moduleScores[key] ?? 0;
                const weight = weights[key] || 0;
                const contribution = totalWeight > 0 ? (score * weight) / totalWeight : 0;
                let impact = score < 50 ? "CRITICAL_DROP" : (score < 80 ? "WARN" : "POSITIVE");
                let reason = modules[key]?.status === "FAIL" ? "Modül FAIL" : (modules[key]?.status === "WARN" ? "Modül WARN" : "Modül PASS");
                confidence_breakdown.details[modalityLabels[key]] = { score, weight, contribution: Math.round(contribution * 10) / 10, impact, reason };
            });
        }

        // ---------- MCA: Rule Suggester / Auto-Rule Suggestion ----------
        const suggestions = [];
        if (veto_flags.some(v => v.error_code === "VETO_H1_AROMATIC_INTEGRAL") || (hasAromatic && (h1||[]).filter(s => (s.ppm||0) >= 6 && (s.ppm||0) <= 9).length === 0)) {

            suggestions.push({ type: "CHECK_SAMPLE", message: `Numunenin gerçekten ${molName} olduğundan emin misiniz? ¹H spektrumunda aromatik bölge (6.5–8.5 ppm) tamamen boş; spektrum tamamen alifatik bir yapıya işaret ediyor. Ya molekül yanlış ya da veri eksik/yanlış.`, code: "VETO_H1_AROMATIC_ABSENT" });
        }
        if (veto_flags.some(v => v.error_code === "VETO_H1_ALDEHYDE_MISSING") && (h1ForAnalysis||h1||[]).some(s => (s.ppm||0) >= 8.8 && (s.ppm||0) <= 11)) {
            const near = (h1ForAnalysis||h1||[]).find(s => (s.ppm||0) >= 8.8 && (s.ppm||0) <= 11);
            suggestions.push({ type: "RULE_EXTENSION", target: "Aldehyde CHO range", current: "9.3–10.5 ppm", proposed: "8.8–11 ppm", reason: `Gözlemlenen pik (${(near?.ppm || 0).toFixed(2)} ppm) literatür sınırlarına yakın. Kural genişletilebilir veya numune doğrulaması yapın.`, code: "ALDEHYDE_NEAR_RANGE" });
        }
        if (veto_flags.some(v => v.error_code === "C13_OBLIGATORY_FEATURE_MISSING") && c13Signals.some(s => (s.ppm||0) >= 155 && (s.ppm||0) <= 225)) {
            const near = c13Signals.find(s => (s.ppm||0) >= 155 && (s.ppm||0) <= 225);
            suggestions.push({ type: "RULE_EXTENSION", target: "Carbonyl 13C range", current: "160–220 ppm", proposed: "155–225 ppm", reason: `Gözlemlenen 13C piki (${(near?.ppm || 0).toFixed(1)} ppm) karbonil bölgesine yakın. Atama veya bölge tanımı kontrol edilebilir.`, code: "C13_CARBONYL_NEAR_RANGE" });
        }
        if (c13CountLowSymmetry && expectedC > 0 && C_found > 0) {
            suggestions.push({ type: "ACCEPT_SYMMETRY", message: `Bu molekül yüksek simetriye sahip. ${expectedC} karbonun ${C_found} sinyal vermesi normaldir. Bu bir hata değil, bir özelliktir; simetriyi onaylayarak geçebilirsiniz.`, code: "QC_C13_SYMMETRY" });
        }
        if (veto_flags.some(v => /ISOTOPE|MS_ISOTOPE/.test(v.error_code))) {
            suggestions.push({ type: "CHECK_SAMPLE", message: "Halojen içeren molekülde M+2 izotop paterni beklenir. Numune saflığı ve MS ayarlarını kontrol edin; gerekirse MS verisini tekrar alın.", code: "QC_MS_ISOTOPE_FAIL" });
        }
        if (cfg.use_omniscient_v32 && typeof AutoRuleSuggester === "function") {
            const autoSuggest = AutoRuleSuggester(smilesInput, { c13: c13Signals, veto_flags, h1: h1ForAnalysis });
            (autoSuggest || []).forEach(s => suggestions.push({ type: s.type, message: s.message, rule_id: s.rule_id, target: s.target, code: s.rule_id }));
        }

        let status = overall;
        const all2dFallbackOnly = (corrFallback.hsqc.length + corrFallback.cosy.length + corrFallback.hmbc.length + corrFallback.noesy.length) > 0
            && (corr.hsqc.length + corr.cosy.length + corr.hmbc.length + corr.noesy.length) === 0;
        const functionalGroupSubtypeConflict = (() => {
            const c13HasEsterTag = (c13ForAnalysis || c13 || []).some(x => /Ester/i.test(String(x?.assign || "")));
            const acidExpected = (k.groups?.acid || 0) > 0;
            return acidExpected && c13HasEsterTag;
        })();
        const maxErrorBeforeFail = (cfg.max_error_count_before_fail != null ? cfg.max_error_count_before_fail : 1);
        const minModalities = cfg.min_required_modalities_for_strong_validated || ["1H", "13C"];
        const hasRequiredModalities = (!minModalities.includes("1H") || hasH1) && (!minModalities.includes("13C") || hasC13);
        if (veto_flags.some(v => v.status_on_fail === "FATAL")) status = "FAIL";
        else if (veto_flags.length >= maxErrorBeforeFail) status = "FAIL";
        else if (veto_flags.length > 0) status = "PARTIAL";
        else if (overall === "WARN" || overall === "BELIRSIZ") status = "PARTIAL";
        else if (veto_flags.length === 0 && DataScore < dataScoreNeedsReview && overall === "PASS") status = "NEEDS_REVIEW";
        else if (veto_flags.length === 0 && !hasRequiredModalities && overall === "PASS") status = "INCONCLUSIVE";
        if (status === "PASS" && confidence_score < 70) status = "PARTIAL";
        if (all2dFallbackOnly && (status === "PASS" || status === "NEEDS_REVIEW")) status = "PARTIAL";
        if (functionalGroupSubtypeConflict) status = "INCONCLUSIVE";

        const missing_library_items = [];

        const FP_ALT_KEYS = { "C(Cl)(Cl)Cl": "ClC(Cl)Cl", "C(#N)C": "CC#N", "C1CCCO1": "C1CCOC1", "C[S](=O)C": "CS(=O)C" };

        const lookupKey = FP_ALT_KEYS[smilesInput.trim().replace(/\s+/g, "")] || smilesInput.trim().replace(/\s+/g, "");

        if (!FP_RULES.find(r => r.smiles === lookupKey || r.smiles === smilesInput)) {

            missing_library_items.push({

                table: "FP_RULES",

                key: lookupKey || smilesInput,

                required_parameters_to_add: "mustHave, forbidden (regionCountAtLeast/peakNear) for this SMILES",

                suggested_sources: "NMRShiftDB, in-house curated fingerprint set, GOLDEN_EXPECTATIONS_30.json",

                suggested_rule_template: { smiles: lookupKey || smilesInput, name: "Custom", expectedH: formulaRef?.counts?.H ?? k.counts?.H ?? 0, mustHave: [{ type: "regionCountAtLeast", args: { min: 0.6, max: 2.2, n: 1 }, message: "Alifatik bölge en az 1 sinyal", severity: "WARN" }], forbidden: [] }

            });

        }

        const solventCatalogNames = (typeof solvent_impurity_catalog !== "undefined" ? solvent_impurity_catalog : []).map(s => (s.name || "").toLowerCase());

        if (solventKey && !solventCatalogNames.includes((solventKey || "").toLowerCase())) {

            missing_library_items.push({ table: "solvent_impurity_catalog", key: solventKey, required_parameters_to_add: "name, ppm_1h, pattern, note (ppm_1h: 1H ppm değeri)", suggested_sources: "CDCl3 7.26, DMSO-d6 2.50, MeOD 3.31, acetone-d6 2.05 referans değerleri" });

        }

        if (modules.ftir?.expectedBands?.length > 0 && (modules.ftir.foundBands || []).length < modules.ftir.expectedBands.length) {

            if (missingBands.length > 0) missing_library_items.push({ table: "IR_band_priors", key: "expected_vs_found", required_parameters_to_add: "Eksik bantlar: " + missingBands.slice(0, 5).join("; ") + ". IR_band_priors içinde min/max/intensity/assign alanları kontrol edilmeli.", suggested_sources: "Literatür IR bant aralıkları (ester 1735–1750, keton 1705–1725, nitril 2210–2260 cm⁻¹)" });

        }

        if (modules.ms?.status === "FAIL" && (ms || []).length > 0 && (modules.ms.matchedAdducts || []).length === 0) {

            missing_library_items.push({ table: "MS_adduct_rules", key: k.config?.ionMode || "positive", required_parameters_to_add: "Eşleşen adduct yok. positive/negative listesinde massDelta ve label kontrolü; HRMS ppm toleransı (ms_ppm_match).", suggested_sources: "ESI pozitif: [M+H]+, [M+Na]+, [M+K]+; negatif: [M-H]-, [M+HCOO]-" });

        }

        if (veto_flags.length === 0 && missing_library_items.length > 0 && (library_coverage_report?.simulation_confidence ?? 100) < 60) status = "INCONCLUSIVE";

        const patch_recommendations = [];

        if (veto_flags.some(v => v.error_code === "H1_INTEGRAL_MISMATCH")) patch_recommendations.push({ file_path: "Spectromasterv0.2tester.html", function_name: "generate1H", change_type: "FIX", description: "Integral toplamının expectedH ile uyumlu olması için add(ppm, mult, integ, ...) çağrılarında integ değerlerini kontrol et; değişebilir H (OH/NH) için exclude option kullan.", tests: "verify1H integral check unit test" });

        const finalScore = (status === "FAIL" || status === "PARTIAL") ? Math.min(confidence_score, 69) : (status === "INCONCLUSIVE" ? Math.min(confidence_score, 50) : Math.max(0, Math.min(100, confidence_score)));

        const evidence = veto_flags.slice(0, 5).map(v => ({ rule: v.rule_name, why: v.why, evidence: v.evidence })).concat(warnings.slice(0, 3).map(w => ({ rule: w.error_code, message: w.message })));
        const cfgRef = typeof VERIFICATION_CONFIG !== "undefined" ? VERIFICATION_CONFIG : {};
        const config_snapshot = { ppm_tol_1h: cfgRef.ppm_tol_1h, ppm_tol_13c: cfgRef.ppm_tol_13c, ppm_tol_arom: cfgRef.ppm_tol_arom, d1_13c_sec: cfgRef.d1_13c_sec, threshold_profile: cfgRef.threshold_profile || "normal", timestamp: new Date().toISOString() };
        const artifact_hashes = { report_summary: (summary || "").slice(0, 200) + "|" + status + "|" + finalScore, config: JSON.stringify(config_snapshot).length + " chars" };

        logRule("runVerification", "END", {}, { status, confidence_score: finalScore, veto_count: veto_flags.length, missing_library_count: missing_library_items.length });

        }

        }

        componentDidCatch(error, info) {

            console.error("SpectroMaster ErrorBoundary:", error, info);

        }

            if (this.state.hasError) {

    function App() {

        const [analyzeProgress, setAnalyzeProgress] = useState(null);

        useEffect(() => {

            const t = setTimeout(() => { try { smilesInputRef.current?.focus({ preventScroll: true }); } catch (_) { /* eski tarayıcılar */ } }, 0);

            return () => clearTimeout(t);

        }, []);



        const yieldToUI = () => new Promise((resolve) => {

            if (typeof requestAnimationFrame !== "undefined") requestAnimationFrame(() => resolve());

        });

        const analyze = async () => {

            setLoading(true);

            setError(null);

            try {

                const lines = parseMultilineSmilesInput(input.split(/\r?\n/));

                if (lines.length === 0) throw new Error("SMILES giriniz.");

                const newReports = [];

                const failed = [];

                setAnalyzeProgress({ done: 0, total: lines.length });

                const apiBase = (typeof window !== "undefined" && window.location?.origin && !window.location.origin.startsWith("file:")) ? window.location.origin : "";

                for (let i = 0; i < lines.length; i++) {

                    await yieldToUI();

                    let smiles = lines[i];

                        let graphOverrides = null;

                        if (apiBase) {

                            try {

                                const parseRes = await fetch(`${apiBase}/api/parse_and_standardize`, {

                                    method: "POST",

                                    headers: { "Content-Type": "application/json" },

                                    body: JSON.stringify({ smiles })

                                });

                                const parseData = await parseRes.json();

                                if (parseData.success && parseData.moleculeGraph) {

                                    graphOverrides = computeGraphFeaturesFromGraph(mg);

                                    if (graphOverrides) {

                                        graphOverrides.formula = mg.formula || mg.formulaHill;

                                    }

                                }

                            } catch (_) { /* API unavailable: fallback to local deterministic graph */ }

                                const mgLocal = computeMolGraph(smiles);

                        exch_H_min: 2, exch_H_max: 2,
                        non_exch_H_min: 10, non_exch_H_max: 10,
                        c13_no_aliphatic_ketone: true
                    }
                },
                {
                    id: "kaempferol_like", name: "Kaempferol-like flavonol",
                    smiles: "C1=CC(=C(C=C1C2=C(C(=O)C3=C(O2)C=CC(=C3)O)O)O)O",
                    invariants: {

                        hsqc_Q_veto: true,

                        exch_H_min: 3, exch_H_max: 6,

                    }
                },
                {
                    id: "c16h18o8_stereo_a", name: "C16H18O8 Stereomer A (O-CH rich, polyphenolic)",
                    smiles: "C1[C@@H](OC2=CC(=C(C=C2O)O)O)[C@H](OC3=CC(=C(C=C3)O)O)CO1",
                    invariants: {
                        formula: "C16H18O8", dbe: 8,
                        c13_carbonyl_must_not_be_present: true,
                        aromatic_CH_min: 3, aromatic_Q_min: 4,
                        hetero_CH_min: 2, hetero_CH_ppm_range: [55, 95],
                        h1_aromatic_min: 4,
                        h1_och_region_min: 4,
                        hsqc_Q_veto: true,

                    }
                },
                {
                    id: "c16h18o8_stereo_b", name: "C16H18O8 Stereomer B (diastereomer)",
                    smiles: "C1[C@H](OC2=CC(=C(C=C2O)O)O)[C@@H](OC3=CC(=C(C=C3)O)O)CO1",
                    invariants: {
                        formula: "C16H18O8", dbe: 8,
                        c13_carbonyl_must_not_be_present: true,

                    }
