                        cosy.push({ h1: highJVinylic[i].ppm, h2: highJVinylic[j].ppm, type: "COSY", strength: "strong", note: "vinylic trans pair (J≥12)", assign: "Vinylic-trans" });
                        cosyPairs.add(key);
                    }
                }
            }
        }

        // Fallback B: aromatic doublets AA'BB' (para-disubstituted)
        const aromaticDoublets = nonExchH.filter(p => p.meta.isAromatic && p.mult && p.mult.includes("d") && !p.mult.includes("br"));
        if (aromaticDoublets.length >= 2 && cosy.filter(c => c.h1 !== null && c.h2 !== null && c.h1 >= 6.0 && c.h2 >= 6.0).length === 0) {
            for (let i = 0; i < aromaticDoublets.length - 1; i++) {
                for (let j = i + 1; j < aromaticDoublets.length; j++) {
                    const d = Math.abs(aromaticDoublets[i].ppm - aromaticDoublets[j].ppm);
                    const key = pairKey(aromaticDoublets[i].ppm, aromaticDoublets[j].ppm);
                    if (d >= 0.1 && d <= 2.0 && !cosyPairs.has(key)) {
                        const str = d <= 0.5 ? "strong" : d <= 1.0 ? "medium" : "weak";
                        cosy.push({ h1: aromaticDoublets[i].ppm, h2: aromaticDoublets[j].ppm, type: "COSY", strength: str, note: "aromatic ortho coupling (AA'BB')", assign: "Ar-H ortho" });
                        cosyPairs.add(key);
                    }
                }
            }
        }

        // Fallback C: O-CH/O-CH2 network (3-5.5 ppm) if still sparse
        const ochProtons = nonExchH.filter(p => p.ppm >= 3.0 && p.ppm <= 5.6 && !p.is_ex && p.mult !== "s");
        if (ochProtons.length >= 2 && cosy.filter(c => c.h1 !== null && c.h1 >= 3.0 && c.h1 <= 5.6 && c.h2 >= 3.0 && c.h2 <= 5.6).length === 0) {
            ochProtons.sort((a, b) => a.ppm - b.ppm);
            for (let i = 0; i < ochProtons.length - 1; i++) {
                const d = Math.abs(ochProtons[i].ppm - ochProtons[i + 1].ppm);
                const key = pairKey(ochProtons[i].ppm, ochProtons[i + 1].ppm);
                if (d >= 0.05 && d <= 1.5 && !cosyPairs.has(key)) {
                    cosy.push({ h1: ochProtons[i].ppm, h2: ochProtons[i + 1].ppm, type: "COSY", strength: d <= 0.6 ? "strong" : "medium", note: "O-CH adjacency network", assign: "O-CH/O-CH2" });
                    cosyPairs.add(key);
                }
            }
        }

        // Structured reason if still empty
        if (cosy.length === 0) {

            if (nonExchH.length === 0) cosyFallbackReason.push("No non-exchangeable protons");
            else if (nonExchH.every(p => p.mult === "s")) cosyFallbackReason.push("All protons are singlets (no coupling partners)");
            else if (nonExchH.length === 1) cosyFallbackReason.push("Only 1 non-exchangeable proton (no partner)");
            else cosyFallbackReason.push("Category incompatibility or excessive ppm delta prevented pairing");

            cosy.push({ 

                h1: null, 

                h2: null, 

                type: "COSY", 

                assign: "NO_COSY_ELIGIBLE_PROTONS", 

                strength: "none", 

                note: "No COSY correlations generated", 

                reason: cosyFallbackReason.join("; ") 

            });

        }

        

        // 6C. HMBC Production (1H-13C long-range)

        // 6C.1 Critical selections

        const carbonyls = c13n.filter(c => c.ppm > 160);

        const esterCarbonyls = carbonyls.filter(c => c.assign?.includes("Ester") || (c.ppm >= 165 && c.ppm <= 175));

        const amideCarbonyls = carbonyls.filter(c => c.assign?.includes("Amide") || (c.ppm >= 165 && c.ppm <= 175));

        const ketoneCarbonyls = carbonyls.filter(c => c.assign?.includes("Ketone") || c.ppm >= 195);

        const acidCarbonyls = carbonyls.filter(c => c.assign?.includes("Acid") || (c.ppm >= 175 && c.ppm <= 185));

        const aldehydeCarbonyls = carbonyls.filter(c => c.assign?.includes("Aldehyde") || (c.ppm >= 190 && c.ppm <= 205));

        

        const aromaticCs = c13n.filter(c => inRange(c.ppm, [110, 160]) && c.type !== "Q");

        const aromaticQs = c13n.filter(c => inRange(c.ppm, [110, 160]) && c.type === "Q");

        const heteroCs = c13n.filter(c => inRange(c.ppm, [50, 90]));

        const anomericCs = c13n.filter(c => inRange(c.ppm, [90, 110]));

        

        // 6C.2 Proton classes for HMBC

        const methoxyH = h1n.filter(p => isMethoxyProton(p));

        const anomericH = h1n.filter(p => isAnomericProton(p));

        const vinylicH = h1n.filter(p => isVinylicProton(p));

        const aromaticH = h1n.filter(p => isAromaticProton(p));

        const alphaToCarbonylH = h1n.filter(p => inRange(p.ppm, [2.0, 3.2]) && p.mult !== "s" && ((k.groups?.amide || 0) > 0 || (k.groups?.ester || 0) > 0));

        const allylicH = h1n.filter(p => inRange(p.ppm, [1.6, 2.4]) && k.groups.alkene > 0);

        const benzylicH = h1n.filter(p => inRange(p.ppm, [2.2, 3.0]) && k.groups.aromaticC > 0);

        

        // 6C.3 HMBC guardrail/veto

        const isHMBCEligible = (p) => {

            if (p.is_ex && cfg.mode === "clean") return false; // Exchangeable protons veto in clean mode

            if (p.is_ex && cfg.mode === "dense" && rnd() > 0.1) return false; // Low probability in dense mode

            return true;

        };

        

        // 6C.4 Main production rules (expanded)

        // Rule 1: Methoxy → carbonyl / aromatic ipso

        methoxyH.forEach(m => {

            if (!isHMBCEligible(m)) return;

            if (hmbc.length >= cfg.hmbc.maxTotalPairs) return;

            

            let target = null;

            let note = "OMe -> C=O";

            let strength = "strong";

            

            // Default: methoxyH → ester/amide carbonyl

            if (esterCarbonyls.length > 0) {

                target = esterCarbonyls[Math.floor(rnd() * esterCarbonyls.length)];

            } else if (amideCarbonyls.length > 0) {

                target = amideCarbonyls[Math.floor(rnd() * amideCarbonyls.length)];

            }

            

            // Aromatic OMe: methoxyH → aromatic ipso Q

            if (k.groups.aromaticC > 0 && aromaticQs.length > 0 && rnd() < 0.3) {

                target = aromaticQs[Math.floor(rnd() * aromaticQs.length)];

                note = "OMe -> Ar Q";

                strength = "medium";

            }

            

            // Glyco: methoxyH → anomericC

            if (k.context === "GLYCOPEPTIDE" && anomericCs.length > 0 && rnd() < 0.2) {

                target = anomericCs[Math.floor(rnd() * anomericCs.length)];

                note = "OMe -> Anomeric C";

                strength = "weak";

            }

            

            if (target) {

                const key = `${Math.round(m.ppm * 100)}|${Math.round(target.ppm * 10)}`;

                if (!hmbcSeen.has(key)) {

                    hmbc.push({ h_ppm: m.ppm, c_ppm: target.ppm, type: "HMBC", assign: "HMBC", note, strength, meta: { protonCat: m.category, carbonCat: target.category } });

                    hmbcSeen.add(key);

                }

            }

        });

        methoxyH.forEach(m => {

            if (!isHMBCEligible(m)) return;

            const hasCO = hmbc.some(h => h && Math.abs((h.h_ppm || 0) - m.ppm) < 0.06 && (h.c_ppm || 0) >= 160 && (h.c_ppm || 0) <= 220);

            if (hasCO) return;

            const target = ketoneCarbonyls[0] || esterCarbonyls[0] || amideCarbonyls[0] || carbonyls[0];

            if (!target) return;

            const key = `${Math.round(m.ppm * 100)}|${Math.round(target.ppm * 10)}`;

            if (hmbcSeen.has(key) || hmbc.length >= cfg.hmbc.maxTotalPairs) return;

            hmbc.push({ h_ppm: m.ppm, c_ppm: target.ppm, type: "HMBC", assign: "HMBC", note: "OMe -> C=O (guaranteed)", strength: "strong", meta: { protonCat: m.category, carbonCat: target.category } });

            hmbcSeen.add(key);

        });

        

        // Rule 2: Acetate methyl → ester carbonyl

        const acetateMeH = h1n.filter(p => isAcetateMeProton(p));

        acetateMeH.forEach(a => {

            if (hmbc.length >= cfg.hmbc.maxTotalPairs) return;

            if (esterCarbonyls.length > 0) {

                const target = esterCarbonyls[Math.floor(rnd() * esterCarbonyls.length)];

                hmbc.push({ h_ppm: a.ppm, c_ppm: target.ppm, type: "HMBC", assign: "HMBC", note: "OAc Me -> OAc C=O", strength: "strong", meta: { protonCat: a.category, carbonCat: target.category } });

            }

        });

        

        // Rule 3: Vinylic H → carbonyl

        vinylicH.forEach(v => {

            if (!isHMBCEligible(v)) return;

            if (hmbc.length >= cfg.hmbc.maxTotalPairs) return;

            

            let target = null;

            let note = "Vin -> C=O";

            

            if (k.context === "MACROLIDE") {

                // MACROLIDE: prefer ketone (enone)

                if (ketoneCarbonyls.length > 0) {

                    target = ketoneCarbonyls[Math.floor(rnd() * ketoneCarbonyls.length)];

                } else if (esterCarbonyls.length > 0) {

                    target = esterCarbonyls[Math.floor(rnd() * esterCarbonyls.length)];

                }

            } else if (k.context === "TAXANE") {

                // TAXANE: benzoyl/ester carbonyl bias

                if (esterCarbonyls.length > 0) {

                    target = esterCarbonyls[Math.floor(rnd() * esterCarbonyls.length)];

                }

            } else {

                const preferred = esterCarbonyls.length > 0 ? esterCarbonyls : amideCarbonyls;

                if (preferred.length > 0) {

                    target = preferred[Math.floor(rnd() * preferred.length)];

                }

            }

            

            if (target) {

                hmbc.push({ h_ppm: v.ppm, c_ppm: target.ppm, type: "HMBC", assign: "HMBC", note, strength: "medium", meta: { protonCat: v.category, carbonCat: target.category } });

            }

        });

        

        // Rule 4: Aromatic H → carbonyl / quaternary aromatic

        if (k.context === "GLYCOPEPTIDE" || k.context === "PEPTIDE") {

            aromaticH.slice(0, 2).forEach(ar => {

                if (!isHMBCEligible(ar)) return;

                if (hmbc.length >= cfg.hmbc.maxTotalPairs) return;

                

                if (amideCarbonyls.length > 0) {

                    const target = amideCarbonyls[Math.floor(rnd() * amideCarbonyls.length)];

                    hmbc.push({ h_ppm: ar.ppm, c_ppm: target.ppm, type: "HMBC", assign: "HMBC", note: "Ar -> Amide C=O", strength: "strong", meta: { protonCat: ar.category, carbonCat: target.category } });

                }

            });

        }

        

        if (k.context === "TAXANE") {

            aromaticH.slice(0, 2).forEach(ar => {

                if (!isHMBCEligible(ar)) return;

                if (hmbc.length >= cfg.hmbc.maxTotalPairs) return;

                

                if (esterCarbonyls.length > 0 && rnd() < 0.5) {

                    const target = esterCarbonyls[Math.floor(rnd() * esterCarbonyls.length)];

                    hmbc.push({ h_ppm: ar.ppm, c_ppm: target.ppm, type: "HMBC", assign: "HMBC", note: "Ar -> Ester C=O", strength: "medium", meta: { protonCat: ar.category, carbonCat: target.category } });

                } else if (aromaticQs.length > 0) {

                    const target = aromaticQs[Math.floor(rnd() * aromaticQs.length)];

                    hmbc.push({ h_ppm: ar.ppm, c_ppm: target.ppm, type: "HMBC", assign: "HMBC", note: "Ar -> Ar Q", strength: "medium", meta: { protonCat: ar.category, carbonCat: target.category } });

                }

            });

        }

        // Rule 4b: General aromatic HMBC (Ar-H to Ar-Q ipso, Ar-H to C=O) for non-TAXANE/GLYCOPEPTIDE
        if (k.groups.aromaticC > 0 && k.context !== "GLYCOPEPTIDE" && k.context !== "PEPTIDE" && k.context !== "TAXANE") {
            const arHForHMBC = aromaticH.slice(0, Math.min(4, aromaticH.length));
            arHForHMBC.forEach(ar => {
                if (!isHMBCEligible(ar)) return;
                if (hmbc.length >= cfg.hmbc.maxTotalPairs) return;
                if (aromaticQs.length > 0) {
                    const target = aromaticQs[Math.floor(rnd() * aromaticQs.length)];
                    hmbc.push({ h_ppm: ar.ppm, c_ppm: target.ppm, type: "HMBC", assign: "HMBC", note: "Ar-H -> Ar Q (2J/3J)", strength: "medium", meta: { protonCat: ar.category, carbonCat: target.category } });
                }
                if (carbonyls.length > 0 && rnd() < 0.5) {
                    const target = carbonyls[Math.floor(rnd() * carbonyls.length)];
                    hmbc.push({ h_ppm: ar.ppm, c_ppm: target.ppm, type: "HMBC", assign: "HMBC", note: "Ar-H -> C=O (3J)", strength: "medium", meta: { protonCat: ar.category, carbonCat: target.category } });
                }
            });
        }

        

        // Rule 5: Anomeric H → glycosidic carbon / carbonyl

        anomericH.forEach(ano => {

            if (!isHMBCEligible(ano)) return;

            if (hmbc.length >= cfg.hmbc.maxTotalPairs) return;

            

            // AnomericH → 60-85 (O-CH) orta

            if (heteroCs.length > 0 && rnd() < 0.4) {

                const target = heteroCs[Math.floor(rnd() * heteroCs.length)];

                hmbc.push({ h_ppm: ano.ppm, c_ppm: target.ppm, type: "HMBC", assign: "HMBC", note: "AnoH -> Sugar C", strength: "medium", meta: { protonCat: ano.category, carbonCat: target.category } });

            }

            

            // Ester/acid varsa: anomericH → carbonyl zayıf/orta

            if ((k.groups.ester > 0 || k.groups.acid > 0) && carbonyls.length > 0 && rnd() < 0.2) {

                const target = carbonyls[Math.floor(rnd() * carbonyls.length)];

                hmbc.push({ h_ppm: ano.ppm, c_ppm: target.ppm, type: "HMBC", assign: "HMBC", note: "AnoH -> C=O", strength: "weak", meta: { protonCat: ano.category, carbonCat: target.category } });

            }

        });

        

        // Rule 6: Alpha/allylic/benzylic → carbonyl & sp2

        alphaToCarbonylH.forEach(alpha => {

            if (hmbc.length >= cfg.hmbc.maxTotalPairs) return;

            if (carbonyls.length > 0 && rnd() < 0.5) {

                const target = carbonyls[Math.floor(rnd() * carbonyls.length)];

                hmbc.push({ h_ppm: alpha.ppm, c_ppm: target.ppm, type: "HMBC", assign: "HMBC", note: "Alpha -> C=O", strength: "medium", meta: { protonCat: alpha.category, carbonCat: target.category } });

            }

        });

        

        allylicH.forEach(ally => {

            if (hmbc.length >= cfg.hmbc.maxTotalPairs) return;

            if (vinylicH.length > 0 && c13n.filter(c => inRange(c.ppm, [120, 145])).length > 0 && rnd() < 0.3) {

                const vinylicCs = c13n.filter(c => inRange(c.ppm, [120, 145]));

                const target = vinylicCs[Math.floor(rnd() * vinylicCs.length)];

                hmbc.push({ h_ppm: ally.ppm, c_ppm: target.ppm, type: "HMBC", assign: "HMBC", note: "Allylic -> Vin C", strength: "weak", meta: { protonCat: ally.category, carbonCat: target.category } });

            }

        });

        

        benzylicH.forEach(benz => {

            if (hmbc.length >= cfg.hmbc.maxTotalPairs) return;

            if (aromaticCs.length > 0 && rnd() < 0.4) {

                const target = aromaticCs[Math.floor(rnd() * aromaticCs.length)];

                hmbc.push({ h_ppm: benz.ppm, c_ppm: target.ppm, type: "HMBC", assign: "HMBC", note: "Benzylic -> Ar C", strength: "medium", meta: { protonCat: benz.category, carbonCat: target.category } });

            }

        });

        

        // 6C.7 Minimum HMBC production guarantee (if carbonyls or aromatic Q exist)

        if ((carbonyls.length > 0 || aromaticQs.length > 0) && hmbc.length < Math.min((carbonyls.length || 0) + (aromaticQs.length || 0), 6)) {

            const eligibleProtons = h1n.filter(p => !p.is_ex && p.ppm > 0.5);

            const needed = Math.min((carbonyls.length || 0) + (aromaticQs.length || 0), 6) - hmbc.length;

            

            for (let i = 0; i < needed && i < eligibleProtons.length && hmbc.length < cfg.hmbc.maxTotalPairs; i++) {

                const proton = eligibleProtons[i];

                const allTargets = [...carbonyls, ...aromaticQs];
                const target = allTargets[Math.floor(rnd() * allTargets.length)];

                hmbc.push({ 

                    h_ppm: proton.ppm, 

                    c_ppm: target.ppm, 

                    type: "HMBC", 

                    assign: "HMBC", 

                    note: target.ppm > 160 ? "H -> C=O" : "H -> Ar Q", 

                    strength: "medium", 

                    meta: { protonCat: proton.category, carbonCat: target.category } 

                });

            }

        }

        // 6C.8 Her karbonil ¹³C (δ>160, Q) için en az bir HMBC (Taxol karbonil kapsamı)
        const carbonylQsForHmbc = c13n.filter(c => c && c.type === "Q" && Number(c.ppm) > 160 && Number(c.ppm) < 230);
        const hmbcCoversC = (cPpm) => hmbc.some(h => h && h.h_ppm != null && h.c_ppm != null && Math.abs(Number(h.c_ppm) - cPpm) < 0.55);
        const pickProtonForCarbonyl = (co) => {
            const ppmC = Number(co.ppm);
            const poolP = h1n.filter(p => p && !p.is_ex && Number.isFinite(p.ppm));
            if (ppmC >= 165 && ppmC <= 178) {
                const om = poolP.find(p => isMethoxyProton(p));
                if (om) return om;
                const ac = poolP.find(p => isAcetateMeProton(p));
                if (ac) return ac;
            }
            if (ppmC >= 162 && ppmC <= 175 && (k.groups?.amide || 0) > 0) {
                const nh = poolP.find(p => p.ppm >= 6.0 && p.ppm <= 9.5 && (String(p.assign || "").toLowerCase().includes("nh") || String(p.mult || "").toLowerCase().includes("br")));
                if (nh) return nh;
            }
            if (ppmC >= 195) {
                const al = poolP.find(p => inRange(p.ppm, [2.0, 3.4]) && String(p.mult || "").toLowerCase().includes("m"));
                if (al) return al;
            }
            const ar = poolP.find(p => isAromaticProton(p));
            if (ar) return ar;
            return poolP[0] || null;
        };
        for (const co of carbonylQsForHmbc) {
            if (hmbc.length >= cfg.hmbc.maxTotalPairs) break;
            if (hmbcCoversC(Number(co.ppm))) continue;
            const hp = pickProtonForCarbonyl(co);
            if (!hp) continue;
            const keyF = `${Math.round(hp.ppm * 100)}|${Math.round(Number(co.ppm) * 10)}|forced`;
            if (hmbcSeen.has(keyF)) continue;
            hmbcSeen.add(keyF);
            hmbc.push({
                h_ppm: hp.ppm,
                c_ppm: co.ppm,
                type: "HMBC",
                assign: "HMBC",
                note: "Karbonil HMBC (minimum kapsam)",
                strength: "medium",
                meta: { protonCat: hp.category, carbonCat: co.category, forcedCarbonyl: true }
            });
        }

        

        // If still empty, add reason entry

        if (hmbc.length === 0) {

            if (carbonyls.length === 0 && aromaticQs.length === 0) {

                hmbc.push({ h_ppm: null, c_ppm: null, type: "HMBC", assign: "NO_HMBC_GENERATED", note: "No carbonyls or aromatic Q detected", reason: "No carbonyl or aromatic Q carbons for HMBC correlation" });

            } else {

                hmbc.push({ h_ppm: null, c_ppm: null, type: "HMBC", assign: "NO_HMBC_GENERATED", note: "No eligible protons", reason: "No eligible protons for HMBC correlation" });

            }

        }

        

        // 6D. NOESY Production (spatial correlation)

        // 6D.1 Activation conditions

        if (cfg.noesy.onlyIfMacroOrGlyco && k.context !== "MACROLIDE" && k.context !== "GLYCOPEPTIDE") {

            /** Küçük molekül: SMILES/kernel + ¹H deseninden teorik NOESY beklentisi (deneysel değil; doğrulama ayrı işaretler) */
            if (cfg.noesy.theoreticalSmallMol !== false) {

                const tmax = Math.min(Number(cfg.noesy.theoreticalMaxPairs ?? 10), Number(cfg.noesy.maxPairs ?? 12));

                const hTol = Math.max(Number(cfg.tolerances.noesy_ppm ?? cfg.tolerances.cosy_ppm ?? 0.03), 0.02);

                const seenTheoNoesy = new Set();

                const addTheoreticalNoesy = (ha, hb, strength, note) => {

                    const a = Number(ha), b = Number(hb);

                    if (!Number.isFinite(a) || !Number.isFinite(b)) return;

                    if (Math.abs(a - b) < hTol) return;

                    const lo = Math.min(a, b), hi = Math.max(a, b);

                    const undirected = `${Math.round(lo * 100)}_${Math.round(hi * 100)}`;

                    if (seenTheoNoesy.has(undirected)) return;

                    seenTheoNoesy.add(undirected);

                    const baseMeta = { source: "smiles_shift_heuristic", predicted: true, mw_Da: k.mass };

                    if (noesy.length < tmax) {

                        noesy.push({

                            h1_ppm: a,

                            h2_ppm: b,

                            type: "NOESY",

                            assign: "NOESY_THEORETICAL",

                            strength,

                            note,

                            meta: { ...baseMeta, symmetric: false }

                        });

                    }

                    if (noesy.length < tmax && Math.abs(a - b) >= hTol) {

                        noesy.push({

                            h1_ppm: b,

                            h2_ppm: a,

                            type: "NOESY",

                            assign: "NOESY_THEORETICAL",

                            strength,

                            note: (note || "") + " (f1/f2 simetrik)",

                            meta: { ...baseMeta, symmetric: true }

                        });

                    }

                };

                const eligibleSM = h1n.filter(p => !p.is_ex);
                const mg = k.molGraph && Array.isArray(k.molGraph.atoms) && Array.isArray(k.molGraph.adj) ? k.molGraph : null;

                // Faz-2: NOESY üretimi COSY kopyası yerine topolojik yakınlık (graf) üzerinden yapılır.
                // 3D yoksa bile 1-4 bağ içindeki proton taşıyan karbon çiftleri için uzaysal yakınlık olasılığına göre aday üretir.
                if (mg && eligibleSM.length >= 2) {
                    const atomH = (idx) => {
                        const a = mg.atoms[idx];
                        if (!a || String(a.element).toUpperCase() !== "C") return 0;
                        const sum = (mg.adj[idx] || []).reduce((acc, nb) => acc + Math.min(Number(nb.order) || 1, 2), 0);
                        return Math.max(0, Math.round(4 - sum));
                    };
                    const carbonNodes = mg.atoms
                        .map((a, idx) => ({ idx, a, h: atomH(idx) }))
                        .filter(x => String(x.a.element).toUpperCase() === "C" && x.h > 0);

                    const hasHeteroNeighbor = (idx) => (mg.adj[idx] || []).some(nb => {
                        const el = String(mg.atoms[nb.to]?.element || "").toUpperCase();
                        return el && el !== "C" && el !== "H";
                    });

                    const pools = {
                        aromatic: carbonNodes.filter(x => !!x.a.aromatic),
                        methyl: carbonNodes.filter(x => x.h >= 3),
                        heteroCH: carbonNodes.filter(x => x.h >= 1 && hasHeteroNeighbor(x.idx)),
                        aliphatic: carbonNodes.filter(x => !x.a.aromatic)
                    };

                    const pickPool = (p) => {
                        if (isAromaticProton(p) && pools.aromatic.length) return pools.aromatic;
                        if (isMethylProton(p) && pools.methyl.length) return pools.methyl;
                        if (isOxymethineProton(p) && pools.heteroCH.length) return pools.heteroCH;
                        if (p.ppm >= 2.8 && p.ppm <= 4.6 && pools.heteroCH.length) return pools.heteroCH;
                        return pools.aliphatic.length ? pools.aliphatic : carbonNodes;
                    };

                    const nodeUsage = new Map();
                    const assignNode = (p, i) => {
                        const pool = pickPool(p);
                        if (!pool.length) return null;
                        let best = pool[0];
                        let bestUse = nodeUsage.get(best.idx) || 0;
                        for (const cand of pool) {
                            const use = nodeUsage.get(cand.idx) || 0;
                            if (use < bestUse) { best = cand; bestUse = use; }
                        }
                        nodeUsage.set(best.idx, (nodeUsage.get(best.idx) || 0) + 1);
                        return best.idx;
                    };

                    const protonNodes = eligibleSM.map((p, i) => ({ p, node: assignNode(p, i) })).filter(x => Number.isInteger(x.node));

                    const hopDistance = (from, to, maxDepth = 4) => {
                        if (from === to) return 0;
                        const q = [{ n: from, d: 0 }];
                        const seen = new Set([from]);
                        while (q.length) {
                            const cur = q.shift();
                            if (cur.d >= maxDepth) continue;
                            for (const nb of (mg.adj[cur.n] || [])) {
                                if (seen.has(nb.to)) continue;
                                const nd = cur.d + 1;
                                if (nb.to === to) return nd;
                                seen.add(nb.to);
                                q.push({ n: nb.to, d: nd });
                            }
                        }
                        return Infinity;
                    };

                    const scored = [];
                    for (let i = 0; i < protonNodes.length; i++) {
                        for (let j = i + 1; j < protonNodes.length; j++) {
                            const a = protonNodes[i], b = protonNodes[j];
                            const hops = hopDistance(a.node, b.node, 4);
                            if (!Number.isFinite(hops) || hops < 1 || hops > 4) continue;
                            let strength = "very_weak";
                            let note = "Teorik: topolojik-uzaysal NOE adayı (3D doğrulama gerekli)";
                            if (hops <= 1) { strength = "strong"; note = "Teorik: geminal/çok yakın uzaysal proton çifti"; }
                            else if (hops === 2) { strength = "medium"; note = "Teorik: 1-2 bağ uzaklıkta uzaysal yakın protonlar"; }
                            else if (hops === 3) { strength = "weak"; note = "Teorik: 1-3 bağ uzaklıkta konformasyona bağlı NOE"; }
                            // 4 hop = very weak
                            const ringBoost = (mg.adj[a.node] || []).some(nb => nb.isRing) && (mg.adj[b.node] || []).some(nb => nb.isRing);
                            const score = (hops === 1 ? 1.0 : hops === 2 ? 0.8 : hops === 3 ? 0.5 : 0.3) + (ringBoost ? 0.15 : 0);
                            scored.push({ a, b, strength: ringBoost && strength === "weak" ? "medium" : strength, note, score, hops });
                        }
                    }

                    scored.sort((x, y) => y.score - x.score);
                    for (const c of scored) {
                        if (noesy.length >= tmax) break;
                        addTheoreticalNoesy(c.a.p.ppm, c.b.p.ppm, c.strength, `${c.note}; hop=${c.hops}`);
                    }
                } else {
                    // Grafik yoksa, COSY kopyalamadan sınırlı kimyasal-çevre heuristiği kullan.
                    if ((k.groups?.aromaticC ?? 0) > 0) {
                        const benzL = eligibleSM.filter(p => inRange(p.ppm, [2.1, 3.05]));
                        const aromL = eligibleSM.filter(p => isAromaticProton(p));
                        for (const b of benzL) {
                            for (const ar of aromL) {
                                addTheoreticalNoesy(b.ppm, ar.ppm, "medium", "Teorik: benzil — aromatik proton uzaysal yakınlık (graf yok, fallback)");
                                if (noesy.length >= tmax) break;
                            }
                            if (noesy.length >= tmax) break;
                        }
                    }
                    const meL = eligibleSM.filter(p => isMethylProton(p) && inRange(p.ppm, [0.75, 1.55]));
                    const ochL = eligibleSM.filter(p => isOxymethineProton(p) || inRange(p.ppm, [2.9, 4.35]));
                    for (const m of meL) {
                        for (const o of ochL) {
                            addTheoreticalNoesy(m.ppm, o.ppm, "weak", "Teorik: metil — heteroatom-α CH (graf yok, fallback)");
                            if (noesy.length >= tmax) break;
                        }
                        if (noesy.length >= tmax) break;
                    }
                }

            }

            if (noesy.length === 0) {

                noesy.push({

                    h1_ppm: null,

                    h2_ppm: null,

                    type: "NOESY",

                    assign: "NOESY_EMPTY",

                    note: "No NOESY correlations generated",

                    reason: "Small-molecule context: no theoretical/heuristic NOESY edges"

                });

            }

        } else {

            const eligible = h1n.filter(p => !p.is_ex);

            

            // 6D.2 Proton pools

            const methylProtons = eligible.filter(p => isMethylProton(p) && inRange(p.ppm, [0.8, 1.4]));

            const oxymethineProtons = eligible.filter(p => isOxymethineProton(p));

            const anomericProtons = eligible.filter(p => isAnomericProton(p));

            const aromaticProtons = eligible.filter(p => isAromaticProton(p));

            

            // 6D.3 NOESY rule set (expanded)

            // Rule 1: Folding signature (macrocycle)

            if (k.context === "MACROLIDE" && eligible.length > 5) {

                const early = eligible.find(p => p.ppm >= 4.8 && p.ppm <= 5.5) || eligible.find(p => p.ppm >= 3.8 && p.ppm <= 4.5);

                const late = methylProtons[0];

                if (early && late && noesy.length < cfg.noesy.maxPairs) {

                    noesy.push({ h1_ppm: early.ppm, h2_ppm: late.ppm, type: "NOESY", assign: "NOESY", strength: "strong", note: "Spatial Folding" });

                }

            }

            

            // Rule 2: Sugar-aglycone proximity

            if (k.context === "GLYCOPEPTIDE") {

                if (anomericProtons.length > 0 && aromaticProtons.length > 0 && noesy.length < cfg.noesy.maxPairs) {

                    const ano = anomericProtons[0];

                    const ar = aromaticProtons[0];

                    noesy.push({ h1_ppm: ano.ppm, h2_ppm: ar.ppm, type: "NOESY", assign: "NOESY", strength: "weak", note: "Sugar-Aryl proximity" });

                }

                

                if (anomericProtons.length > 0 && benzylicH.length > 0 && noesy.length < cfg.noesy.maxPairs) {

                    const ano = anomericProtons[0];

                    const benz = benzylicH[0];

                    noesy.push({ h1_ppm: ano.ppm, h2_ppm: benz.ppm, type: "NOESY", assign: "NOESY", strength: "medium", note: "Sugar-Aryl proximity" });

                }

            }

            

            // Rule 3: Aromatic stacking (glyco)

            if (k.context === "GLYCOPEPTIDE" && aromaticProtons.length >= 2 && noesy.length < cfg.noesy.maxPairs) {

                const ar1 = aromaticProtons[0];

                const ar2 = aromaticProtons[1];

                if (Math.abs(ar1.ppm - ar2.ppm) > 0.5) {

                    noesy.push({ h1_ppm: ar1.ppm, h2_ppm: ar2.ppm, type: "NOESY", assign: "NOESY", strength: "weak", note: "Aromatic stacking" });

                }

            }

            

            // 6D.4 Minimum NOESY production guarantee (MACROLIDE/GLYCOPEPTIDE)

            if ((k.context === "MACROLIDE" || k.context === "GLYCOPEPTIDE") && noesy.length === 0 && eligible.length >= 2) {

                // Generate at least 1-3 spatial edges

                const minPairs = Math.min(3, Math.floor(eligible.length / 2));

                for (let i = 0; i < minPairs && noesy.length < cfg.noesy.maxPairs; i++) {

                    const p1 = eligible[i * 2];

                    const p2 = eligible[i * 2 + 1];

                    if (p1 && p2 && Math.abs(p1.ppm - p2.ppm) > 1.0) {

                        noesy.push({ 

                            h1_ppm: p1.ppm, 

                            h2_ppm: p2.ppm, 

                            type: "NOESY", 

                            assign: "NOESY", 

                            strength: "medium", 

                            note: "Spatial proximity" 

                        });

                    }

                }

            }

            

            // If NOESY still empty, add reason entry

            if (noesy.length === 0) {

                noesy.push({ 

                    h1_ppm: null, 

                    h2_ppm: null, 

                    type: "NOESY", 

                    assign: "NOESY_EMPTY", 

                    note: "No NOESY correlations generated", 

                    reason: "Insufficient eligible protons or context constraints" 

                });

            }

        }

        }

        

        // v33 PHYSICAL VETO: Q-carbon HSQC'de fiziksel olarak imkansız – üretim aşamasında maskeleme
        const isQCarbon = (cPpm) => { const carb = c13n.find(c => Math.abs((c.ppm||0) - (cPpm||0)) < 0.05); const t = String(carb?.type||"").toUpperCase(); return carb && (t === "Q" || t === "CQ"); };
        const hsqcFiltered = hsqc.filter(x => { if (x.c != null && isQCarbon(x.c)) return false; if (x.meta && x.meta.type === "Q") return false; return true; });

        // 6F. HSQC deduplikasyon (aynı H,C çifti tekrar eklenmesin)

        const HSQC_TOL = 0.02;

        const hsqcKey = (x) => `${Math.round((x.h||0)/HSQC_TOL)*HSQC_TOL}|${Math.round((x.c||0)/HSQC_TOL)*HSQC_TOL}`;

        const seenHsqc = new Set();

        const hsqcDedup = hsqcFiltered.filter(x => { const k = hsqcKey(x); if (seenHsqc.has(k)) return false; seenHsqc.add(k); return true; });

        

        // 6F. Final Output

        return {

            hsqc: hsqcDedup,

            cosy,

            hmbc,

            noesy,

            unassigned: { hsqc: UNASSIGNED },

            meta: {

                usedCarbonIdsCount: hsqcCarbonLinkCounts.size,

                hsqcCarbonLinkTotal: Array.from(hsqcCarbonLinkCounts.values()).reduce((a, b) => a + b, 0),

                expectations: expect,

                warnings,

                params: cfg

            }

        };

    };

    // 2D render guardrail:
    // If a modality has no generated entries, synthesize deterministic theoretical
    // rows so UI always shows numeric interactions instead of an empty block.
    const ensure2DCorrelationsVisible = (corrData, h1List, c13List, kernel) => {
        const src = corrData || {};
        const h1 = Array.isArray(h1List) ? h1List : [];
        const c13 = Array.isArray(c13List) ? c13List : [];
        const hsqc = Array.isArray(src.hsqc) ? [...src.hsqc] : [];
        const cosy = Array.isArray(src.cosy) ? [...src.cosy] : [];
        const hmbc = Array.isArray(src.hmbc) ? [...src.hmbc] : [];
        const noesy = Array.isArray(src.noesy) ? [...src.noesy] : [];

        const numericH = h1
            .map(p => Number(p?.ppm))
            .filter(v => Number.isFinite(v));
        const numericC = c13
            .map(p => Number(p?.ppm))
            .filter(v => Number.isFinite(v));

        const fallbackMeta = [];
        const addMeta = (mod, note) => fallbackMeta.push({ modality: mod, note });

        const hasTerminalAldehyde = (() => {
            const s = String(kernel?.smiles || "");
            return /\[CH\]=O/.test(s) || /C\(=O\)\[H\]/.test(s);
        })();
        const protonatedCarbonPpm = c13
            .filter(c => {
                const t = String(c?.type || "").toUpperCase();
                const a = String(c?.assign || "");
                const ppm = Number(c?.ppm);
                if (!Number.isFinite(ppm)) return false;
                if (t === "Q" || t === "CQ") return false;
                if (ppm >= 160 && !hasTerminalAldehyde) return false;
                if (/Ketone|Ester|Amide|Ar-C \(ipso\)|Carbonyl/i.test(a)) return false;
                return true;
            })
            .map(c => Number(c.ppm));

        const chemicalCompatibility = (h, c) => {
            if (h >= 9.0 && h <= 12.0) return false;
            if (h >= 6.5 && h <= 9.5) return c >= 100 && c <= 165;
            if (h >= 4.5 && h <= 6.5) return c >= 80 && c <= 155;
            if (h >= 3.0 && h <= 4.5) return c >= 50 && c <= 100;
            if (h >= 2.0 && h <= 3.5) return c >= 30 && c <= 70;
            if (h >= 0.5 && h <= 2.5) return c >= 10 && c <= 50;
            return false;
        };

        if (hsqc.length === 0 && numericH.length > 0 && protonatedCarbonPpm.length > 0) {
            const sortedH = [...numericH].sort((a, b) => b - a);
            const size = Math.min(12, sortedH.length);
            for (let i = 0; i < size; i++) {
                const h = sortedH[i];
                const match = protonatedCarbonPpm.find(c => chemicalCompatibility(h, c));
                if (!Number.isFinite(match)) continue;
                hsqc.push({
                    h,
                    c: match,
                    assign: "THEORETICAL_FALLBACK_HSQC",
                    note: "Q-carbon veto + shift-compat fallback"
                });
            }
            addMeta("HSQC", "Generated deterministic fallback pairs");
        }

        if (cosy.length === 0 && numericH.length >= 2) {
            const sortedH = [...numericH].sort((a, b) => a - b);
            for (let i = 0; i < Math.min(10, sortedH.length - 1); i++) {
                cosy.push({
                    h1: sortedH[i],
                    h2: sortedH[i + 1],
                    type: "COSY",
                    assign: "THEORETICAL_FALLBACK_COSY",
                    note: "Nearest-neighbor coupling hypothesis"
                });
            }
            addMeta("COSY", "Generated nearest-neighbor proton network");
        }

        if (hmbc.length === 0 && numericH.length > 0 && numericC.length > 0) {
            const carbonylLike = [...numericC].filter(c => c >= 160 && c <= 220);
            const targetC = carbonylLike.length > 0 ? carbonylLike : numericC;
            for (let i = 0; i < Math.min(8, numericH.length, targetC.length); i++) {
                hmbc.push({
                    h_ppm: numericH[i],
                    c_ppm: targetC[i % targetC.length],
                    type: "HMBC",
                    assign: "THEORETICAL_FALLBACK_HMBC",
                    note: "Long-range theoretical path"
                });
            }
            addMeta("HMBC", "Generated theoretical long-range correlations");
        }

        if (noesy.length === 0 && numericH.length >= 2) {
            const sortedH = [...numericH].sort((a, b) => a - b);
            const maxPairs = Math.min(6, Math.floor(sortedH.length / 2));
            for (let i = 0; i < maxPairs; i++) {
                noesy.push({
                    h1_ppm: sortedH[i],
                    h2_ppm: sortedH[sortedH.length - 1 - i],
                    type: "NOESY",
                    assign: "THEORETICAL_FALLBACK_NOESY",
                    note: "Spatial proximity hypothesis"
                });
            }
            addMeta("NOESY", "Generated theoretical proximity pairs");
        }

        return {
            hsqc,
            cosy,
            hmbc,
            noesy,
            unassigned: src.unassigned || { hsqc: [] },
            meta: {
                ...(src.meta || {}),
                fallback_visibility_applied: fallbackMeta.length > 0,
                fallback_notes: fallbackMeta,
                context: kernel?.context || null
            }
        };
    };



    // ==========================================

    // DETAYLI METHYL CLASS AUDIT MODÜLÜ

    // ==========================================

    const methylClassAudit = (k, h1, c13, hsqc) => {

        // Helper: In range check

        const inRange = (x, [a, b]) => x >= a && x <= b;

        const report = {

            expected_methyls: [],

            observed_methyls: { C: [], H: [] },

            matches: [],

            mismatches: [],

            missing: [],

            suspicious: [],

            fix_suggestions: []

        };

        

        // Methyl class windows (ppm ranges)

        const METHYL_WINDOWS = {

            OCH3: { H: [3.20, 3.95], C: [55, 61], mult: "s", integral: 3 },

            NCH3: { H: [2.2, 3.2], C: [28, 45], mult: "s", integral: 3 },

            AcylCH3: { H: [1.9, 2.2], C: [19, 23], mult: "s", integral: 3 },

            AlkylCH3: { H: [0.7, 1.5], C: [8, 25], mult: ["d", "t", "s"], integral: 3 },

            SugarCH3: { H: [1.0, 1.4], C: [14, 22], mult: "d", integral: 3, J: "~6 Hz" }

        };

        

        // 1. Extract expected methyls from SMILES/structure

        const extractExpectedMethyls = () => {

            const expected = [];

            const smiles = k.smiles || "";

            const groups = k.groups || {};

            

            // Methoxy detection: C(=O)O or OC patterns

            const methoxyCount = groups.methoxy || 0;

            for(let i=0; i<methoxyCount; i++) {

                expected.push({

                    class: "OCH3",

                    index: i+1,

                    source: "SMILES_pattern",

                    window: METHYL_WINDOWS.OCH3

                });

            }

            

            // N-Methyl detection

            const nMeCount = groups.nMethyl || 0;

            for(let i=0; i<nMeCount; i++) {

                expected.push({

                    class: "NCH3",

                    index: i+1,

                    source: "SMILES_pattern",

                    window: METHYL_WINDOWS.NCH3

                });

            }

            

            // Acetate detection

            const acetateCount = groups.ester || 0;

            if (k.context === "TAXANE" || k.context === "GLYCOPEPTIDE") {

                for(let i=0; i<Math.min(acetateCount, 4); i++) {

                    expected.push({

                        class: "AcylCH3",

                        index: i+1,

                        source: "context_ester",

                        window: METHYL_WINDOWS.AcylCH3

                    });

                }

            }

            

            // Alkyl methyls (from structure analysis)

            const alkylCount = Math.max(0, (k.counts.C || 0) - (groups.aromaticC || 0) * 2);

            const estimatedAlkyl = Math.floor(alkylCount * 0.1); // Rough estimate

            for(let i=0; i<estimatedAlkyl; i++) {

                expected.push({

                    class: "AlkylCH3",

                    index: i+1,

                    source: "structure_estimate",

                    window: METHYL_WINDOWS.AlkylCH3

                });

            }

            

            return expected;

        };

        

        // 2. Find CH3 candidates in 13C

        const findCH3CandidatesInC13 = () => {

            return (c13 || []).filter(c => {

                if (c.type === "CH3") return true;

                // If type not assigned, check ppm windows

                if (!c.type && c.ppm >= 8 && c.ppm <= 61) {

                    // Could be CH3, assign probability

                    return true;

                }

                return false;

            }).map(c => ({

                ppm: c.ppm,

                type: c.type || "CH3?",

                assign: c.assign || "",

                category: c.category || "",

                class: classifyMethylFromC13(c.ppm, c.type)

            }));

        };

        

        // 3. Find 3H candidates in 1H

        const find3HCandidatesInH1 = () => {

            return (h1 || []).filter(h => {

                if (h.is_ex) return false;

                const integ = parseIntegralValue(h.integ);

                return integ >= 2.7 && integ <= 3.3; // 3H with tolerance

            }).map(h => ({

                ppm: h.ppm,

                mult: h.mult || "",

                integ: h.integ || "",

                assign: h.assign || "",

                class: classifyMethylFromH1(h.ppm, h.mult, h.integ)

            }));

        };

        

        // 4. Classify methyl from 13C ppm

        const classifyMethylFromC13 = (ppm, type) => {

            if (inRange(ppm, [55, 61])) return "OCH3";

            if (inRange(ppm, [28, 45])) return "NCH3";

            if (inRange(ppm, [19, 23])) return "AcylCH3";

            if (inRange(ppm, [14, 22])) return "SugarCH3";

            if (inRange(ppm, [8, 25])) return "AlkylCH3";

            return "Unknown";

        };

        

        // 5. Classify methyl from 1H ppm

        const classifyMethylFromH1 = (ppm, mult, integ) => {

            if (inRange(ppm, [3.20, 3.95]) && mult === "s") return "OCH3";

            if (inRange(ppm, [2.2, 3.2]) && mult === "s") return "NCH3";

            if (inRange(ppm, [1.9, 2.2]) && mult === "s") return "AcylCH3";

            if (inRange(ppm, [1.0, 1.4]) && mult === "d") return "SugarCH3";

            if (inRange(ppm, [0.7, 1.5])) return "AlkylCH3";

            return "Unknown";

        };

        

        // 6. Build HSQC CH3 mapping

        const buildHSQCMapping = () => {

            const hsqcCH3 = (hsqc || []).filter(pair => {

                if (!pair.c || pair.c === null) return false;

                const cPeak = c13.find(c => Math.abs(c.ppm - pair.c) < 0.5);

                return cPeak && (cPeak.type === "CH3" || inRange(pair.c, [8, 61]));

            });

            

            const mapping = new Map();

            hsqcCH3.forEach(pair => {

                const key = `${pair.h.toFixed(2)}|${pair.c.toFixed(1)}`;

                mapping.set(key, {

                    h: pair.h,

                    c: pair.c,

                    type: pair.type || "HSQC",

                    assign: pair.assign || ""

                });

            });

            return mapping;

        };

        

        // 7. Main audit logic

        const expected = extractExpectedMethyls();

        const observed_C = findCH3CandidatesInC13();

        const observed_H = find3HCandidatesInH1();

        const hsqcMap = buildHSQCMapping();

        

        report.expected_methyls = expected;

        report.observed_methyls.C = observed_C;

        report.observed_methyls.H = observed_H;

        

        // Match expected with observed

        expected.forEach(exp => {

            const window = exp.window;

            const cCandidates = observed_C.filter(c => inRange(c.ppm, window.C));

            const hCandidates = observed_H.filter(h => inRange(h.ppm, window.H));

            

            // Try HSQC match first

            let hsqcMatch = null;

            for(const [key, pair] of hsqcMap.entries()) {

                if (inRange(pair.h, window.H) && inRange(pair.c, window.C)) {

                    hsqcMatch = pair;

                    break;

                }

            }

            

            if (hsqcMatch) {

                report.matches.push({

                    expected: exp,

                    observed: { H: hsqcMatch.h, C: hsqcMatch.c },

                    confidence: "HIGH",

                    evidence: "HSQC",

                    status: "PASS"

                });

            } else if (cCandidates.length > 0 && hCandidates.length > 0) {

                // Weak match: both exist but no HSQC

                report.suspicious.push({

                    expected: exp,

                    observed: { C: cCandidates[0], H: hCandidates[0] },

                    confidence: "MEDIUM",

                    evidence: "separate_C_and_H",

                    status: "AMBIGUOUS",

                    reason: "HSQC crosspeak missing"

                });

            } else if (cCandidates.length > 0 && hCandidates.length === 0) {

                // C exists but H missing

                report.mismatches.push({

                    expected: exp,

                    observed: { C: cCandidates[0], H: null },

                    status: "FAIL",

                    reason: "H-missing",

                    fix: "Check 1H peak table truncation, solvent suppression, or integral threshold"

                });

            } else if (cCandidates.length === 0 && hCandidates.length > 0) {

                // H exists but C missing

                report.mismatches.push({

                    expected: exp,

                    observed: { C: null, H: hCandidates[0] },

                    status: "FAIL",

                    reason: "C-missing",

                    fix: "Check 13C peak picking, binning overlap, or DEPT/HSQC edit assignment"

                });

            } else {

                // Both missing

                report.missing.push({

                    expected: exp,

                    status: "MISSING",

                    reason: "No evidence in either 1H or 13C"

                });

            }

        });

        

        // Generate fix suggestions

        if (report.mismatches.length > 0) {

            report.mismatches.forEach(m => {

                if (m.reason === "H-missing") {

                    report.fix_suggestions.push({

                        issue: `${m.expected.class} H signal missing`,

                        action: "Check 1H peak table export (full range 0.5-8.5 ppm), reduce integral threshold, check solvent suppression settings"

                    });

                } else if (m.reason === "C-missing") {

                    report.fix_suggestions.push({

                        issue: `${m.expected.class} C signal missing`,

                        action: "Check 13C peak picking, reduce bin size, verify DEPT/HSQC edit CH3 assignment"

                    });

                }

            });

        }

        

        return report;

    };

    

    // ==========================================

    // ŞEKER BÖLGESİ DOĞRULAMA VE ATAMA MODÜLÜ

    // ==========================================

    const sugarRegionAssignment = (h1, c13, hsqc, cosy, hmbc, k) => {

        // Helper: In range check

        const inRange = (x, [a, b]) => x >= a && x <= b;

        const report = {

            nodes: [],

            assignments: [],

            chains: [],

            missing: [],

            contradictions: [],

            coverage: { expected: 0, observed: 0, ratio: 0 }

        };

        

        // Sugar region windows

        const SUGAR_WINDOWS = {

            anomeric: { H: [4.2, 5.5], C: [95, 105] },

            sugar_CH: { H: [3.0, 4.5], C: [68, 78] },

            sugar_CH2: { H: [3.0, 4.5], C: [60, 66] },

            methoxy: { H: [3.2, 3.95], C: [55, 61] },

            alpha_CH: { H: [3.0, 5.5], C: [50, 70] }

        };

        

        // 1. Build nodes from HSQC (3.0-4.5 ppm region)

        const buildNodesFromHSQC = () => {

            const nodes = [];

            const sugarHSQC = (hsqc || []).filter(pair => {

                if (!pair.c || pair.c === null) return false;

                return inRange(pair.h, [3.0, 4.5]) && inRange(pair.c, [50, 90]);

            });

            

            sugarHSQC.forEach(pair => {

                const cPeak = c13.find(c => Math.abs(c.ppm - pair.c) < 0.5);

                const hPeak = h1.find(h => Math.abs(h.ppm - pair.h) < 0.05);

                

                nodes.push({

                    Hppm: pair.h,

                    Cppm: pair.c,

                    type: cPeak?.type || "CH",

                    intensity: pair.intensity || 1.0,

                    assign: classifySugarNode(pair.h, pair.c, cPeak?.type),

                    hPeak: hPeak,

                    cPeak: cPeak

                });

            });

            

            return nodes;

        };

        

        // 2. Classify sugar node

        const classifySugarNode = (hPpm, cPpm, type) => {

            if (inRange(cPpm, [55, 61]) && type === "CH3") return "Methoxy";

            if (inRange(cPpm, [60, 66]) && type === "CH2") return "Sugar_C6_candidate";

            if (inRange(cPpm, [68, 78]) && type === "CH") return "Sugar_ring_candidate";

            if (inRange(cPpm, [50, 70]) && type === "CH") return "AlphaCH_or_Sugar_ambiguous";

            if (inRange(cPpm, [95, 105]) && type === "CH") return "Anomeric_C1";

            return "Unknown";

        };

        

        // 3. Build graph from COSY

        const buildGraph = (nodes, cosyEdges) => {

            const graph = new Map();

            nodes.forEach(node => {

                graph.set(node.Hppm, []);

            });

            

            (cosyEdges || []).forEach(edge => {

                const h1 = edge.h1 || edge[0];

                const h2 = edge.h2 || edge[1];

                if (inRange(h1, [3.0, 4.5]) && inRange(h2, [3.0, 4.5])) {

                    const node1 = nodes.find(n => Math.abs(n.Hppm - h1) < 0.05);

                    const node2 = nodes.find(n => Math.abs(n.Hppm - h2) < 0.05);

                    if (node1 && node2) {

                        graph.get(node1.Hppm).push(node2.Hppm);

                        graph.get(node2.Hppm).push(node1.Hppm);

                    }

                }

            });

            

            return graph;

        };

        

        // 4. Find best sugar chain candidate

        const findBestSugarChain = (nodes, graph) => {

            // Simple heuristic: find longest connected path ending with CH2

            const chains = [];

            const visited = new Set();

            

            nodes.forEach(startNode => {

                if (visited.has(startNode.Hppm)) return;

                

                const chain = [startNode];

                const queue = [startNode];

                visited.add(startNode.Hppm);

                

                while(queue.length > 0) {

                    const current = queue.shift();

                    const neighbors = graph.get(current.Hppm) || [];

                    

                    neighbors.forEach(neighborH => {

                        if (!visited.has(neighborH)) {

                            const neighborNode = nodes.find(n => Math.abs(n.Hppm - neighborH) < 0.05);

                            if (neighborNode && inRange(neighborNode.Hppm, [3.0, 4.5])) {

                                chain.push(neighborNode);

                                queue.push(neighborNode);

                                visited.add(neighborH);

                            }

                        }

                    });

                }

                

                if (chain.length >= 3) {

                    chains.push(chain);

                }

            });

            

            // Prefer chain ending with CH2 (C6)

            const chainWithCH2 = chains.find(c => c.some(n => n.assign === "Sugar_C6_candidate"));

            return chainWithCH2 || chains[0] || [];

        };

        

        // 5. Assign C2-C6 numbers

        const assignSugarNumbers = (chain) => {

            const assignments = [];

            

            // Find anomeric (C1) if exists

            const anomeric = chain.find(n => n.assign === "Anomeric_C1");

            if (anomeric) {

                assignments.push({ ...anomeric, sugarPosition: "C1" });

                // Walk forward

                let current = anomeric;

                let position = 2;

                while(position <= 6 && current) {

                    // Find next in chain (simplified)

                    const next = chain.find(n => 

                        n !== current && 

                        Math.abs(n.Hppm - current.Hppm) < 1.0 &&

                        n.assign.includes("Sugar")

                    );

                    if (next) {

                        assignments.push({ ...next, sugarPosition: `C${position}` });

                        current = next;

                        position++;

                    } else {

                        break;

                    }

                }

            } else {

                // Find CH2 (C6) and walk back

                const c6 = chain.find(n => n.assign === "Sugar_C6_candidate");

                if (c6) {

                    assignments.push({ ...c6, sugarPosition: "C6" });

                    // Simplified backward walk

                    let position = 5;

                    chain.filter(n => n !== c6 && n.assign.includes("Sugar")).forEach(n => {

                        if (position >= 2) {

                            assignments.push({ ...n, sugarPosition: `C${position}` });

                            position--;

                        }

                    });

                } else {

                    // Partial assignment

                    chain.forEach(n => {

                        if (n.assign.includes("Sugar")) {

                            assignments.push({ ...n, sugarPosition: "Sugar_CH (unindexed)" });

                        }

                    });

                }

            }

            

            return assignments;

        };

        

        // 6. Validate coverage

        const validateCoverage = (nodes, assignments) => {

            const expectedSugarCarbons = k.context === "GLYCOPEPTIDE" ? 

                Math.ceil((k.counts.O || 0) * 0.3) : 0;

            const observedSugarNodes = nodes.filter(n => n.assign.includes("Sugar")).length;

            

            report.coverage = {

                expected: expectedSugarCarbons,

                observed: observedSugarNodes,

                ratio: expectedSugarCarbons > 0 ? observedSugarNodes / expectedSugarCarbons : 0

            };

            

            if (report.coverage.ratio < 0.7) {

                report.missing.push({

                    type: "Sugar_CH_low_coverage",

                    expected: expectedSugarCarbons,

                    observed: observedSugarNodes,

                    reason: "HSQC coverage low or peak table truncated"

                });

            }

        };

        

        // Main execution

        const nodes = buildNodesFromHSQC();

        const graph = buildGraph(nodes, cosy);

        const chain = findBestSugarChain(nodes, graph);

        const assignments = assignSugarNumbers(chain);

        

        report.nodes = nodes;

        report.assignments = assignments;

        report.chains = chain.length > 0 ? [chain] : [];

        

        validateCoverage(nodes, assignments);

        

        return report;

    };

    

    const auditReport = (k, h1, c13, ms, ir, corr) => {

        spectromasterDebug("auditReport:start", { smiles: (k && (k.smiles || k.rawSmiles)) || null, h1: (h1 && h1.length) || 0, c13: (c13 && c13.length) || 0 });

        // 7.1 Output Schema

        const issues = [];

        const warnings = [];

        const info = [];

        const suggestions = [];

        let status = "VALIDATED";

        let score = 100;

        let confidence = 1.0;
        const isFileProtocol = typeof window !== "undefined" && window?.location?.protocol === "file:";
        const graphAvailable = !!(k?.molGraph && Array.isArray(k.molGraph.atoms) && k.molGraph.atoms.length > 0);
        if (isFileProtocol && !graphAvailable) {
            issues.push({
                level: "ERROR",
                code: "GLOBAL_FILE_PROTOCOL_GRAPH_FALLBACK_REQUIRED",
                message: "file:// modunda authoritative graph bulunamadı.",
                metric: { protocol: "file", graph_available: false },
                evidence: { source: "kernel.molGraph" },
                fix: [{ action: "repair", target: "GRAPH", params: { enableDeterministicLocalGraph: true }, why: "Graph-first authority zorunlu." }]
            });
            score -= 12;
            status = "FAILED";
        }

        

        // 7.2 Tolerances & Thresholds

        const T = {

            ppmH: 0.02,

            ppmC: 0.25,

            ppmIR: 10,

            ppmMS: 5e-6,

            binC13: 0.5,

            maxPerCbin: 2

        };

        

        const TH = {

            hIntegralRatioMin: 0.75,

            hIntegralRatioMax: 1.25,

            hExchMaxFrac: 0.35,

            cCountMinFrac: 0.65,

            cCountMaxFrac: 1.05,

            carbonylMinFrac: 0.50,

            hsqcAssignedMin: 0.75,

            hsqcCH3Min: 0.85,

            aromaticMinMatch: 0.70

        };

        

        // Context overrides

        /** Çoklu aromatik / glikopeptid yapılarda 13C sinyal sayısı literatürde nominal C’den düşük olabilir — QC taban eşiğini bağlama göre gevşetir. */

        function spectromasterEffectiveC13MinRatio(kernel, baseFrac) {

            let m = baseFrac;

            const s = String(kernel.smiles || kernel.rawSmiles || "");

            const phenylN = (s.match(/c1ccccc1|C1=CC=CC=C1/gi) || []).length;

            if (phenylN >= 2) m = Math.min(m, 0.52);

            if (phenylN >= 3) m = Math.min(m, 0.48);

            if (phenylN >= 4) m = Math.min(m, 0.44);

            if (kernel.context === "GLYCOPEPTIDE" || ((kernel.counts?.Cl || 0) >= 1 && /NC\(=O\)/.test(s) && /O[C@H]?[0-9]/.test(s))) {

                m = Math.min(m, 0.35);

            }

            const stereoCC13 = (s.match(/[\/\\]C=C[\/\\]/g) || []).length;

            if (kernel.context === "MACROLIDE" && stereoCC13 >= 2) m = Math.min(m, 0.40);

            if (kernel.context === "TAXANE" && phenylN >= 2) m = Math.min(m, 0.49);

            if ((kernel.counts?.C || 0) >= 40) m = Math.min(m, 0.36);

            if ((kernel.counts?.C || 0) >= 55) m = Math.min(m, 0.32);

            return m;

        }

        const contextThresholds = {

            MACROLIDE: { ...TH, cCountMinFrac: 0.48, carbonylMinFrac: 0.40, aromaticMinMatch: 0.60 },

            TAXANE: { ...TH, cCountMinFrac: 0.50, carbonylMinFrac: 0.60, aromaticMinMatch: 0.75 },

            GLYCOPEPTIDE: { ...TH, cCountMinFrac: 0.42, carbonylMinFrac: 0.55, aromaticMinMatch: 0.80 },

            PEPTIDE: { ...TH, carbonylMinFrac: 0.50, aromaticMinMatch: 0.70 },

            GENERAL: TH

        };

        

        const thresholds = contextThresholds[k.context] || TH;

        const cMinEff = spectromasterEffectiveC13MinRatio(k, thresholds.cCountMinFrac);

        

        // Safe access

        const safeH1 = Array.isArray(h1) ? h1 : [];

        const safeC13 = Array.isArray(c13) ? c13 : [];

        const safeCorrRaw = corr || { hsqc: [], cosy: [], hmbc: [], noesy: [] };
        const isDisplayFallbackRow = (row) => {
            const a = String(row?.assign || "");
            return a.startsWith("THEORETICAL_FALLBACK_") || a === "NOESY_THEORETICAL" || row?.is_display_only === true || row?.derived_from_fallback === true;
        };
        const pickAuthoritative = (rows) => (Array.isArray(rows) ? rows.filter(r => !isDisplayFallbackRow(r)) : []);
        const safeCorr = {
            hsqc: pickAuthoritative(safeCorrRaw.hsqc),
            cosy: pickAuthoritative(safeCorrRaw.cosy),
            hmbc: pickAuthoritative(safeCorrRaw.hmbc),
            noesy: pickAuthoritative(safeCorrRaw.noesy),
        };
        const fallbackCorr = {
            hsqc: (Array.isArray(safeCorrRaw.hsqc) ? safeCorrRaw.hsqc : []).filter(isDisplayFallbackRow),
            cosy: (Array.isArray(safeCorrRaw.cosy) ? safeCorrRaw.cosy : []).filter(isDisplayFallbackRow),
            hmbc: (Array.isArray(safeCorrRaw.hmbc) ? safeCorrRaw.hmbc : []).filter(isDisplayFallbackRow),
            noesy: (Array.isArray(safeCorrRaw.noesy) ? safeCorrRaw.noesy : []).filter(isDisplayFallbackRow),
        };
        const fallbackCount = fallbackCorr.hsqc.length + fallbackCorr.cosy.length + fallbackCorr.hmbc.length + fallbackCorr.noesy.length;
        if (fallbackCount > 0) {
            warnings.push(createIssue("INFO", "GLOBAL_FALLBACK_NOT_AUTHORITATIVE",
                `${fallbackCount} adet display-only fallback 2D kayıt score dışında tutuldu.`,
                { fallback_count: fallbackCount },
                { fallback_breakdown: { hsqc: fallbackCorr.hsqc.length, cosy: fallbackCorr.cosy.length, hmbc: fallbackCorr.hmbc.length, noesy: fallbackCorr.noesy.length } },
                [{ action: "note", target: "SCORING", params: { exclude_display_fallback: true }, why: "Fallback görünürlük amaçlıdır, kanıt değildir." }]));
        }

        const safeMS = Array.isArray(ms) ? ms : [];

        const safeIR = Array.isArray(ir) ? ir : [];

        

        // Helper: Issue object creator

        function createIssue(level, code, message, metric = {}, evidence = {}, fix = []) {
            return { level, code, message, metric, evidence, fix };
        }

        

        // Helper: Integral parser (tek otorite parseIntegralValue)

        const intH = (p) => parseIntegralValue(p?.integ ?? p?.integral);

        

        // Helper: In range check

        const inRange = (x, [a, b]) => x >= a && x <= b;

        

        // Run detailed audits (before main audit to populate coverageReport)

        const methylAudit = methylClassAudit(k, safeH1, safeC13, safeCorr.hsqc);

        const sugarAudit = sugarRegionAssignment(safeH1, safeC13, safeCorr.hsqc, safeCorr.cosy, safeCorr.hmbc, k);

        

        // Add methyl audit issues to main report (P0: sadece beklenen metil sınıfı varsa çalışır)
        const hasExpectedMethyl = (methylAudit.expected_methyls && methylAudit.expected_methyls.length > 0);
        if (hasExpectedMethyl && methylAudit.mismatches.length > 0) {

            methylAudit.mismatches.forEach(m => {

                warnings.push(createIssue("WARN", "QC_METHYL_CLASS_MISMATCH", 

                    `${m.expected.class} mismatch: ${m.reason}`, 

                    { class: m.expected.class, reason: m.reason },

                    { expected: m.expected, observed: m.observed },

                    [{ action: "fix", target: m.reason === "H-missing" ? "1H" : "13C", params: {}, why: m.fix }]));

                score -= 3;

            });

        }

        

        if (hasExpectedMethyl && methylAudit.missing.length > 0) {

            methylAudit.missing.forEach(m => {

                warnings.push(createIssue("WARN", "QC_METHYL_CLASS_MISSING",

                    `${m.expected.class} expected but not found`,

                    { class: m.expected.class },

                    { expected: m.expected },

                    [{ action: "check", target: "spectra", params: {}, why: "Verify peak table completeness" }]));

                score -= 2;

            });

        }

        

        // Add sugar region issues

        if (sugarAudit.coverage.ratio < 0.7 && k.context === "GLYCOPEPTIDE") {

            warnings.push(createIssue("WARN", "QC_SUGAR_REGION_LOW_COVERAGE",

                `Sugar region HSQC coverage low (${(sugarAudit.coverage.ratio*100).toFixed(1)}%)`,

                { ratio: sugarAudit.coverage.ratio, expected: sugarAudit.coverage.expected, observed: sugarAudit.coverage.observed },

                { missing: sugarAudit.missing },

                [{ action: "check", target: "HSQC", params: {}, why: "Verify HSQC acquisition in 3.0-4.5 ppm region" }]));

            score -= 3;

        }

        

        // Coverage report structure

        const coverageReport = {

            atom: {},

            dbe: {},

            h1: {},

            c13: {},

            ms: {},

            ir: {},

            hsqc: {},

            cosy: {},

            hmbc: {},

            noesy: {},

            functional: {},

            carbonyl: {},

            aromatic: {},

            methyl: {}

        };



        // A) Input & Integrity Checks

        // A1) Null/Format Guard

        if (!k || !k.counts) {

            issues.push(createIssue("ERROR", "QC_INPUT_MISSING", "Kernel missing or invalid", {}, {}, [{ action: "recompute", target: "kernel", why: "Kernel must be initialized" }]));

            status = "FAILED";

            score = 0;

        }

        

        if (!Array.isArray(safeH1) || safeH1.length === 0) {

            warnings.push(createIssue("WARN", "QC_INPUT_MISSING", "1H NMR data missing", {}, {}, [{ action: "recompute", target: "1H", why: "1H generation required" }]));

        }

        

        if (!Array.isArray(safeC13) || safeC13.length === 0) {

            warnings.push(createIssue("WARN", "QC_INPUT_MISSING", "13C NMR data missing", {}, {}, [{ action: "recompute", target: "13C", why: "13C generation required" }]));

        }

        

        // A2) Duplicate / Outlier Screening (Context-aware)

        // Context-based ppm limits

        const H_MAX_PPM = {

            GLYCOPEPTIDE: 16.0, // Phenolic OH / strongly H-bonded OH can reach 14-16 ppm

            POLYPHENOL: 16.0,   // Flavonoid/polyphenol: H-bonded OH 13-16 ppm

            TAXANE: 13.0,

            MACROLIDE: 13.0,

            PEPTIDE: 13.0,

            GENERAL: 13.0

        };

        const maxHppm = H_MAX_PPM[k.context] || 13.0;

        

        const h1Outliers = safeH1.filter(p => {

            if (p.ppm < -0.2) return true;

            const glycoLike = (k.counts?.O || 0) >= 12 && (k.counts?.N || 0) >= 6 && (k.groups?.amide || 0) >= 2;

            if (p.ppm > maxHppm) {

                // Exception: GLYCOPEPTIDE/POLYPHENOL'de 13-16 ppm broad OH/NH sinyalleri outlier sayılmayacak

                if ((k.context === "GLYCOPEPTIDE" || k.context === "POLYPHENOL") && p.ppm <= 16.0 && 

                    (p.mult?.includes("br") || p.is_ex || p.assign?.includes("OH") || p.assign?.includes("NH"))) {

                    return false; // Allow phenolic OH / strongly H-bonded OH

                }

                if (glycoLike && p.ppm <= 15.0 && (p.is_ex || p.mult?.includes("br") || /OH|NH|phenolic|amide/i.test(String(p.assign || "")))) {

                    return false;

                }

                // Polyphenol-like (O>=4, rings>=2): GENERAL context'ta da 13-16 ppm br OH kabul

                const oCount = k.counts?.O ?? 0, rings = Math.floor((k.connectivityHints?.ringClosures || 0) / 2);

                if (k.context === "GENERAL" && p.ppm <= 16.0 && (p.mult?.includes("br") || /br|broad/i.test(String(p.mult||""))) && oCount >= 4 && rings >= 2) {

                    return false;

                }

                return true;

            }

            if (glycoLike && p.ppm > 13.0 && p.ppm <= 15.0 && (p.is_ex || p.mult?.includes("br") || /phenolic|OH/i.test(String(p.assign || "")))) {

                return false;

            }

            return false;

        });

        

        if (h1Outliers.length > 0) {

            issues.push(createIssue("ERROR", "QC_H1_OUTLIER", `${h1Outliers.length} 1H signals outside valid range (-0.2 to ${maxHppm} ppm)`, 

                { count: h1Outliers.length, maxPpm: maxHppm, context: k.context }, 

                { protons: h1Outliers.slice(0, 5) },

                [{ action: "repair", target: "1H", params: { removeOutliers: true }, why: "Outliers indicate generation error" }]));

            score -= 10;

        }

        

        const c13Outliers = safeC13.filter(c => c.ppm < -5 || c.ppm > 230);

        if (c13Outliers.length > 0) {

            issues.push(createIssue("ERROR", "QC_C13_OUTLIER", `${c13Outliers.length} 13C signals outside valid range (-5 to 230 ppm)`,

                { count: c13Outliers.length },

                { carbons: c13Outliers.slice(0, 5) },

                [{ action: "repair", target: "13C", params: { removeOutliers: true }, why: "Outliers indicate generation error" }]));

            score -= 10;

        }

        

        // C13 bin overflow check

        const binCounts = new Map();

        safeC13.forEach(c => {

            const bin = Math.round(c.ppm / T.binC13) * T.binC13;

            binCounts.set(bin, (binCounts.get(bin) || 0) + 1);

        });

        const overflowBins = Array.from(binCounts.entries()).filter(([bin, count]) => count > T.maxPerCbin);

        if (overflowBins.length > 0) {

            warnings.push(createIssue("WARN", "QC_C13_BIN_OVERFLOW", `${overflowBins.length} 13C bins exceed ${T.maxPerCbin} signals (overlap likely)`,

                { bins: overflowBins.length },

                { bins: overflowBins.slice(0, 5) },

                [{ action: "tune", target: "13C", params: { binSize: T.binC13 * 0.5 }, why: "Reduce bin size to prevent overlap" }]));

            score -= 2;

        }

        

        // B) Atom / Formula / Valence Consistency

        // B1) Atom count sanity

        const atomCounts = k.counts || {};

        const negativeAtoms = Object.entries(atomCounts).filter(([el, count]) => typeof count === 'number' && count < 0);

        if (negativeAtoms.length > 0) {

            issues.push(createIssue("ERROR", "QC_ATOM_NEGATIVE", `Negative atom counts detected: ${negativeAtoms.map(([el]) => el).join(", ")}`,

                { atoms: negativeAtoms },

                {},

                [{ action: "repair", target: "kernel", params: { fixNegative: true }, why: "Negative counts are physically impossible" }]));

            status = "FAILED";

            score -= 15;

        }

        

        const halogenSum = (atomCounts.F || 0) + (atomCounts.Cl || 0) + (atomCounts.Br || 0) + (atomCounts.I || 0);

        if (k.context === "MACROLIDE" && halogenSum > 2) {

            warnings.push(createIssue("WARN", "QC_HALOGEN_IMPROBABLE", `MACROLIDE context with ${halogenSum} halogens (unusual)`,

                { halogenSum },

                {},

                [{ action: "tune", target: "kernel", params: { verifyContext: true }, why: "Verify context classification" }]));

            score -= 3;

        }

        

        // B2) Formula string canonicalization (soft check)

        if (!k.counts.formula || typeof k.counts.formula !== 'string') {

            warnings.push(createIssue("WARN", "QC_FORMULA_FORMAT", "Formula string missing or invalid",

                {},

                {},

                [{ action: "recompute", target: "kernel", params: { regenerateFormula: true }, why: "Formula should be canonicalized" }]));

        }

        

        // B3) Valence heuristic

        const hCount = atomCounts.H || 0;

        const cCountFormula = atomCounts.C || 0;

        const nCount = atomCounts.N || 0;

        const xCount = halogenSum;

        

        // Parity check: 2C+2+N-H-X should be even

        const parity = (2 * cCountFormula + 2 + nCount - hCount - xCount) % 2;

        if (parity !== 0 && hCount > 0) {

            warnings.push(createIssue("WARN", "QC_PARITY_FAIL", `Hydrogen parity check failed (2C+2+N-H-X should be even)`,

                { parity, formula: k.counts.formula },

                {},

                [{ action: "tune", target: "kernel", params: { adjustHydrogen: true }, why: "Parity mismatch suggests H count error" }]));

            score -= 5;

        }

        

        // H range suspect

        const hCRatio = cCountFormula > 0 ? hCount / cCountFormula : 0;

        if (hCRatio < 0.5 || hCRatio > 3.0) {

            warnings.push(createIssue("WARN", "QC_H_RANGE_SUSPECT", `H/C ratio ${hCRatio.toFixed(2)} outside typical range (0.5-3.0)`,

                { hCRatio, hCount, cCountFormula },

                {},

                [{ action: "tune", target: "kernel", params: { verifyHydrogen: true }, why: "Unusual H/C ratio may indicate error" }]));

            score -= 3;

        }

        

        // C) DBE Audit

        // C1) DBE format control

        if (!Number.isFinite(k.dbe)) {

            issues.push(createIssue("ERROR", "QC_DBE_INVALID", `DBE is not a finite number (${k.dbe})`,

                { dbe: k.dbe },

                {},

                [{ action: "recompute", target: "kernel", params: { recalculateDBE: true }, why: "DBE must be calculable" }]));

            status = "DRAFT";

            score -= 10;

        } else if (k.dbe < 0) {

            issues.push(createIssue("ERROR", "QC_DBE_NEGATIVE", `DBE is negative (${k.dbe})`,

                { dbe: k.dbe },

                {},

                [{ action: "recompute", target: "kernel", params: { recalculateDBE: true }, why: "DBE cannot be negative" }]));
