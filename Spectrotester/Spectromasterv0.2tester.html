      function showGlobalError(title, detail) {
        try {
          var id = "spectromaster-fatal-overlay";
          if (document.getElementById(id)) return;
          var el = document.createElement("div");
          el.id = id;
          el.setAttribute("role", "alert");
          el.style.cssText = "position:fixed;inset:0;z-index:2147483647;overflow:auto;background:#0f172a;color:#fecdd3;font-family:ui-monospace,Consolas,monospace;padding:24px;box-sizing:border-box;";
          el.innerHTML =
            "<div style=\"max-width:720px;margin:0 auto;background:#450a0a;border:2px solid #f87171;border-radius:12px;padding:20px;\">" +
            "<h1 style=\"margin:0 0 12px 0;font-size:1.25rem;color:#fecaca;\">" + title + "</h1>" +
            "<pre style=\"white-space:pre-wrap;word-break:break-word;margin:0 0 16px 0;font-size:12px;color:#fecaca;\">" +
            String(detail || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") +

          (document.body || document.documentElement).appendChild(el);
        } catch (e) { console.error(e); }
      }
      window.addEventListener("error", function (ev) {
        console.error("SpectroMaster global error:", ev.error || ev.message, ev.filename, ev.lineno);
        var fn = (ev && ev.filename) ? String(ev.filename) : "";
        var fromOurPage = /Spectromasterv0\.2tester\.html/i.test(fn) || fn === "" || /^file:\/\//i.test(fn) && /Spectromaster/i.test(fn);
        if (!fromOurPage && /unpkg\.com|jsdelivr\.net|cdn\.tailwindcss\.com|googleapis\.com/i.test(fn)) return;
        var msg = (ev && ev.message) ? ev.message : "Bilinmeyen hata";
        var loc = fn ? ("\n" + fn + ":" + ev.lineno + ":" + ev.colno) : "";
        showGlobalError("SpectroMaster — yakalanmamış hata", msg + loc);
      });
      window.addEventListener("unhandledrejection", function (ev) {
        var r = ev && ev.reason;
        var msg = (r && r.message) ? r.message : String(r || "Promise rejection");
        console.error("SpectroMaster unhandledrejection:", r);
        showGlobalError("SpectroMaster — Promise hatası", msg);
      });

<body>

  <script type="text/babel">

    const { useState, useEffect, useMemo, useRef } = React;

    // ==========================================
    // v33 — Teorik Spektrum Üretimi ve Teyit Motoru (The Great Correction)
    // Changelog: V33_CHANGELOG.md
    // I) Q-carbon HSQC maskeleme (generate2D) | II) IR Ar C=C 1500/1580 (generateIR)
    // III) GNN_GUARDRAILS hazırlığı | IV) PPM clamp EXCHANGEABLE 10.5/13.8 (clampPPM)
    // V) Deferred render (requestIdleCallback) — OMNISCIENT_VERSION v33.0
    // VI) Integral: parseIntegralValue (0.634/2H/0,634); IR 2930 sadece sp3 C–H varsa
    // ==========================================

    // --- INTEGRAL PARSING (tek fonksiyon; ondalık nokta silinmez) ---
    const parseIntegralValue = (raw) => {
      if (raw == null || raw === "") return 0;
      const str = String(raw).trim();
      if (!str) return 0;
      const m = str.match(/^(\d+)[.,]?(\d*)\s*H?$/i);
      if (!m) return Number(str) || 0;
      const frac = (m[2] || "").replace(/,/g, ".");
      return frac ? parseFloat(m[1] + "." + frac) : parseInt(m[1], 10);
    };
    const detectIntegralMode = (integralValues, expectedNonexchangeableH) => {
      const vals = (integralValues || []).filter(v => typeof v === "number" && v > 0);
      if (vals.length === 0) return "unknown";
      const mostlyBelow = vals.filter(v => v < 1.2).length;
      if (mostlyBelow >= vals.length * 0.7) return "relative_area";
      const mostlyInteger = vals.filter(v => Math.abs(v - Math.round(v)) < 0.01).length;
      if (mostlyInteger >= vals.length * 0.7) return "absolute_h";
      return "unknown";
    };

    /** URL ?spectromaster_debug=1 veya localStorage SPECTROMASTER_DEBUG=1 ile konsol debug (protokol: düşük gürültü, tek prefix). */
    const SPECTROMASTER_DEBUG = (() => {
      try {
        if (typeof window === "undefined") return false;
        const q = String(window.location?.search || "");
        if (q.includes("spectromaster_debug=1") || q.includes("spectromaster_debug=true")) return true;
        return window.localStorage?.getItem("SPECTROMASTER_DEBUG") === "1";
      } catch (_) {
        return false;
      }
    })();

    function spectromasterDebug(tag, payload) {
      if (!SPECTROMASTER_DEBUG || typeof console === "undefined") return;
      if (payload !== undefined) console.debug("[SpectroMaster]", tag, payload);
      else console.debug("[SpectroMaster]", tag);
    }

    /**
     * BLOK B — Değiştirilebilir proton: audit ve verify1H için tek tespit (mult normalizasyonu, ppm yedekleri, GLYCOPEPTIDE NH).
     * @param {object} s — ¹H pik objesi
     * @param {object} [kernelCtx] — { context } (opsiyonel; kernel nesnesi de verilebilir, .context okunur)
     */
    function isExchangeableProtonUnified(s, kernelCtx) {
      if (!s) return false;
      if (s.is_ex === true) return true;
      const ppmRaw = s.ppm != null ? s.ppm : (s.shift ?? s.ppm_H);
      const ppm = parseFloat(ppmRaw);
      if (!Number.isFinite(ppm)) return false;
      const multNorm = String(s.mult || "").toLowerCase().replace(/\s+/g, "").trim();
      const intFromPeak = parseIntegralValue(s.integ ?? s.integral);
      const integral = (Number.isFinite(intFromPeak) && intFromPeak > 0) ? intFromPeak : 1;
      const as = String(s.assign || "");
      const isBroad = multNorm.includes("br") || multNorm === "bs" || multNorm === "brs";
      const ctx = (kernelCtx && typeof kernelCtx === "object" && kernelCtx.context != null)
        ? String(kernelCtx.context).toUpperCase()
        : "";
      const explicitXH = /(^|[^A-Z])(OH|NH|NH2|SH|COOH|PHENOLIC OH|AMIDE NH)([^A-Z]|$)/i.test(as);
      if (explicitXH) return true;
      if (ctx === "GLYCOPEPTIDE" && ppm >= 6.5 && ppm <= 9.5 && multNorm.includes("br") && /NH|amide|Amide/i.test(as)) return true;
      const mRaw = String(s.mult || "").toLowerCase();
      const aLow = as.toLowerCase();
      if (/broad|exch|oh|nh|nh2|n\-?h/i.test(mRaw + " " + aLow) && explicitXH) return true;
      return false;
    }

    function classifyMissingHSQCCause({ signal, hasAuthoritativeHsqc, duplicateCollapse = false, lowSnr = false, solventSuppression = false }) {
      const as = String(signal?.assign || "");
      const cat = String(signal?.category || "");
      const explicitXH = /(^|[^A-Z])(OH|NH|NH2|SH|COOH|PHENOLIC OH|AMIDE NH)([^A-Z]|$)/i.test(as);
      const carbonBound = /CH|ALIPHATIC|AROM|BENZYL|METH|METHYL|METHYLENE|OCH|OCH2/i.test(as + " " + cat) && !explicitXH;
      if (!hasAuthoritativeHsqc) return "missing_authoritative_data";
      if (explicitXH && !carbonBound) return "true_exchangeable_XH";
      if (duplicateCollapse) return "duplicate_collapse";
      if (solventSuppression) return "solvent_suppression";
      if (lowSnr) return "low_snr";
      return "overlap";
    }
    function classifyMissingHSQCCauseStrict(input) {
      const allowed = new Set([
        "true_exchangeable_XH",
        "overlap",
        "low_snr",
        "solvent_suppression",
        "duplicate_collapse",
        "missing_authoritative_data",
        "weak_transfer_exception"
      ]);
      const cause = classifyMissingHSQCCause(input || {});
      return allowed.has(cause) ? cause : "overlap";
    }

    /**
     * BLOK A — ¹H integral audit: çözücü maskesi + exch_eff + non-exch havuzu (validateCoverage.coverageReport.h1 ile verify1H B1 tek kaynak).
     * @param {object} kernel — counts.H, h_exch, context
     * @param {Array} h1List — ¹H sinyalleri
     * @param {object} [options] — { solventRangesH1 }
     */
    function computeH1IntegralAudit(kernel, h1List, options) {
      const k = kernel || {};
      const opts = options || {};
      const solventRangesH1 = opts.solventRangesH1 || [[2.45, 2.55], [3.30, 3.35], [4.7, 4.9]];
      const isInSolventRangeH1 = (ppm) => solventRangesH1.some(r => (ppm || 0) >= r[0] && (ppm || 0) <= r[1]);
      const safeH1 = Array.isArray(h1List) ? h1List : [];
      const cleanH1 = safeH1.filter(s => {
        if (!s) return false;
        if (s.isSolvent === true || s.isContaminant === true || s._solvent === true) return false;
        const ppm = s.ppm != null ? Number(s.ppm) : Number(s.shift ?? s.ppm_H);
        return !isInSolventRangeH1(Number.isFinite(ppm) ? ppm : NaN);
      });
      const intHPeak = (p) => parseIntegralValue(p?.integ ?? p?.integral);
      let hSum = 0;
      let observedLikelyExchH = 0;
      for (const s of cleanH1) {
        const n = intHPeak(s);
        const v = Number.isFinite(n) && n > 0 ? n : 0;
        if (isExchangeableProtonUnified(s, k)) observedLikelyExchH += v;
        else hSum += v;
      }
      const totalHKernel = k.counts?.H || 0;
      const structuralExchH = Math.min(totalHKernel, Math.max(0, k.h_exch || 0));
      const exchEffH = Math.min(totalHKernel, Math.max(structuralExchH, Math.round(observedLikelyExchH)));
      const hIntegralExpectedPool = Math.max(0, totalHKernel - exchEffH);
      const hRatio = hIntegralExpectedPool > 0 ? hSum / hIntegralExpectedPool : 0;
      return { hSum, observedLikelyExchH, totalHKernel, structuralExchH, exchEffH, hIntegralExpectedPool, hRatio };
    }

    function h1PeakPpm(s) {
      if (!s) return NaN;
      const v = s.ppm != null ? s.ppm : (s.shift ?? s.ppm_H);
      const n = Number(v);
      return Number.isFinite(n) ? n : NaN;
    }

    function inPpmRangeUnified(ppm, range) {
      return Number.isFinite(ppm) && ppm >= range[0] && ppm <= range[1];
    }

    /**
     * BLOK C — Vinilik ¹H: audit (classCounts) ile generate2D isVinylicProton aynı kurallar (ppm yedekleri, br hariç, MACROLIDE/GLYCOPEPTIDE şeker bandı).
     */
    function isVinylicProtonUnified(h, kernelCtx) {
      if (!h) return false;
      if (h.is_ex === true) return false;
      const multNorm = String(h.mult || "").toLowerCase().replace(/\s+/g, "");
      if (multNorm.includes("br")) return false;
      const ppm = h1PeakPpm(h);
      if (!Number.isFinite(ppm)) return false;
      const ctx = (kernelCtx && typeof kernelCtx === "object" && kernelCtx.context != null)
        ? String(kernelCtx.context).toUpperCase()
        : "";
      if ((ctx === "MACROLIDE" || ctx === "GLYCOPEPTIDE") && inPpmRangeUnified(ppm, [4.0, 5.55])) return false;
      if (h.meta && h.meta.isVinylic === true) return true;
      return inPpmRangeUnified(ppm, [4.7, 6.7]) &&
        (multNorm.includes("d") || multNorm.includes("dd") || multNorm.includes("dt"));
    }

    function filterNumericHsqcPairs(hsqcList) {
      return (Array.isArray(hsqcList) ? hsqcList : []).filter(x =>
        x && x.h != null && x.c != null && typeof x.h === "number" && typeof x.c === "number");
    }

    function computeHsqcExpectedCorrelationCount(cProtonated, exchH) {
      const ex = Math.max(0, Number(exchH) || 0);
      const cp = Math.max(0, Number(cProtonated) || 0);
      return Math.max(1, cp - ex);
    }

    /**
     * BLOK D — HSQC kapsam metrikleri: numeric çiftler, assigned sayımı, non-exch ¹H pik sayısı (isExchangeableProtonUnified), beklenen korelasyon (C_prot − exch).
     */
    function computeHsqcCoverageAudit(arg) {
      const { kernel, h1Signals, hsqcList, cProtonated, exchH } = arg || {};
      const k = kernel || {};
      const hsqc = Array.isArray(hsqcList) ? hsqcList : [];
      const authoritativeHsqc = hsqc.filter((x) => {
        const p = String(x?.provenance_type || "");
        const a = String(x?.assign || "");
        const isFallback = p === "DISPLAY_FALLBACK" || a.startsWith("THEORETICAL_FALLBACK_") || x?.is_display_only === true || x?.derived_from_fallback === true;
        return !isFallback && x?.is_authoritative_for_scoring !== false;
      });
      const fallbackHsqc = hsqc.filter((x) => !authoritativeHsqc.includes(x));
      const realHsqc = filterNumericHsqcPairs(authoritativeHsqc);
      const assignedPairsCount = authoritativeHsqc.filter(h =>
        h && h.c !== null && h.c !== undefined && !String(h.assign || "").includes("UNASSIGNED")).length;
      const h1Arr = Array.isArray(h1Signals) ? h1Signals : [];
      const nonExchPeakCount = h1Arr.filter(h => !isExchangeableProtonUnified(h, k)).length;
      const expectedCorrelationCount = computeHsqcExpectedCorrelationCount(cProtonated, exchH);
      const ratioHsqcToExpectedC = expectedCorrelationCount > 0 ? realHsqc.length / expectedCorrelationCount : 0;
      const assignedRatioToNonExchPeaks = nonExchPeakCount > 0 ? assignedPairsCount / nonExchPeakCount : 0;
      return {
        realHsqc,
        realHsqcCount: realHsqc.length,
        authoritativeHsqcCount: authoritativeHsqc.length,
        fallbackHsqcCount: fallbackHsqc.length,
        scoreEligibleHsqcCount: realHsqc.length,
        assignmentAuthority: authoritativeHsqc.length > 0 ? "AUTHORITATIVE" : "NONE",
        assignedPairsCount,
        nonExchPeakCount,
        expectedCorrelationCount,
        ratioHsqcToExpectedC,
        assignedRatioToNonExchPeaks
      };
    }

    function c13PeakPpm(c) {
      if (!c) return NaN;
      const v = c.ppm != null ? c.ppm : c.shift;
      const n = Number(v);
      return Number.isFinite(n) ? n : NaN;
    }

    function defaultInRangePpm(x, range) {
      return Number.isFinite(x) && x >= range[0] && x <= range[1];
    }

    function tallyC13DistributionClustered(clustered) {
      const list = Array.isArray(clustered) ? clustered : [];
      let qCount = 0, chCount = 0, ch2Count = 0, ch3Count = 0;
      for (const s of list) {
        const t = String(s.type || "").toUpperCase();
        if (t === "CH3") ch3Count++;
        else if (t === "CH2") ch2Count++;
        else if (t === "CH") chCount++;
        else if (t === "Q" || t === "CQ") qCount++;
      }
      const cCount = list.length;
      const totalTyped = ch3Count + ch2Count + chCount + qCount;
      return { qCount, chCount, ch2Count, ch3Count, totalTyped, cCount };
    }

    /**
     * BLOK E — ¹³C QC anlık görüntü: verify13C ile aynı clusterC13 + overflow düzeltmesi + tip sayımı.
     */
    function computeC13QcSnapshot(arg) {
      const { kernel, c13List, ppmTolAliph, ppmTolArom } = arg || {};
      const k = kernel || {};
      const raw = Array.isArray(c13List) ? c13List : [];
      const pAl = ppmTolAliph != null ? ppmTolAliph : 0.3;
      const pAr = ppmTolArom != null ? ppmTolArom : 0.3;
      let clustered;
      try {
        clustered = typeof clusterC13 === "function" ? clusterC13(raw, pAl, pAr) : raw.slice();
      } catch (e) {
        spectromasterDebug("computeC13QcSnapshot:clusterC13_fallback", e && e.message);
        clustered = raw.slice();
      }
      const C_found = clustered.length;
      const overflowAdj = typeof spectromasterCountC13BinOverflow === "function"
        ? spectromasterCountC13BinOverflow(clustered, 0.3) : 0;
      const C_adj = C_found + overflowAdj;
      const typeCounts = { CH3: 0, CH2: 0, CH: 0, Cq: 0, Q: 0 };
      clustered.forEach(s => {
        const t = String(s.type || "").toUpperCase();
        if (t === "CH3") typeCounts.CH3++;
        else if (t === "CH2") typeCounts.CH2++;
        else if (t === "CH") typeCounts.CH++;
        else typeCounts.Cq++;
      });
      typeCounts.Q = typeCounts.Cq;
      const dist = tallyC13DistributionClustered(clustered);
      const C_expected = k.counts?.C || 0;
      const cRatioClustered = C_expected > 0 ? C_found / C_expected : 0;
      const cRatioRaw = C_expected > 0 ? raw.length / C_expected : 0;
      return {
        rawCount: raw.length,
        clustered,
        clusteredCount: C_found,
        C_adj,
        overflowAdj,
        typeCounts,
        dist,
        C_expected,
        cRatioClustered,
        cRatioRaw
      };
    }

    /**
     * BLOK F — ¹H metil sınıflandırması (audit F1 / metil QC); ppm yedekleri + integral tek parse.
     */
    function classifyMethyl1HUnified(peak, kernelCtx, inRangeFn) {
      const inR = typeof inRangeFn === "function" ? inRangeFn : defaultInRangePpm;
      if (!peak || peak.is_ex) return null;
      const ppm = h1PeakPpm(peak);
      if (!Number.isFinite(ppm)) return null;
      const intHVal = parseIntegralValue(peak.integ ?? peak.integral);
      if (intHVal < 2.5) return null;
      const groups = Math.round(intHVal / 3.0);
      if (groups === 0) return null;
      const k = kernelCtx || {};
      const multNorm = String(peak.mult || "").trim().toLowerCase();
      if (inR(ppm, [3.2, 4.0]) && multNorm === "s" && groups >= 1) {
        if (peak.assign?.includes("Methoxy") || peak.assign?.includes("OMe") ||
          (inR(ppm, [3.2, 4.0]) && multNorm === "s")) {
          return { class: "methoxy", groups, hTotal: intHVal };
        }
      }
      if (inR(ppm, [1.8, 2.3]) && multNorm === "s" && groups >= 1 &&
        (peak.assign?.includes("Acetate") || peak.assign?.includes("OAc") || peak.assign?.includes("Ac"))) {
        return { class: "acetate", groups, hTotal: intHVal };
      }
      if (inR(ppm, [2.1, 3.3]) && multNorm === "s" && groups >= 1 &&
        (peak.assign?.includes("NMe") || peak.assign?.includes("N-Methyl") || peak.assign?.includes("NMe2"))) {
        return { class: "n_methyl", groups, hTotal: intHVal };
      }
      if (inR(ppm, [1.0, 1.4]) && groups >= 1 && k.context === "GLYCOPEPTIDE") {
        return { class: "sugar_me", groups, hTotal: intHVal };
      }
      if (k.context === "MACROLIDE" && inR(ppm, [0.92, 1.48]) && groups >= 1) {
        const ml = multNorm.replace(/\s/g, "");
        if (ml.includes("d") || ml.includes("t") || ml.includes("q") || ml.includes("m")) {
          return { class: "sugar_me", groups, hTotal: intHVal };
        }
      }
      if (inR(ppm, [0.5, 1.0]) && multNorm === "s" && groups >= 1 && k.context === "TAXANE") {
        return { class: "tertiary_me", groups, hTotal: intHVal };
      }
      const alkylHmax = k.context === "MACROLIDE" ? 1.85 : 1.4;
      if (inR(ppm, [0.55, alkylHmax]) && groups >= 1) {
        return { class: "alkyl", groups, hTotal: intHVal };
      }
      return null;
    }

    function expectedCarbonylGroupsFromKernel(k) {
      const g = k?.groups || {};
      return (g.ketone || 0) + (g.ester || 0) + (g.amide || 0) + (g.acid || 0) + (g.aldehyde || 0);
    }

    /**
     * BLOK G — Karbonil / fonksiyonel grup çapraz kontrol (¹³C ppm yedekleri + breakdown; audit ↔ teyit aynı kaynak).
     */
    function computeCarbonylGroupAudit(k, c13List, inRangeFn) {
      const inR = typeof inRangeFn === "function" ? inRangeFn : defaultInRangePpm;
      const list = Array.isArray(c13List) ? c13List : [];
      const carbonylCount = list.filter(s => {
        const p = c13PeakPpm(s);
        return Number.isFinite(p) && p > 160 && String(s.category || "").toUpperCase() === "CARBONYL";
      }).length;
      const expectedCarbonyls = expectedCarbonylGroupsFromKernel(k);
      const carbonylRatio = expectedCarbonyls > 0 ? carbonylCount / expectedCarbonyls : 0;
      const breakdown = {
        ketone: list.filter(s => {
          const p = c13PeakPpm(s);
          return Number.isFinite(p) && p >= 195 && String(s.assign || "").includes("Ketone");
        }).length,
        ester: list.filter(s => {
          const p = c13PeakPpm(s);
          return inR(p, [165, 175]) && String(s.assign || "").includes("Ester");
        }).length,
        amide: list.filter(s => {
          const p = c13PeakPpm(s);
          return inR(p, [165, 175]) && String(s.assign || "").includes("Amide");
        }).length,
        acid: list.filter(s => {
          const p = c13PeakPpm(s);
          return inR(p, [175, 185]) && String(s.assign || "").includes("Acid");
        }).length,
        aldehyde: list.filter(s => {
          const p = c13PeakPpm(s);
          return inR(p, [190, 205]) && String(s.assign || "").includes("Aldehyde");
        }).length
      };
      return { expectedCarbonyls, carbonylCount, carbonylRatio, breakdown };
    }

    function findC13SignalNearPpm(c13List, cPpm, tol) {
      const list = Array.isArray(c13List) ? c13List : [];
      const target = Number(cPpm);
      const t = tol != null ? tol : 0.08;
      if (!Number.isFinite(target)) return null;
      for (const c of list) {
        const p = c13PeakPpm(c);
        if (Number.isFinite(p) && Math.abs(p - target) < t) return c;
      }
      return null;
    }

    /** BLOK H2 — HSQC çiftinin ¹³C ucunun Q/Cq olması (tek tarama). */
    function findHsqcLinkedToQuaternaryCarbon(hsqcList, c13List, tolC) {
      const hsqc = Array.isArray(hsqcList) ? hsqcList : [];
      return hsqc.filter(h => {
        if (!h || h.c === null || h.c === undefined) return false;
        const cSig = findC13SignalNearPpm(c13List, h.c, tolC != null ? tolC : 0.08);
        if (!cSig) return false;
        const ty = String(cSig.type || "").toUpperCase();
        return ty === "Q" || ty === "CQ";
      });
    }

    function carbonTypeForHsqcQcUnified(c, hPpm) {
      if (!c) return null;
      const hp = Number(hPpm);
      const cp = c13PeakPpm(c);
      const t = String(c.type || "").toUpperCase();
      if (t === "CH3") return "CH3";
      if (Number.isFinite(hp) && Number.isFinite(cp) && hp >= 0.5 && hp <= 2.5 && cp >= 5 && cp <= 45 && (t === "CH" || t === "CH2")) return "CH3";
      return c.type;
    }

    /** BLOK H3 — CH ↔ CH3 HSQC tip uyumsuzlukları (audit ile aynı). */
    function findProblematicHsqcCHCh3Mismatches(hsqcList, h1List, c13List, intHFn) {
      const intH = typeof intHFn === "function" ? intHFn : (h) => parseIntegralValue(h?.integ ?? h?.integral);
      const hsqc = Array.isArray(hsqcList) ? hsqcList : [];
      const h1 = Array.isArray(h1List) ? h1List : [];
      const c13 = Array.isArray(c13List) ? c13List : [];
      return hsqc.filter(hsqc => {
        if (!hsqc || hsqc.c === null || hsqc.c === undefined) return false;
        const hSig = h1.find(h => Math.abs(h1PeakPpm(h) - hsqc.h) < 0.05);
        const cSig = c13.find(c => Number.isFinite(c13PeakPpm(c)) && Math.abs(c13PeakPpm(c) - hsqc.c) < 0.5);
        if (!hSig || !cSig) return false;
        const ih = intH(hSig);
        const isMethylH = ih >= 3 && ih % 3 === 0;
        const cEff = carbonTypeForHsqcQcUnified(cSig, h1PeakPpm(hSig));
        const ct = String(cSig.type || "").toUpperCase();
        if (isMethylH && cEff !== "CH3") return true;
        if (hSig.assign?.includes("Anomeric") && ct === "CH3") return true;
        if (hSig.assign?.includes("Alpha-CH") && ct === "CH3") return true;
        return false;
      });
    }

    /** BLOK H4 — Aromatik δH / δC HSQC eşleşme sayısı. */
    function countAromaticHsqcCorrelations(hsqcList, h1List, c13List, inRangeFn) {
      const inR = typeof inRangeFn === "function" ? inRangeFn : defaultInRangePpm;
      const hsqc = Array.isArray(hsqcList) ? hsqcList : [];
      const h1 = Array.isArray(h1List) ? h1List : [];
      const c13 = Array.isArray(c13List) ? c13List : [];
      return hsqc.filter(hsqc => {
        if (!hsqc || hsqc.c === null || hsqc.c === undefined) return false;
        const hSig = h1.find(h => Math.abs(h1PeakPpm(h) - hsqc.h) < 0.05);
        const cSig = c13.find(c => Number.isFinite(c13PeakPpm(c)) && Math.abs(c13PeakPpm(c) - hsqc.c) < 0.5);
        if (!hSig || !cSig) return false;
        const hppm = h1PeakPpm(hSig);
        const cppm = c13PeakPpm(cSig);
        return inR(hppm, [6.3, 8.6]) && inR(cppm, [110, 160]);
      }).length;
    }

    // Deterministic RNG (mulberry32) – seed varsa tekrarlanabilir çıktı için

    function mulberry32(seed) {

        return function() {

            let t = seed += 0x6D2B79F5;

            t = Math.imul(t ^ t >>> 15, t | 1);

            t ^= t + Math.imul(t ^ t >>> 7, t | 61);

            return ((t ^ t >>> 14) >>> 0) / 4294967296;

        };

    }

    // ====================================================================
    // computeMolGraph — Minimal SMILES → Molecular Graph (No RDKit needed)
    // Detects Kekulé aromatic rings, sp2 carbons, carbonyls, ring systems
    // Returns: { nAromaticC, nArCH, nArQ, nVinylicC, nCarbonyl,
    //            nCH3, nCH2, nCH, nCq, aromaticRings[], hasAromaticRing }
    // ====================================================================
    function computeMolGraph(smiles) {
        const s = (smiles || '').replace(/\s+/g, '');
        const atoms = []; // {element, aromatic, idx}
        const bonds = []; // {from, to, order, isRing}
        const ringOpen = {}; // key -> {atomIdx, bondOrder}
        const branchStack = [];
        let prevAtom = -1;
        let pendingBond = 1;

        function newAtom(el, arom) {
            const idx = atoms.length;
            atoms.push({ element: el.toUpperCase(), aromatic: arom, idx });
            if (prevAtom >= 0) bonds.push({ from: prevAtom, to: idx, order: pendingBond, isRing: false });
            prevAtom = idx;
            pendingBond = 1;
            return idx;
        }

        let i = 0;
        while (i < s.length) {
            const c = s[i];
            if (c === '[') {
                let j = i + 1; while (j < s.length && s[j] !== ']') j++;
                const inner = s.slice(i + 1, j);
                const em = inner.match(/(\d+)?([A-Z][a-z]?|[a-z])/);
                if (em) { const raw = em[2]; const arom = /^[cnops]$/.test(raw); newAtom(raw.toUpperCase(), arom); }
                i = j + 1; pendingBond = 1; continue;
            }
            if ((c==='B'&&s[i+1]==='r')||(c==='C'&&s[i+1]==='l')||(c==='S'&&s[i+1]==='i')||(c==='N'&&s[i+1]==='a')) { newAtom(c+s[i+1],false); i+=2; pendingBond=1; continue; }
            if (/[A-Z]/.test(c)) { newAtom(c, false); i++; pendingBond=1; continue; }
            if (/[cnops]/.test(c)) { newAtom(c.toUpperCase(), true); i++; pendingBond=1.5; continue; }
            if (c==='=') { pendingBond=2; i++; continue; }
            if (c==='#') { pendingBond=3; i++; continue; }
            if (c===':') { pendingBond=1.5; i++; continue; }
            if (c==='-') { pendingBond=1; i++; continue; }
            if (c==='/'||c==='\\') { pendingBond=1; i++; continue; }
            if (c==='@') { i++; if (i<s.length&&s[i]==='@') i++; continue; }
            if (c==='.') { prevAtom=-1; i++; continue; }
            if (c==='(') { branchStack.push({ prevAtom, pendingBond }); i++; continue; }
            if (c===')') { const sv=branchStack.pop(); if(sv) prevAtom=sv.prevAtom; pendingBond=1; i++; continue; }
            if (/[1-9]/.test(c)) {
                const key = c;
                if (key in ringOpen) {
                    const {atomIdx:openIdx, bondOrder:rBond}=ringOpen[key];
                    bonds.push({from:openIdx, to:prevAtom, order:Math.max(rBond||1, pendingBond>1?pendingBond:1), isRing:true});
                    delete ringOpen[key];
                } else { ringOpen[key]={atomIdx:prevAtom, bondOrder:pendingBond}; }
                pendingBond=1; i++; continue;
            }
            if (c==='%'&&i+2<s.length) {
                const key=s.slice(i+1,i+3);
                if (key in ringOpen) {
                    const {atomIdx:openIdx, bondOrder:rBond}=ringOpen[key];
                    bonds.push({from:openIdx, to:prevAtom, order:Math.max(rBond||1, pendingBond>1?pendingBond:1), isRing:true});
                    delete ringOpen[key];
                } else { ringOpen[key]={atomIdx:prevAtom, bondOrder:pendingBond}; }
                pendingBond=1; i+=3; continue;
            }
            i++;
        }

        // Build adjacency
        const adj = atoms.map(() => []);
        for (const b of bonds) {
            adj[b.from].push({ to: b.to, order: b.order, isRing: b.isRing });
            adj[b.to].push({ to: b.from, order: b.order, isRing: b.isRing });
        }

        // Find ring members via BFS on non-ring bonds for each ring-closure bond
        const aromaticAtomSet = new Set();
        for (const a of atoms) { if (a.aromatic) aromaticAtomSet.add(a.idx); }

        const aromaticRings = [];
        const ringBonds = bonds.filter(b => b.isRing);
        for (const rb of ringBonds) {
            // BFS via non-ring bonds only (ring closure bond is what we're completing, not traversing)
            const queue = [[rb.from]]; const seen = new Set([rb.from]); let found = null;
            while (queue.length && !found) {
                const path = queue.shift(); const cur = path[path.length-1];
                for (const nb of adj[cur]) {
                    if (nb.isRing) continue; // Skip ALL ring bonds — traverse chain bonds only
                    if (nb.to === rb.to) { found = [...path, rb.to]; break; }
                    if (!seen.has(nb.to)) { seen.add(nb.to); queue.push([...path, nb.to]); }
                }
            }
            if (!found || found.length < 4 || found.length > 8) continue;

            const ring = found;
            const allAromatic = ring.every(idx => atoms[idx].aromatic);
            // Count double bonds strictly in ring
            let ringDB = 0;
            for (let j = 0; j < ring.length; j++) {
                const fr = ring[j], to = ring[(j+1)%ring.length];
                const bond = bonds.find(b=>(b.from===fr&&b.to===to)||(b.from===to&&b.to===fr));
                if (bond && bond.order >= 2) ringDB++;
            }
            const isAr6 = ring.length===6 && (allAromatic || ringDB===3);
            const isAr5 = ring.length===5 && (allAromatic || ringDB===2);
            if (!isAr6 && !isAr5) continue;

            ring.forEach(idx => aromaticAtomSet.add(idx));
            const carbonAtoms = ring.filter(idx => atoms[idx].element==='C');
            // Count substituents (atoms in ring with a non-ring neighbor that is not H-like)
            const substituents = carbonAtoms.filter(idx => adj[idx].some(nb => !ring.includes(nb.to))).length;
            const ringH = Math.max(0, carbonAtoms.length - substituents);
            aromaticRings.push({
                size: ring.length, atomIndices: ring,
                carbonCount: carbonAtoms.length, substitutionCount: substituents,
                hCount: ringH, isAr6, isAr5,
                // Check if ring has O-substituent (phenol-like)
                hasOxySubstituent: carbonAtoms.some(idx => adj[idx].some(nb => atoms[nb.to]?.element==='O' && !ring.includes(nb.to))),
                // Check catechol (two adjacent O-substituted carbons)
                hasTwoAdjacentO: (() => {
                    let count=0;
                    for (let j=0;j<ring.length;j++){
                        const a=ring[j], b=ring[(j+1)%ring.length];
                        const aHasO = adj[a].some(nb=>atoms[nb.to]?.element==='O'&&!ring.includes(nb.to));
                        const bHasO = adj[b].some(nb=>atoms[nb.to]?.element==='O'&&!ring.includes(nb.to));
                        if(aHasO&&bHasO) count++;
                    }
                    return count>0;
                })()
            });
        }

        const nAromaticC = [...aromaticAtomSet].filter(idx=>atoms[idx].element==='C').length;
        let nArCH = 0, nArQ = 0;
        for (const r of aromaticRings) { nArCH += r.hCount; nArQ += r.carbonCount - r.hCount; }

        // Vinylic C=C (not in aromatic ring)
        let nVinylicC = 0;
        const vinylicSet = new Set();
        for (const b of bonds) {
            if (b.order>=2 && atoms[b.from].element==='C' && atoms[b.to].element==='C') {
                if (!aromaticAtomSet.has(b.from)) { vinylicSet.add(b.from); }
                if (!aromaticAtomSet.has(b.to)) { vinylicSet.add(b.to); }
            }
        }
        nVinylicC = vinylicSet.size;

        // Carbonyls (C=O bonds)
        let nCarbonyl = 0;
        for (const b of bonds) {
            if (b.order>=2) {
                if (atoms[b.from].element==='C'&&atoms[b.to].element==='O') nCarbonyl++;
                else if (atoms[b.to].element==='C'&&atoms[b.from].element==='O') nCarbonyl++;
            }
        }

        // Atom typing by degree
        let nCH3=0, nCH2=0, nCH=0, nCq=0;
        for (const a of atoms) {
            if (a.element!=='C') continue;
            if (aromaticAtomSet.has(a.idx)) continue; // skip aromatic C (counted separately)
            const bondOrderSum = adj[a.idx].reduce((s,nb)=>s+Math.min(nb.order||1,2),0);
            const implH = Math.max(0, Math.round(4 - bondOrderSum));
            if (implH===3) nCH3++;
            else if (implH===2) nCH2++;
            else if (implH===1) nCH++;
            else nCq++;
        }

        return { atoms, bonds, adj, nAromaticC, nArCH, nArQ, nVinylicC, nCarbonyl, nCH3, nCH2, nCH, nCq, aromaticRings, hasAromaticRing: aromaticRings.length>0 };
    }

    /** Graph-derived features (MoleculeGraph from parse_and_standardize). NO REGEX. Single source of truth. */
    function computeGraphFeaturesFromGraph(mg) {
        if (!mg || !mg.atoms || !mg.bonds) return null;
        const atoms = mg.atoms;
        const bonds = mg.bonds;
        const counts = mg.atomCounts || {};
        let nC_aromatic = 0, nH_aromatic = 0, nC_sp2_non_aromatic = 0, nC_carbonyl = 0;
        let nCH3 = 0, nCH2 = 0, nCH = 0, nC_quaternary = 0, nH_exchangeable = 0;
        const isC = (i) => atoms[i]?.symbol === 'C';
        const isO = (i) => atoms[i]?.symbol === 'O';
        for (let i = 0; i < atoms.length; i++) {
            const a = atoms[i];
            if (a.symbol === 'C') {
                const h = a.implicitHydrogens ?? 0;
                if (a.isAromatic) { nC_aromatic++; nH_aromatic += h; }
                else if ((a.hybridization || '').toLowerCase().includes('sp2')) nC_sp2_non_aromatic++;
                if (h === 3) nCH3++; else if (h === 2) nCH2++; else if (h === 1) nCH++; else if (h === 0) nC_quaternary++;
            }
        }
        for (const b of bonds) {
            const order = b.bondOrder || (b.isAromatic ? 1.5 : 1);
            if (order >= 2 && isC(b.beginAtomIdx) && isO(b.endAtomIdx)) nC_carbonyl++;
            if (order >= 2 && isC(b.endAtomIdx) && isO(b.beginAtomIdx)) nC_carbonyl++;
        }
        for (let i = 0; i < atoms.length; i++) {
            const a = atoms[i];
            const h = a.implicitHydrogens ?? 0;
            if (a.symbol === 'O' && h >= 1) nH_exchangeable += h;
            if (a.symbol === 'N' && h >= 1) nH_exchangeable += Math.min(h, 2);
            if (a.symbol === 'S' && h >= 1) nH_exchangeable += h;
        }
        const has_nitrile = bonds.some(b => b.bondOrder >= 3 && (atoms[b.beginAtomIdx]?.symbol === 'N' || atoms[b.endAtomIdx]?.symbol === 'N'));
        const nX = (counts.F||0)+(counts.Cl||0)+(counts.Br||0)+(counts.I||0);
        return {
            nC_total: counts.C ?? 0, nH_total: counts.H ?? 0, dbe: mg.dbe ?? 0,
            nC_aromatic, nH_aromatic, nC_sp2_non_aromatic, nC_carbonyl,
            nCH3, nCH2, nCH, nC_quaternary, nH_exchangeable,
            nH_non_exchangeable: Math.max(0, (counts.H ?? 0) - nH_exchangeable),
            has_carbonyl: nC_carbonyl > 0, has_nitrile, has_halogen: nX > 0,
            atomCounts: { ...counts }
        };
    }

    class SpectroMasterKernel {

        constructor(smiles, config = {}) {

            // 1. Configuration

            this.rawSmiles = String(smiles ?? '').trim();

            this.config = {

                solvent: config.solvent || "DMSO-d6",

                frequency: config.frequency || 400,

                temperature: config.temperature || 298,

                ionMode: config.ionMode || "ESI_POS",

                strictMode: config.strictMode || false,

                seed: config.seed ?? null

            };

            this.graphOverrides = config.graphOverrides || null;

            this.seed = this.config.seed;

            this._rng = this.seed != null ? mulberry32(this.seed) : null;
